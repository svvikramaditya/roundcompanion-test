                className="w-full border border-slate-200 rounded-xl px-3 py-2.5 text-sm font-mono focus:outline-none focus:ring-2 focus:ring-teal-400" />
              <p className="text-xs text-slate-400">platform.openai.com/api-keys</p>
            </div>
            <div className="space-y-1.5">
              <label className="block text-xs font-semibold text-slate-600">Model</label>
              <select value={model} onChange={e => setModel(e.target.value)}
                className="w-full border border-slate-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-teal-400 bg-white">
                <option value="gpt-5.5">GPT-5.5 — best for clinical notes ⭐ NEW</option>
                <option value="gpt-4o">GPT-4o — good quality</option>
                <option value="gpt-4o-mini">GPT-4o Mini — faster &amp; cheaper</option>
                <option value="gpt-4-turbo">GPT-4 Turbo</option>
              </select>
            </div>
            {testResult && (
              <div className={`rounded-xl px-3 py-2 text-xs font-medium ${testResult.ok ? "bg-green-50 text-green-700 border border-green-200" : "bg-red-50 text-red-700 border border-red-200"}`}>
                {testResult.ok ? "✓ " : "✗ "}{testResult.msg}
              </div>
            )}
            <button
              onClick={testKey}
              onTouchEnd={e => { e.preventDefault(); if (!testing && key.trim()) testKey(); }}
              disabled={!key.trim() || testing}
              style={{width:"100%",padding:"12px",borderRadius:12,border:"2px solid #0d9488",
                background: testing?"#f0fdfa":"white",color:"#0d9488",fontWeight:700,
                fontSize:14,cursor: (!key.trim()||testing)?"not-allowed":"pointer",
                opacity:(!key.trim()||testing)?0.5:1,fontFamily:"system-ui"}}>
              {testing ? "⏳ Testing connection…" : "Test OpenAI Connection"}
            </button>
          </div>

          {/* Save all */}
          <button onClick={save}
            className="w-full bg-black text-white font-bold py-3 rounded-2xl text-sm transition-colors shadow-sm hover:bg-slate-800">
            {saved ? "✓ All Settings Saved!" : "Save All Settings"}
          </button>

          {/* Reset patient data */}
          <div className="border-t border-slate-100 pt-4">
            <p className="text-xs text-slate-400 mb-2 text-center">For testing — resets patient list to demo patients</p>
            <button onClick={() => {
              if (window.confirm("Reset patient list to demo patients? This will delete all your added patients and cannot be undone.")) {
                localStorage.removeItem("rounding_patients");
                window.location.reload();
              }
            }} className="w-full border border-red-200 text-red-500 font-medium py-2.5 rounded-2xl text-sm hover:bg-red-50 transition-colors">
              Reset to Demo Patients
            </button>
          </div>
        </div>
      </div>
    </div>
  );
};

// ─── Password Gate ────────────────────────────────────────────────────────────
// Change ACCESS_CODE below to whatever PIN you want physicians to use
const ACCESS_CODE = "2727";
const AUTH_KEY    = "roundai_auth_v1";

const isAuthed = () => {
  try { return localStorage.getItem(AUTH_KEY) === "granted"; } catch(e) { return false; }
};

const PasswordGate = ({ onUnlock }) => {
  const [pin, setPin]       = useState("");
  const [error, setError]   = useState(false);
  const [shake, setShake]   = useState(false);

  const tryPin = (p) => {
    if (p === ACCESS_CODE) {
      localStorage.setItem(AUTH_KEY, "granted");
      onUnlock();
    } else {
      setError(true);
      setShake(true);
      setTimeout(() => { setShake(false); setPin(""); setError(false); }, 700);
    }
  };

  const handleDigit = (d) => {
    const next = pin + d;
    setPin(next);
    if (next.length === ACCESS_CODE.length) {
      setTimeout(() => tryPin(next), 80);
    }
  };

  const digits = ["1","2","3","4","5","6","7","8","9","","0","⌫"];

  return (
    <div style={{position:"fixed",inset:0,background:"#0f172a",display:"flex",flexDirection:"column",
      alignItems:"center",justifyContent:"center",zIndex:99999,fontFamily:"system-ui"}}>

      {/* Logo */}
      <div style={{marginBottom:32,textAlign:"center"}}>
        <div style={{width:72,height:72,background:"#0d9488",borderRadius:20,display:"flex",
          alignItems:"center",justifyContent:"center",margin:"0 auto 12px",
          boxShadow:"0 8px 24px rgba(13,148,136,0.4)"}}>
          <span style={{color:"white",fontWeight:900,fontSize:28}}>RA</span>
        </div>
        <div style={{color:"white",fontWeight:700,fontSize:20}}>RoundAI</div>
        <div style={{color:"#94a3b8",fontSize:13,marginTop:4}}>Physician Assistant</div>
      </div>

      {/* PIN dots */}
      <div style={{
        display:"flex",gap:14,marginBottom:32,
        transform: shake ? "translateX(0)" : "none",
        animation: shake ? "shake 0.4s ease" : "none"
      }}>
        {Array.from({length: ACCESS_CODE.length}).map((_,i) => (
          <div key={i} style={{
            width:14,height:14,borderRadius:"50%",
            background: i < pin.length ? (error?"#ef4444":"#0d9488") : "rgba(255,255,255,0.2)",
            transition:"background 0.15s"
          }} />
        ))}
      </div>

      {error && <div style={{color:"#f87171",fontSize:13,marginBottom:16,fontWeight:600}}>Incorrect PIN — try again</div>}

      {/* Keypad */}
      <div style={{display:"grid",gridTemplateColumns:"repeat(3,72px)",gap:12}}>
        {digits.map((d, i) => (
          d === "" ? <div key={i} /> :
          <button key={i}
            onClick={() => {
              if (d === "⌫") { setPin(p => p.slice(0,-1)); setError(false); }
              else if (pin.length < ACCESS_CODE.length) handleDigit(d);
            }}
            style={{
              width:72,height:72,borderRadius:"50%",border:"none",
              background: d==="⌫" ? "rgba(255,255,255,0.08)" : "rgba(255,255,255,0.12)",
              color:"white",fontSize: d==="⌫"?22:26,fontWeight:600,
              cursor:"pointer",transition:"background 0.1s",
              WebkitTapHighlightColor:"transparent"
            }}
            onTouchStart={e => { e.currentTarget.style.background = d==="⌫"?"rgba(255,255,255,0.18)":"rgba(255,255,255,0.25)"; }}
            onTouchEnd={e => { e.currentTarget.style.background = d==="⌫"?"rgba(255,255,255,0.08)":"rgba(255,255,255,0.12)"; }}
          >
            {d}
          </button>
        ))}
      </div>

      <div style={{color:"#475569",fontSize:11,marginTop:32}}>RoundAI — Physician Access Only</div>

      <style>{`
        @keyframes shake {
          0%,100%{transform:translateX(0)}
          20%{transform:translateX(-8px)}
          40%{transform:translateX(8px)}
          60%{transform:translateX(-8px)}
          80%{transform:translateX(8px)}
        }
      `}</style>
    </div>
  );
};

function App() {
  // ── App mode: rounding | clinic ────────────────────────────────────────────
  const [appMode, setAppMode] = useState(() => localStorage.getItem("app_mode") || "rounding");
  const switchMode = (m) => { setAppMode(m); localStorage.setItem("app_mode", m); setScreen("list"); setSelectedId(null); };

  const [screen, setScreen] = useState("list");
  const [selectedId, setSelectedId] = useState(null);

  // ── Rounding patients ──────────────────────────────────────────────────────
  const [patients, setPatients] = useState(() => {
    try {
      const saved = localStorage.getItem("rounding_patients");
      if (saved) {
        const parsed = JSON.parse(saved);
        if (Array.isArray(parsed) && parsed.length > 0) {
          // Safe: runs once at startup in the initializer — no re-renders triggered
          const today = new Date().toDateString();
          return parsed.map(p => {
            let updates = {};
            // Auto-increment dayNum if last transcript was on a prior day
            if (p.transcriptDate && p.transcriptDate !== today && p.dayNum != null && p.dayNumLastIncrementedDate !== today) {
              updates.dayNum = (p.dayNum || 0) + 1;
              updates.dayNumLastIncrementedDate = today;
            }
            // Auto-reset status to pending when last round was on a prior calendar day
            if (p.status === "post-rounded" && p.transcriptDate && p.transcriptDate !== today) {
              updates.status = "pending";
            }
            return Object.keys(updates).length > 0 ? { ...p, ...updates } : p;
          });
        }
      }
    } catch(e) {}
    return INITIAL_PATIENTS;
  });
  useEffect(() => { try { localStorage.setItem("rounding_patients", JSON.stringify(patients)); } catch(e) {} }, [patients]);

  // ── Clinic patients ────────────────────────────────────────────────────────
  const [clinicPatients, setClinicPatients] = useState(() => {
    try {
      const saved = localStorage.getItem("clinic_patients");
      if (saved) {
        const parsed = JSON.parse(saved);
        if (Array.isArray(parsed)) return parsed;
      }
    } catch(e) {}
    return [];
  });
  useEffect(() => { try { localStorage.setItem("clinic_patients", JSON.stringify(clinicPatients)); } catch(e) {} }, [clinicPatients]);

  const [activeTab, setActiveTab] = useState("pre-round");
  const [showSettings, setShowSettings] = useState(false);
  const [showHandoff, setShowHandoff]   = useState(false);
  const [showTasks,   setShowTasks]     = useState(false);

  // Mic permission is handled by ensureMicStream() called inside each dictation button handler.

  const updatePatient = (id, updates) => {
    setPatients(prev => prev.map(p => p.id === id ? { ...p, ...updates } : p));
  };

  const deletePatient = (id) => {
    setPatients(prev => prev.filter(p => p.id !== id));
    // If currently viewing that patient, go back to list
    if (selectedId === id) setScreen("list");
  };

  const goToPatient = (patient) => {
    setSelectedId(patient.id);
    const defaultTab = patient.preRoundNotes
      ? patient.note ? "post-round" : "encounter"
      : "pre-round";
    setActiveTab(defaultTab);
    setScreen("patient");
  };

  const handleAddPatient = (newPatient) => {
    setPatients(prev => [...prev, newPatient]);
    setScreen("list");
  };

  const handleScanPatients = (newPatients) => {
    setPatients(prev => [...prev, ...newPatients]);
  };

  // ── Clinic handlers ────────────────────────────────────────────────────────
  const updateClinicPatient = (id, updates) => setClinicPatients(prev => prev.map(p => p.id === id ? { ...p, ...updates } : p));
  const deleteClinicPatient = (id) => { setClinicPatients(prev => prev.filter(p => p.id !== id)); if (selectedId === id) setScreen("list"); };
  const addClinicPatient = (p) => { setClinicPatients(prev => [...prev, p]); setScreen("list"); };
  const handleClinicScanConfirmed = ({ toLink, toCreate }) => {
    setClinicPatients(prev => {
      // Add new patient records
      let updated = toCreate.length > 0 ? [...prev, ...toCreate] : [...prev];
      // Link existing patients → set inTodaysSession: true
      if (toLink.length > 0) {
        const linkSet = new Set(toLink);
        updated = updated.map(p => linkSet.has(p.id) ? { ...p, inTodaysSession: true } : p);
      }
      return updated;
    });
  };
  const toggleClinicToday = (id) => setClinicPatients(prev => prev.map(p => p.id === id ? { ...p, inTodaysSession: !p.inTodaysSession } : p));
  const goToClinicPatient = (p) => { setSelectedId(p.id); setActiveTab("pre-visit"); setScreen("patient"); };

  const currentPatient = appMode === "clinic"
    ? clinicPatients.find(p => p.id === selectedId)
    : patients.find(p => p.id === selectedId);

  // ── Mode toggle bar (shown on list screens) ───────────────────────────────
  const ModeToggle = () => (
    <div style={{position:"fixed",top:0,left:"50%",transform:"translateX(-50%)",width:"100%",maxWidth:384,zIndex:200,display:"flex",justifyContent:"center",paddingTop:"calc(8px + env(safe-area-inset-top, 0px))",pointerEvents:"none"}}>
      <div style={{display:"flex",background:"rgba(15,23,42,0.92)",backdropFilter:"blur(8px)",borderRadius:50,padding:"3px",gap:2,pointerEvents:"all",boxShadow:"0 4px 20px rgba(0,0,0,0.3)"}}>
        <button onClick={() => switchMode("rounding")} style={{padding:"6px 18px",borderRadius:50,border:"none",cursor:"pointer",fontSize:12,fontWeight:700,transition:"all 0.2s",background: appMode==="rounding" ? "white" : "transparent",color: appMode==="rounding" ? "#0f172a" : "#94a3b8"}}>
          Rounding
        </button>
        <button onClick={() => switchMode("clinic")} style={{padding:"6px 18px",borderRadius:50,border:"none",cursor:"pointer",fontSize:12,fontWeight:700,transition:"all 0.2s",background: appMode==="clinic" ? "#0d9488" : "transparent",color: appMode==="clinic" ? "white" : "#94a3b8"}}>
          Clinic
        </button>
      </div>
    </div>
  );

  return (
    <div className="flex justify-center bg-slate-200 min-h-screen">
      <div className="w-full max-w-sm bg-slate-50 min-h-screen shadow-2xl relative overflow-x-hidden">
        {showSettings && <SettingsModal onClose={() => setShowSettings(false)} />}

        {/* ── ROUNDING MODE ─────────────────────────────────────────────── */}
        {appMode === "rounding" && showHandoff && (
          <HandoffScreen patients={patients} onBack={() => setShowHandoff(false)} />
        )}
        {appMode === "rounding" && showTasks && !showHandoff && (
          <TasksScreen patients={patients} onBack={() => setShowTasks(false)} />
        )}
        {appMode === "rounding" && screen === "list" && !showHandoff && !showTasks && (
          <><ModeToggle />
          <PatientListScreen
            patients={patients}
            onSelectPatient={goToPatient}
            onDashboard={() => setScreen("dashboard")}
            onAddPatient={() => setScreen("add-patient")}
            onSettings={() => setShowSettings(true)}
            onDeletePatient={deletePatient}
            onScanPatients={handleScanPatients}
            onHandoff={() => setShowHandoff(true)}
            onTaskExport={() => setShowTasks(true)}
          /></>
        )}
        {appMode === "rounding" && screen === "add-patient" && (
          <AddPatientScreen onBack={() => setScreen("list")} onAdd={handleAddPatient} />
        )}
        {appMode === "rounding" && screen === "patient" && currentPatient && (
          <PatientScreen
            patient={currentPatient}
            activeTab={activeTab}
            setActiveTab={setActiveTab}
            onBack={() => setScreen("list")}
            updatePatient={(updates) => updatePatient(currentPatient.id, updates)}
          />
        )}
        {appMode === "rounding" && screen === "dashboard" && (
          <DashboardScreen patients={patients} onBack={() => setScreen("list")} onSelectPatient={(p) => goToPatient(p)} />
        )}

        {/* ── CLINIC MODE ───────────────────────────────────────────────── */}
        {appMode === "clinic" && screen === "list" && (
          <><ModeToggle />
          <ClinicPatientListScreen
            patients={clinicPatients}
            onSelectPatient={goToClinicPatient}
            onAddPatient={() => setScreen("add-clinic-patient")}
            onSettings={() => setShowSettings(true)}
            onDeletePatient={deleteClinicPatient}
            onToggleToday={toggleClinicToday}
            onScanConfirmed={handleClinicScanConfirmed}
          /></>
        )}
        {appMode === "clinic" && screen === "add-clinic-patient" && (
          <AddClinicPatientScreen onBack={() => setScreen("list")} onAdd={addClinicPatient} />
        )}
        {appMode === "clinic" && screen === "patient" && currentPatient && (
          <ClinicPatientScreen
            patient={currentPatient}
            activeTab={activeTab}
            setActiveTab={setActiveTab}
            onBack={() => setScreen("list")}
            updatePatient={(updates) => updateClinicPatient(currentPatient.id, updates)}
          />
        )}
      </div>
    </div>
  );
}


    // Auth wrapper — keeps App hooks intact by rendering App only after unlock
    function RoundAIRoot() {
      const [unlocked, setUnlocked] = useState(isAuthed());
      if (!unlocked) return <PasswordGate onUnlock={() => setUnlocked(true)} />;
      return <App />;
    }

    ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(RoundAIRoot));
  </script>

  <!-- ── Service Worker Registration ──────────────────────────────────────── -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('/sw.js')
          .then(function(reg) {
            console.log('RoundAI SW registered:', reg.scope);
            // Prompt user when a new version is available
            reg.onupdatefound = function() {
              const newWorker = reg.installing;
              newWorker.onstatechange = function() {
                if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                  console.log('New RoundAI version available — refresh to update.');
                }
              };
            };
          })
          .catch(function(err) {
            console.log('SW registration failed:', err);
          });
      });
    }

    // iOS "Add to Home Screen" prompt helper — shown after 3 visits on Safari
    (function() {
      var visits = parseInt(localStorage.getItem('ra_visits') || '0') + 1;
      localStorage.setItem('ra_visits', visits);
      var isIos = /iphone|ipad|ipod/.test(navigator.userAgent.toLowerCase());
      var isStandalone = window.navigator.standalone;
      if (isIos && !isStandalone && visits === 3) {
        setTimeout(function() {
          var msg = document.createElement('div');
          msg.style.cssText = 'position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#0f172a;color:white;padding:14px 20px;border-radius:16px;font-size:13px;font-family:system-ui;z-index:99999;text-align:center;max-width:280px;box-shadow:0 8px 24px rgba(0,0,0,0.4);';
          msg.innerHTML = '📱 <strong>Install RoundAI</strong><br><span style="opacity:0.8;font-size:11px;">Tap the Share button below, then "Add to Home Screen" for the full app experience.</span>';
          var close = document.createElement('button');
          close.textContent = '✕';
          close.style.cssText = 'position:absolute;top:8px;right:10px;background:none;border:none;color:white;font-size:16px;cursor:pointer;';
          close.onclick = function() { document.body.removeChild(msg); };
          msg.appendChild(close);
          document.body.appendChild(msg);
          setTimeout(function() { if (document.body.contains(msg)) document.body.removeChild(msg); }, 8000);
        }, 2000);
      }
    })();
  </script>
</body>
