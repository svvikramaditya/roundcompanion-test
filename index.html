    const file = e.target.files && e.target.files[0];
    if (!file) return;
    setScanError("");
    setScanLoading(true);
    setScannedPatients([]);
    setSelectedScanned([]);

    // Preview
    const reader = new FileReader();
    reader.onload = async (ev) => {
      const dataUrl = ev.target.result;
      setScanPreview(dataUrl);
      // Strip the data:image/...;base64, prefix
      const base64 = dataUrl.split(",")[1];
      try {
        const resp = await callOpenAIVision(base64,
          `You are reading a hospital or nursing home physician rounding census sheet. Your job is to extract each patient row as structured data.

STRICT RULES:
- "name" field: ONLY the patient's first and last name (e.g. "Margaret Chen"). Do NOT include room numbers, diagnoses, dates, or any other data in this field.
- "room" field: ONLY the room or bed number (e.g. "301"). Do NOT include anything else.
- "diagnosis" field: ONLY the primary diagnosis or admission reason.
- "admit_date" field: admission date string if visible, else empty string.
- "day_num" field: hospital day number as an integer if visible, else 0.
- SKIP all header rows, column label rows, footer rows, and any row that does not represent an actual patient.
- SKIP rows where the "name" column contains words like "Patient Name", "Rm", "Room", "Attending", "Physician", or any other column header text.
- Each patient must appear EXACTLY ONCE in the output array.

Return ONLY valid JSON in this exact format:
{ "patients": [ { "name": "First Last", "room": "301", "diagnosis": "Heart failure", "admit_date": "Apr 20", "day_num": 3 } ] }`
        );
        const parsed = JSON.parse(resp);

        // Post-process: clean names and filter out header/junk rows
        const headerWords = ["patient", "name", "room", "rm", "diagnosis", "admit", "attending", "physician", "status", "primary", "unit", "date", "confidential", "facility"];
        const list = (parsed.patients || [])
          .map(p => ({
            ...p,
            // Strip leading room numbers accidentally included in name (e.g. "312 George Patel" → "George Patel")
            name: (p.name || "").trim().replace(/^\d{2,4}\s+/, "").trim(),
          }))
          .filter(p => {
            if (!p.name || p.name.trim().length < 3) return false;
            const lower = p.name.toLowerCase();
            // Filter out rows that look like column headers or footers
            if (headerWords.some(w => lower === w)) return false;
            if (lower.split(" ").every(word => headerWords.includes(word))) return false;
            // Filter out entries where name is suspiciously long (full row dumped into name)
            if (p.name.trim().split(" ").length > 5) return false;
            return true;
          });
        if (list.length === 0) {
          setScanError("No patients found in the image. Try a clearer photo.");
        } else {
          setScannedPatients(list);
          setSelectedScanned(list.map((_, i) => i));
        }
      } catch(err) {
        setScanError("Could not read image: " + (err.message || "Unknown error"));
      }
      setScanLoading(false);
    };

  const confirmScanAdd = () => {

              if (tp.new_tasks && Array.isArray(tp.new_tasks) && tp.new_tasks.length > 0) {
                const currentTasks = patient.tasks || [];
                const newItems = tp.new_tasks.filter(t => t && t.text && t.text.trim()).map((t, i) => ({
                  id: Date.now() + i + 9000,
                  text: t.text.trim(),
                  done: false,
                  category: t.category || "general",
                  urgent: !!t.urgent,
                }));
                const merged = mergeTasksDedup(currentTasks, newItems);
                if (merged.length > currentTasks.length) updatePatient({ tasks: merged });
              }
            } catch(e) {}
          }).catch(() => {});

        if (parts.length > 0) {

          setTimeout(() => setProcessedMsg(""), 4000);
        }
      }
      setLoading(false);
      setDone(true);
    } catch(e) {

      updatePatient({ preRoundNotes: input, status: "pre-rounded" });

      setDone(true);

                    <button onClick={() => setShowMedChanges(false)} className="text-slate-400 hover:text-slate-700"><X size={20} /></button>
                  </div>
                  <div className="space-y-2">
                    {(patient.medicationEvents || []).slice().reverse().map((evt, i) => {
                      const typeConfig = {
                        start:        { cls: "bg-green-100 text-green-800",   label: "started" },
                        resume:       { cls: "bg-green-100 text-green-800",   label: "resumed" },
                        stop:         { cls: "bg-red-100 text-red-800",       label: "discontinued" },
                        discontinued: { cls: "bg-red-100 text-red-800",       label: "discontinued" },
                        hold:         { cls: "bg-orange-100 text-orange-800", label: "held" },
                        increase:     { cls: "bg-amber-100 text-amber-800",   label: "increased" },
                        decrease:     { cls: "bg-blue-100 text-blue-800",     label: "decreased" },
                        change:       { cls: "bg-slate-100 text-slate-700",   label: "changed" },
                      };
                      const cfg = typeConfig[evt.type] || typeConfig.change;
                      return (
                        <div key={i} className="bg-white border border-slate-100 rounded-2xl px-4 py-3 shadow-sm">
                          <div className="flex items-center gap-2 mb-1">
                            <span className={`text-xs font-bold px-2 py-0.5 rounded-full ${cfg.cls}`}>{cfg.label}</span>

          <button

                      .replace(/Encounter complete\.?/gi, "")

                      .replace(/\.\s*\.\s*/g, ". ")   // fix double dots

            <button

              className={`text-xs font-semibold px-2.5 py-1 rounded-lg transition-colors ${editingVitals ? "bg-slate-200 text-slate-700" : "bg-black text-white hover:bg-slate-800"}`}
            >
              {editingVitals ? "Cancel" : <span className="flex items-center gap-1"><Edit3 size={11} /> Edit</span>}
            </button>

        {editingVitals ? (
          <div className="bg-white rounded-2xl border border-teal-200 shadow-sm p-4 space-y-3">

            {[
              { key: "bp",   label: "Blood Pressure",  placeholder: "e.g. 138/88 or stable" },
              { key: "hr",   label: "Heart Rate",       placeholder: "e.g. 82 or stable" },

// ─── TranscriptHistory: collapsible link groups for prior encounters ──────────

const TranscriptHistory = ({ patient }) => {
  const [openKey, setOpenKey] = useState(null);
  const [showTranscriptDay, setShowTranscriptDay] = useState(null);

  // Build all sessions: transcriptHistory items + the current transcript as the "most recent prior"
  const allSessions = [
    ...(patient.transcriptHistory || []),
    ...(patient.transcript && patient.transcript.length > 0
      ? [{ label: patient.transcriptHistory && patient.transcriptHistory.length > 0
              ? `Day ${(patient.transcriptHistory.length + 1)} · Most Recent`
              : `Day ${patient.dayNum || 1} · Most Recent`,
          entries: patient.transcript }]
      : []),
  ];

  if (allSessions.length === 0) return null;

  // For stays ≤ 4 days keep each session as its own link; for longer stays group 3–4 days together
  const groups = [];
  if (allSessions.length <= 4) {
    allSessions.forEach((s, i) => groups.push({ label: s.label, sessions: [s], key: i }));
  } else {
    const chunkSize = 3;
    for (let i = 0; i < allSessions.length; i += chunkSize) {
      const chunk = allSessions.slice(i, i + chunkSize);
      const firstDay = i + 1;
      const lastDay  = Math.min(i + chunkSize, allSessions.length);
      const label = chunk.length > 1 ? `Days ${firstDay}–${lastDay}` : chunk[0].label;
      groups.push({ label, sessions: chunk, key: i });
    }
  }

  return (
    <div className="space-y-2">
      {groups.map(group => {
        const totalEntries = group.sessions.reduce((a, s) => a + s.entries.length, 0);
        const isOpen = openKey === group.key;
        return (
          <div key={group.key} className="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
            <button
              onClick={() => setOpenKey(isOpen ? null : group.key)}
              className="w-full flex items-center justify-between px-4 py-3 text-left hover:bg-slate-50 transition-colors"
            >
              <div className="flex items-center gap-2">
                <History size={14} className="text-slate-400" />
                <span className="text-sm font-semibold text-slate-700">{group.label}</span>
                <span className="text-xs text-slate-400 bg-slate-100 px-1.5 py-0.5 rounded-full">{totalEntries} lines</span>
              </div>
              <ChevronDown size={16} className={`text-slate-400 transition-transform duration-200 ${isOpen ? "rotate-180" : ""}`} />
            </button>
            {isOpen && (
              <div className="border-t border-slate-100 max-h-72 overflow-y-auto">
                {group.sessions.map((session, si) => (
                  <div key={si}>
                    {group.sessions.length > 1 && (
                      <p className="text-xs font-bold text-slate-400 uppercase tracking-wide bg-slate-50 px-4 py-1.5 border-b border-slate-100">{session.label}</p>
                    )}
                    <div className="divide-y divide-slate-50">
                      {session.entries.map((entry, ei) => (
                        <div key={ei} className={`px-4 py-2.5 ${entry.speaker === "Pt" ? "bg-blue-50/40" : ""}`}>
                          <div className="flex items-center gap-2 mb-0.5">
                            <span className={`text-xs font-bold ${entry.speaker === "Dr" ? "text-teal-600" : "text-blue-600"}`}>
                              {entry.speaker === "Dr" ? "Physician" : "Patient"}
                            </span>
                            <span className="text-xs text-slate-400">{entry.time}</span>
                          </div>
                          <p className="text-sm text-slate-700 leading-relaxed">{entry.text}</p>
                        </div>
                      ))}
                    </div>
                  </div>
                ))}
              </div>
            )}
          </div>
        );
      })}

      {/* Transcript popup modal */}
      {showTranscriptDay && (
        <div className="fixed inset-0 z-50 flex items-end justify-center">
          <div className="absolute inset-0 bg-black/50" onClick={() => setShowTranscriptDay(null)} />
          <div className="relative w-full max-w-sm bg-white rounded-t-3xl shadow-2xl" style={{maxHeight:"80vh",overflowY:"auto"}}>
            <div className="flex justify-center pt-3 pb-1"><div className="w-10 h-1 bg-slate-200 rounded-full"/></div>
            <div className="px-5 pb-8 pt-2">
              <div className="flex items-center justify-between mb-3">
                <h3 className="text-base font-bold text-slate-800">{showTranscriptDay.label}</h3>
                <button onClick={() => setShowTranscriptDay(null)} className="text-slate-400 hover:text-slate-700"><X size={20}/></button>
              </div>
              <div className="space-y-2">
                {(showTranscriptDay.entries||[]).map((e,i)=>(
                  <div key={i} className={`px-3 py-2.5 rounded-xl text-sm ${e.speaker==="Dr"?"bg-teal-50 text-teal-900":"bg-slate-50 text-slate-700"}`}>
                    <span className="text-xs font-bold mr-2">{e.speaker==="Dr"?"Physician":"Patient"} {e.time||""}</span>
                    {e.text}
                  </div>
                ))}
                {(!showTranscriptDay.entries||showTranscriptDay.entries.length===0) && (
                  <p className="text-sm text-slate-400 text-center py-4">No transcript recorded for this day.</p>
                )}
              </div>
            </div>
          </div>
        </div>
      )}
    </div>
  );
};

// ─── Tab: Encounter ───────────────────────────────────────────────────────────

const EncounterTab = ({ patient, updatePatient, onNext }) => {
  const [recording, setRecording] = useState(false);
  // Claim 12: recording mode — "continuous" (tap to start/stop) or "push" (hold to record)
  const [recordingMode, setRecordingMode] = useState("continuous");
  const [liveTranscript, setLiveTranscript] = useState(() => {
    const today = new Date().toDateString();
    if (patient.transcriptDate === today && patient.transcript && patient.transcript.length > 0) {
      return patient.transcript;
    }
    return [];
  });
  const [interim, setInterim] = useState("");
  const [input, setInput] = useState(patient.encounterNotes || "");
  const [notesSaved, setNotesSaved] = useState(false);
  const [tasksUpdating, setTasksUpdating] = useState(false);
  const [taskUpdateMsg, setTaskUpdateMsg] = useState("");
  const [generating, setGenerating] = useState(false);
  const [showAsk, setShowAsk] = useState(false);
  const recognitionRef = useRef(null);
  const keepRecordingRef = useRef(false);
  const encounterInterimRef = useRef(""); // safety net for unconfirmed words

  // ── Whisper recording state ──────────────────────────────────────────────────
  const whisperRef = useRef(null); // holds { mediaRecorder, stream, chunks, stop }
  const usingWhisperRef = useRef(false);
  const [transcribing, setTranscribing] = useState(false);
  const [currentSpeaker, setCurrentSpeaker] = useState("Dr");
  const speakerChangesRef = useRef([]);   // [{timeSec, speaker}]
  const recordingStartRef  = useRef(null);

  // ── Template state ──────────────────────────────────────────────────────────
  const [selectedTemplate, setSelectedTemplate] = useState("soap");
  const [customTemplates, setCustomTemplates] = useState(() => getCustomTemplates());
  const [showCreateTemplate, setShowCreateTemplate] = useState(false);
  const allTemplates = [...DEFAULT_TEMPLATES, ...customTemplates];

  const [editingTemplate, setEditingTemplate] = useState(null); // template being edited

  const handleSaveTemplate = (template) => {
    // If editing an existing template, replace it in-place; otherwise append
    const updated = editingTemplate
      ? customTemplates.map(t => t.id === template.id ? template : t)
      : [...customTemplates, template];
    setCustomTemplates(updated);
    saveCustomTemplates(updated);
    setSelectedTemplate(template.id);
    setShowCreateTemplate(false);
    setEditingTemplate(null);
  };
  const handleDeleteTemplate = (id) => {
    const updated = customTemplates.filter(t => t.id !== id);
    setCustomTemplates(updated);
    saveCustomTemplates(updated);
    if (selectedTemplate === id) setSelectedTemplate("soap");
  };
  const openEditTemplate = (template) => {
    setEditingTemplate(template);
    setShowCreateTemplate(true);
  };

  // ── Encounter task management ──────────────────────────────────────────────
  const [editingEncTaskId, setEditingEncTaskId]     = useState(null);
  const [editingEncTaskText, setEditingEncTaskText] = useState("");
  const [newEncTaskText, setNewEncTaskText]         = useState(null);
  const [encTaskDictating, setEncTaskDictating]     = useState(false);
  const [encTaskInterim, setEncTaskInterim]         = useState("");
  const encTaskRecRef  = useRef(null);
  const encTaskKeepRef = useRef(false);
  const encTaskIntRef  = useRef("");

  const addEncTask = () => {
    if (!newEncTaskText || !newEncTaskText.trim()) { setNewEncTaskText(null); return; }
    // Split dictated/typed text into individual tasks on common separators
    const raw = newEncTaskText.trim();
    const parts = raw
      .split(/,\s*|\s*;\s*|\n+/)                         // split on commas, semicolons, newlines
      .map(s => s.replace(/^(and\s+|then\s+|also\s+)/i, "").trim()) // strip leading connectors
      .filter(s => s.length > 2);                        // drop empty / trivially short fragments
    const ts = parts.length > 0 ? parts : [raw];
    const newItems = ts.map((text, i) => ({
      id: Date.now() + i,
      text: text.charAt(0).toUpperCase() + text.slice(1),
      done: false,
      category: "plan",
      urgent: false,
    }));
    updatePatient({ tasks: [...patient.tasks, ...newItems] });
    setNewEncTaskText(null);
    if (encTaskDictating) { encTaskKeepRef.current = false; if (encTaskSessionRef.current) encTaskSessionRef.current.stop(); setEncTaskDictating(false); setEncTaskInterim(""); }
  };
  const deleteEncTask   = (id) => updatePatient({ tasks: patient.tasks.filter(t => t.id !== id) });
  const toggleEncDone   = (id) => updatePatient({ tasks: patient.tasks.map(t => t.id === id ? { ...t, done: !t.done } : t) });
  const toggleEncUrgent = (id) => updatePatient({ tasks: patient.tasks.map(t => t.id === id ? { ...t, urgent: !t.urgent } : t) });
  const saveEncEdit     = (id, text) => {
    if (text.trim()) updatePatient({ tasks: patient.tasks.map(t => t.id === id ? { ...t, text: text.trim() } : t) });
    setEditingEncTaskId(null);
  };

  const encTaskSessionRef = useRef(null);
  const toggleEncTaskDictation = () => {
    if (encTaskDictating) {
      encTaskKeepRef.current = false;
      if (encTaskSessionRef.current) encTaskSessionRef.current.stop();
      setEncTaskDictating(false);
      setEncTaskInterim("");
      return;
    }
    encTaskKeepRef.current = true;
    setEncTaskDictating(true);
    if (newEncTaskText === null) setNewEncTaskText("");
    ensureMicStream().then(function() {
      encTaskSessionRef.current = createDictationSession({
        keepRef: encTaskKeepRef,
        onFinal: function(text) { setNewEncTaskText(function(prev) { return ((prev || "") + (prev ? " " : "") + text).trimStart(); }); },
        onInterim: setEncTaskInterim,
        onEnd: function() { setEncTaskDictating(false); setEncTaskInterim(""); },
      });
    });
  };

  // ── Encounter Notes dictation (reassessment / exam updates) ─────────────────
  const [notesDictating, setNotesDictating] = useState(false);
  const [notesInterim, setNotesInterim]     = useState("");
  const notesSessionRef = useRef(null);
  const notesKeepRef    = useRef(false);

  const toggleNotesDictation = () => {
    if (notesDictating) {
      notesKeepRef.current = false;
      if (notesSessionRef.current) notesSessionRef.current.stop();
      setNotesDictating(false);
      setNotesInterim("");
      return;
    }
    notesKeepRef.current = true;
    setNotesDictating(true);
    ensureMicStream().then(function() {
      notesSessionRef.current = createDictationSession({
        keepRef: notesKeepRef,
        onFinal: function(text) { setInput(function(prev) { return prev + (prev ? " " : "") + text; }); },
        onInterim: setNotesInterim,
        onEnd: function() { setNotesDictating(false); setNotesInterim(""); },
      });
    });
  };

  // Auto-save encounter notes: handled safely by the Extract Tasks button and Generate Note.
  // A debounced timer calling updatePatient caused render instability — removed.

  // ── Task extraction on patient navigation away ─────────────────────────────────
  // NOTE: Removed unmount cleanup pattern — calling updatePatient in cleanup causes
  // React "can't update unmounted component" crash. Task extraction happens via the
  // Extract Tasks button or Generate Note instead, both of which are safe.

  const startEncounterRec = () => {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) return;

    const launch = () => {
      // Always create a FRESH instance — you cannot restart a stopped one
      const rec = new SR();
      rec.continuous = true;
      rec.interimResults = true;
      rec.lang = "en-US";
      recognitionRef.current = rec;

      rec.onresult = (e) => {
        let interimText = "";
        for (let i = e.resultIndex; i < e.results.length; i++) {
          if (e.results[i].isFinal) {
            const text = e.results[i][0].transcript.trim();
            if (text) {
              const time = new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
              setLiveTranscript(prev => [...prev, { speaker: "Dr", text, time }]);
              encounterInterimRef.current = "";
            }
          } else {
            interimText += e.results[i][0].transcript;
          }
        }
        encounterInterimRef.current = interimText;
        setInterim(interimText);
      };

      rec.onerror = (e) => {
        if (e.error === "not-allowed" || e.error === "service-not-allowed") {
          keepRecordingRef.current = false;
          setRecording(false);
          setInterim("");
          alert("Microphone blocked. Please allow mic access in Chrome and try again.");
        }
        // "no-speech" and "aborted" are fine — onend will restart
      };

      rec.onend = () => {
        // Rescue any words heard but not confirmed before session closed
        if (encounterInterimRef.current.trim()) {
          const text = encounterInterimRef.current.trim();
          const time = new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
          setLiveTranscript(prev => [...prev, { speaker: "Dr", text, time }]);
          encounterInterimRef.current = "";
          setInterim("");
        }
        if (keepRecordingRef.current) {
          ensureMicStream().then(function(){ setTimeout(launch, 50); });
        } else {
          setRecording(false);
          setInterim("");
        }
      };

      try { rec.start(); } catch(e) {}
    };

    launch();
  };

  // ── OpenAI Whisper recording ──────────────────────────────────────────────────
  const startWhisperRecording = async () => {
    const oaiKey = getApiKey();
    if (!oaiKey) { ensureMicStream().then(() => startEncounterRec()); return; }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      const chunks = [];
      const mr = new MediaRecorder(stream);
      mr.addEventListener('dataavailable', e => { if (e.data.size > 0) chunks.push(e.data); });
      mr.start(250);
      usingWhisperRef.current = true;
      recordingStartRef.current = Date.now();
      speakerChangesRef.current = [];
      setCurrentSpeaker("Dr");
      whisperRef.current = {
        mediaRecorder: mr,
        stream,
        chunks,
        stop: () => new Promise(resolve => {
          mr.addEventListener('stop', () => resolve(chunks), { once: true });
          try { mr.stop(); } catch(e) { resolve(chunks); }
          try { stream.getTracks().forEach(t => t.stop()); } catch(e) {}
        })
      };
    } catch(err) {
      usingWhisperRef.current = false;
      ensureMicStream().then(() => startEncounterRec());
    }
  };

  const sendToWhisper = async (chunks) => {
    const oaiKey = getApiKey();
    if (!oaiKey || !chunks.length) return;
    setTranscribing(true);
    try {
      const mimeType = chunks[0]?.type || 'audio/webm';
      const blob = new Blob(chunks, { type: mimeType });
      // Claim 20: clear raw audio chunks immediately after blob creation — audio not retained
      chunks.length = 0;
      const formData = new FormData();
      formData.append('file', blob, 'encounter.webm');
      formData.append('model', 'whisper-1');
      formData.append('language', 'en');
      formData.append('prompt', "Physician clinical encounter recording. Medical terms: community-acquired pneumonia, normocardiac, tachycardia, bradycardia, tachypneic, hypoxia, dyspnea, creatinine, procalcitonin, lactate, leukocytosis, WBC decreasing, WBC increasing, bilateral consolidation, pleural effusion, crackles, rhonchi, edema, oriented times three, no JVD, non-tender abdomen, ceftriaxone, azithromycin, metformin, amlodipine, lisinopril, furosemide, vancomycin, piperacillin, SpO2, FiO2, supplemental oxygen, IV fluids, blood cultures pending, sputum culture, normotensive, afebrile, alert and oriented.");
      formData.append('response_format', 'verbose_json');
      formData.append('timestamp_granularities[]', 'segment');
      const resp = await fetch('https://api.openai.com/v1/audio/transcriptions', {
        method: 'POST',
        headers: { 'Authorization': `Bearer ${oaiKey}` },
        body: formData
      });
      const data = await resp.json();
      // DIAGNOSTIC FIX: check resp.ok before using data — non-OK responses have no .text/.segments
      if (!resp.ok) {
        throw new Error("Whisper encounter API " + resp.status + ": " + (data.error?.message || "Check your OpenAI API key in Settings"));
      }
      // Claim 20: audio blob dereferenced after successful API call — not stored locally
      // formData and blob go out of scope; only the text transcript is retained
      const changes = speakerChangesRef.current;
      const segments = data?.segments;
      if (segments && segments.length > 0) {
        // assign each segment to a speaker based on toggle timestamps
        const entries = segments
          .filter(seg => seg.text?.trim())
          .map(seg => {
            let speaker = "Dr"; // physician speaks first by default
            for (const ch of changes) {
              if (ch.timeSec <= seg.start) speaker = ch.speaker;
            }
            const t = new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
            return { speaker, text: seg.text.trim(), time: t };
          });
        if (entries.length > 0) {
          // Safe: update state first, then save to patient — never call updatePatient inside a state setter
          setLiveTranscript(prev => [...prev, ...entries]);
          const todayStr = new Date().toDateString();
          updatePatient({ transcript: entries, transcriptDate: todayStr });
        }
      } else if (data?.text?.trim()) {
        // fallback — no segments, use plain text
        const time = new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
        const fallbackEntry = { speaker: "Dr", text: data.text.trim(), time };
        // Safe: update state first, then save — never call updatePatient inside a state setter
        setLiveTranscript(prev => [...prev, fallbackEntry]);
        const todayStr = new Date().toDateString();
        updatePatient({ transcript: [fallbackEntry], transcriptDate: todayStr });
      }
    } catch(err) {
      // DIAGNOSTIC FIX: was silently swallowing API errors — now logs and shows brief alert
      console.error("Encounter Whisper transcription error:", err);
      if (err && err.message) {
        alert("Encounter recording error: " + err.message);
      }
    }
    setTranscribing(false);
  };

  // ── Deepgram real-time encounter recording ────────────────────────────────────
  const startDeepgramEncounterRec = async () => {
    const dgKey = getDeepgramKey();
    if (!dgKey) {
      alert("Please add your Deepgram API key in Settings to use Deepgram for encounter recording.");
      setRecording(false);
      return;
    }
    // iOS check — Deepgram WebSocket streaming unreliable on iPhone
    if (/iphone|ipad|ipod/i.test(navigator.userAgent)) {
      alert("Deepgram real-time streaming has limited support on iPhone.\n\nTo record encounters on iPhone:\n• Switch to OpenAI Whisper in Settings (tap record, it saves after you stop)\n• Or use the Encounter Notes section to dictate after the visit");
      setRecording(false);
      return;
    }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      const mimeType = MediaRecorder.isTypeSupported("audio/webm;codecs=opus")
        ? "audio/webm;codecs=opus"
        : MediaRecorder.isTypeSupported("audio/webm") ? "audio/webm" : "";
      const dgModel2 = getDictationEngine() === "deepgram-nova3" ? "nova-3" : "nova-2-medical";
      const url = `wss://api.deepgram.com/v1/listen?model=${dgModel2}&language=en&smart_format=true&interim_results=true&endpointing=300`;
      const ws = new WebSocket(url, ["token", dgKey]);
      let mr = null;

      ws.onopen = function() {
        mr = mimeType ? new MediaRecorder(stream, { mimeType }) : new MediaRecorder(stream);
        mr.ondataavailable = function(e) { if (e.data.size > 0 && ws.readyState === 1) ws.send(e.data); };
        mr.start(250);
      };

      ws.onmessage = function(e) {
        try {
          const d = JSON.parse(e.data);
          if (d.type === "Results") {
            const text = (d.channel && d.channel.alternatives && d.channel.alternatives[0] && d.channel.alternatives[0].transcript) || "";
            if (d.is_final && text.trim()) {
              const t = new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
              setLiveTranscript(function(prev) { return [...prev, { speaker: currentSpeaker, text: text.trim(), time: t }]; });
              setInterim("");
            } else if (!d.is_final && text.trim()) {
              setInterim(text);
            }
          }
        } catch(err) {}
      };

      ws.onclose = function() {
        try { stream.getTracks().forEach(function(t){ t.stop(); }); } catch(e2) {}
        if (keepRecordingRef.current) setTimeout(startDeepgramEncounterRec, 300);
        else { setRecording(false); setInterim(""); }
      };

      ws.onerror = function() { try { ws.close(); } catch(e2) {} };

      usingWhisperRef.current = false;
      recordingStartRef.current = Date.now();
      speakerChangesRef.current = [];
      setCurrentSpeaker("Dr");
      whisperRef.current = {
        stop: function() {
          return new Promise(function(resolve) {
            try { if (mr) mr.stop(); } catch(e2) {}
            try { ws.close(); } catch(e2) {}
            resolve([]);
          });
        }
      };
    } catch(err) {
      setRecording(false);
      alert("Could not start Deepgram recording: " + err.message);
    }
  };

  const toggleRecording = () => {
    if (recording) {
      keepRecordingRef.current = false;
      if (whisperRef.current) {
        const ref = whisperRef.current;
        whisperRef.current = null;
        const wasWhisper = usingWhisperRef.current;
        usingWhisperRef.current = false;
        setRecording(false);
        setInterim("");
        if (wasWhisper) {
          ref.stop().then(function(chunks) { sendToWhisper(chunks); });
        } else {
          ref.stop();
        }
      } else {
        if (recognitionRef.current) recognitionRef.current.stop();
        setRecording(false);
        setInterim("");
      }
      return;
    }
    const engine = getDictationEngine();
    if (engine === "deepgram" || engine === "deepgram-nova3") {
      if (!getDeepgramKey()) {
        alert("Please add your Deepgram API key in Settings.");
        return;
      }
    } else if (engine !== "deepgram") {
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SR && !getApiKey()) {
        alert("Speech recognition isn't supported in this browser. Please use Chrome or add an OpenAI API key in Settings.");
        return;
      }
    }
    keepRecordingRef.current = true;
    setRecording(true);
    usingWhisperRef.current = false;
    if (engine === "deepgram" || engine === "deepgram-nova3") {
      startDeepgramEncounterRec();
    } else if (getApiKey()) {
      usingWhisperRef.current = true;
      startWhisperRecording();
    } else {
      ensureMicStream().then(function() { startEncounterRec(); });
    }
  };

  // ── Update tasks from encounter notes only (no full note generation) ──────────
  const handleUpdateTasks = async () => {
    const notesText = input.trim();
    if (!notesText || !getApiKey()) return;
    setTasksUpdating(true);
    setTaskUpdateMsg("");
    try {
      const openTasks = (patient.tasks || []).filter(t => !t.done);
      const existingTasksBlock = openTasks.length > 0
        ? openTasks.map(t => `[ID:${t.id}] ${t.text}${t.urgent ? " (URGENT)" : ""}`).join("\n")
        : "None";

      const prompt = `Patient diagnosis: "${patient.diagnosis}"

PHYSICIAN ENCOUNTER NOTES:
${notesText}

CURRENT OPEN TASKS (do not duplicate these):
${existingTasksBlock}

Review the encounter notes for specific physician action items.
Only mark a CURRENT OPEN TASK as completed if the physician explicitly said it was done or addressed.
Only add NEW tasks for specific actions the physician explicitly mentioned — new orders, calls, tests, medication changes. Do not add vague entries like "monitor patient" or "continue current plan".

Return ONLY valid JSON:
{
  "completed_task_ids": [],
  "new_tasks": [{"text": "specific actionable task", "category": "labs", "urgent": false}]
}`;

      const resp = await callOpenAI(
        [{ role: "system", content: TASK_SYSTEM_PROMPT },
         { role: "user", content: prompt }],
        { jsonMode: true }
      );
      const parsed = JSON.parse(resp);

      let updatedTasks = [...(patient.tasks || [])];
      let completedCount = 0;
      let addedCount = 0;

      if (parsed.completed_task_ids && Array.isArray(parsed.completed_task_ids)) {
        const doneSet = new Set(parsed.completed_task_ids.map(id => Number(id)));
        updatedTasks = updatedTasks.map(t => {
          if (doneSet.has(Number(t.id)) && !t.done) { completedCount++; return { ...t, done: true }; }
          return t;
        });
      }
      if (parsed.new_tasks && Array.isArray(parsed.new_tasks)) {
        const newItems = parsed.new_tasks
          .filter(t => t && t.text && t.text.trim())
          .map((t, i) => ({
            id: Date.now() + i + 500,
            text: t.text.trim(),
            done: false,
            category: t.category || "labs",
            urgent: !!t.urgent,
          }));
        // Deduplicate before adding — prevents double-extraction when Save Notes + Generate Note both run
        const before = updatedTasks.length;
        updatedTasks = mergeTasksDedup(updatedTasks, newItems);
        addedCount = updatedTasks.length - before;
      }

      // Save encounter notes + updated tasks together
      updatePatient({ encounterNotes: input, tasks: updatedTasks });

      const parts = [];
      if (completedCount > 0) parts.push(`${completedCount} completed`);
      if (addedCount > 0) parts.push(`${addedCount} added`);
      setTaskUpdateMsg(parts.length > 0 ? `✓ Tasks updated — ${parts.join(", ")}` : "✓ Notes saved — no new tasks found");
      setTimeout(() => setTaskUpdateMsg(""), 3500);

    } catch(e) {
      console.error("Task update failed:", e);
      updatePatient({ encounterNotes: input });
      setTaskUpdateMsg("Notes saved (task extraction failed)");
      setTimeout(() => setTaskUpdateMsg(""), 3000);
    }
    setTasksUpdating(false);
  };

  const handleFinalize = async () => {
    setGenerating(true);
    const hasKey  = !!getApiKey();
    const hasLive = liveTranscript.length > 0;
    const timeNow = new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
    const isAddendum = selectedTemplate === "addendum";

    // ── Addendum path — simple, no transcript/course/task processing ──────────
    if (isAddendum) {
      const addendumContext = [
        patient.encounterNotes && `ENCOUNTER NOTES:\n${patient.encounterNotes}`,
        hasLive && `BEDSIDE RECORDING:\n${liveTranscript.map(e=>`[${e.speaker==="Dr"?"Physician":"Patient"}] ${e.text}`).join("\n")}`,
      ].filter(Boolean).join("\n\n") || "No new clinical information provided.";

      callOpenAI([

        {role:"user",content:`From this generated clinical note, write a single one-line hospital course entry.\n\nFormat: "Day ${courseDayNumb} · ${courseDateStrb}: [clinical status + key plan decisions, 20-25 words]"\n\nRules: Focus on the clinical assessment of active problems and management decisions. Do NOT list vital signs (BP, HR, O2) or raw lab values — those are tracked separately. Write clinical reasoning: what is happening with the patient's conditions and what is being done.\nExample: "Day ${courseDayNumb} · ${courseDateStrb}: Acute pancreatitis improving, lipase trending down. Remains NPO with IV fluids. DM managed with SSI, metformin held."\n\nNOTE:\n${note.substring(0,2000)}`}
      ],{temperature:0.1}).then(summaryRespb=>{
        if(summaryRespb && summaryRespb.trim()){
          const existSumb = patient.admissionSummary || {};
          const existCourseb = existSumb.course || "";
          // Remove ALL today entries then add the AI clinical summary — clean single entry per day
          const courseLines2b = existCourseb.split("\n").filter(l=>l.trim() && !l.includes(courseDateStrb));
          courseLines2b.push(summaryRespb.trim());
          updatePatient({admissionSummary:{...existSumb,course:courseLines2b.join("\n"),lastUpdatedAt:new Date().toISOString()}});
        }
      }).catch(()=>{});
      setGenerating(false);
      onNext();

    } catch(e) {
      console.error("AI note generation failed:", e);
      const note = generateSOAPNote(patient);
      const today = new Date().toDateString();
      const dayLabel = `Day ${patient.dayNum || 1} · ${new Date().toLocaleDateString("en-US", {month:"short",day:"numeric"})}`;
      const savedIsToday = patient.transcriptDate === today;
      const priorHistory = [
        ...(patient.transcriptHistory || []),
        ...(!savedIsToday && patient.transcript && patient.transcript.length > 0
          ? [{ label: dayLabel + " (prior)", entries: patient.transcript }]
          : []),
      ];

      // Also update hospital course in error path
      const errMonths   = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
      const errDate     = new Date();
      const errDateStr  = `${errMonths[errDate.getMonth()]} ${errDate.getDate()}`;
      const errFullLabel = `Day ${patient.dayNum||1} · ${errDateStr}`;
      const errSummary  = patient.admissionSummary || {};
      const errCourse   = errSummary.course || "";
      const errLines    = errCourse.split("\n").filter(l => l.trim());
      const errTodayIdx = errLines.findIndex(l => l.includes(errDateStr));
      if (errTodayIdx >= 0) {
        const cleaned = errLines[errTodayIdx].replace(/⏳/g,"").replace(/✓/g,"").replace(/Encounter pending\.?/gi,"").replace(/Pre-rounded\.?/gi,"").replace(/Awaiting encounter\.?/gi,"").replace(/\.\s*$/, "").trim();
        errLines[errTodayIdx] = cleaned + ". Encounter done";
      } else {
        errLines.push(`${errFullLabel}: Encounter done`);
      }
      const errUpdatedSummary = { ...errSummary, course: errLines.join("\n"), lastUpdated: patient.dayNum, lastUpdatedAt: new Date().toISOString() };

      updatePatient({ note, transcript: transcriptToSave, transcriptDate: today, transcriptHistory: priorHistory, status: "note-ready", admissionSummary: errUpdatedSummary, noteGeneratedAt: new Date().toISOString(), noteTemplate: selectedTemplate, billingSuggestion: null });
      setGenerating(false);
      onNext();
    }
  };

  return (
    <div className="px-4 py-5 space-y-5 pb-24">
      {showAsk && <AskModal patient={patient} liveTranscript={liveTranscript} contextLabel="encounter" onClose={() => setShowAsk(false)} />}
      {showCreateTemplate && <CreateTemplateModal onClose={() => { setShowCreateTemplate(false); setEditingTemplate(null); }} onSave={handleSaveTemplate} existingTemplate={editingTemplate} />}
      {/* Record button — Claim 12: continuous mode (tap) or push-to-record mode (hold) */}
      <div className="flex flex-col items-center py-5">
        {/* Mode toggle */}
        <div className="flex items-center gap-1 bg-slate-100 rounded-full p-1 mb-4">
          <button
            onClick={() => setRecordingMode("continuous")}
            className={`text-xs font-semibold px-3 py-1.5 rounded-full transition-all ${recordingMode === "continuous" ? "bg-white text-slate-800 shadow-sm" : "text-slate-500"}`}
          >Tap to Record</button>
          <button
            onClick={() => setRecordingMode("push")}
            className={`text-xs font-semibold px-3 py-1.5 rounded-full transition-all ${recordingMode === "push" ? "bg-white text-slate-800 shadow-sm" : "text-slate-500"}`}
          >Hold to Record</button>
        </div>
        <div className="relative">
          <button
            onClick={recordingMode === "continuous" ? toggleRecording : undefined}
            onPointerDown={recordingMode === "push" && !recording && !transcribing ? toggleRecording : undefined}
            onPointerUp={recordingMode === "push" && recording ? toggleRecording : undefined}
            onPointerLeave={recordingMode === "push" && recording ? toggleRecording : undefined}
            disabled={transcribing}
            style={{
              width:96, height:96, borderRadius:"50%", border:"none", cursor:"pointer",
              display:"flex", alignItems:"center", justifyContent:"center",
              background: recording ? "#ef4444" : transcribing ? "#94a3b8" : "#0d9488",
              boxShadow: recording ? "0 8px 24px rgba(239,68,68,0.4)" : "0 8px 24px rgba(13,148,136,0.4)",
              transform: recording ? "scale(1.1)" : "scale(1)",
              transition: "all 0.3s",
              userSelect: "none",
            }}
          >
            {transcribing ? <Loader2 size={34} color="white" className="animate-spin" /> : recording ? <MicOff size={34} color="white" /> : <Mic size={34} color="white" />}
          </button>
          {getApiKey() && (
            <span className="absolute -top-1 -right-1 bg-emerald-500 text-white text-xs font-bold px-1.5 py-0.5 rounded-full shadow-sm">AI</span>
          )}
        </div>
        <p className="text-sm text-slate-500 mt-3 font-medium">
          {transcribing
            ? "⏳ Transcribing with Whisper…"
            : recording
              ? (recordingMode === "push" ? "🟢 Recording · Release to stop" : (getApiKey() ? "🟢 Recording · Tap to stop & transcribe" : "Recording… Tap to stop"))
              : (recordingMode === "push" ? "Hold button to record" : (getApiKey() ? "Whisper Medical · Tap to start" : "Tap to capture bedside encounter"))}
        </p>
        {recording && (
          <div className="flex flex-col items-center gap-3 mt-3">
            <div className="flex items-end gap-1 h-6">
              {[10, 18, 8, 22, 12, 20, 9, 16, 7, 19].map((h, i) => (
                <div key={i} className="w-1 bg-red-400 rounded-full animate-pulse" style={{ height: h, animationDelay: `${i * 80}ms` }} />

            </div>
            <button
              onClick={() => {

                currentSpeaker === "Dr"

            >
              {currentSpeaker === "Dr"
                ? <><span className="w-2 h-2 rounded-full bg-teal-500 inline-block" /> Physician speaking — tap when patient speaks</>

            </button>
          </div>
        )}

      </div>

      {/* Live transcript feed */}
      {(liveTranscript.length > 0 || interim) && (
        <section>
          <SectionHeader label="Live Transcript" />
          <div className="bg-white rounded-2xl border border-slate-100 shadow-sm divide-y divide-slate-50 max-h-52 overflow-y-auto">

      {/* Ask AI — prominent query button */}
      <button

      {/* Manual notes / Reassessment */}
      <section>
        <div className="flex items-center justify-between mb-2">

              <Plus size={12} /> Add

        {newEncTaskText !== null && (
          <div className="bg-white rounded-2xl border-2 border-slate-800 shadow-sm p-3 mb-3 space-y-2">

            {encTaskDictating && encTaskInterim && (
              <p className="text-xs italic text-teal-700 px-1">

            <div className="flex gap-2">

                <Save size={12} /> Save Task
              </button>
              <button onClick={() => { setNewEncTaskText(null); if (encTaskDictating) { encTaskKeepRef.current = false; if (encTaskSessionRef.current) encTaskSessionRef.current.stop(); setEncTaskDictating(false); } }}

            </div>

        )}

        <div className="space-y-2">
          {patient.tasks.filter(t => !t.done).map(task => (
            <div key={task.id} className={`bg-white rounded-xl border shadow-sm ${task.urgent ? "border-red-200" : "border-slate-200"}`}>
              {editingEncTaskId === task.id ? (
                <div className="flex gap-2 p-3">
                  <input
                    value={editingEncTaskText}
                    onChange={e => setEditingEncTaskText(e.target.value)}
                    autoFocus
                    onKeyDown={e => { if (e.key === "Enter") saveEncEdit(task.id, editingEncTaskText); if (e.key === "Escape") setEditingEncTaskId(null); }}
                    className="flex-1 text-sm border-2 border-slate-800 rounded-lg px-2 py-1 outline-none"

                  <button onClick={() => saveEncEdit(task.id, editingEncTaskText)} className="text-xs bg-slate-800 text-white font-bold px-2.5 py-1 rounded-lg">Save</button>

                <div className="flex items-center gap-2 px-3 py-2.5">
