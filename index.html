// ─── CLINICAL QUALITY SYSTEM ───────────────────────────────────────────────
// This goes in the SYSTEM role for every note generation call.
// It is the permanent, template-agnostic quality baseline.
// Template format instructions go separately in the USER role.
// When user-provided model notes are added, they slot in at the bottom of this block.
const CLINICAL_QUALITY_SYSTEM = `You are a board-certified clinical documentation specialist. You produce hospital-grade inpatient progress notes, H&Ps, consult notes, and discharge summaries.

LANGUAGE & GRAMMAR — non-negotiable across all note types:
- Every sentence must be grammatically complete: subject + verb + object/complement. No fragments.
- Use professional third-person clinical prose. "The patient reports…", "Examination reveals…"
- Maintain consistent past tense for history and findings; present tense for current status and plan.
- Use precise clinical vocabulary. Spell out full terms on first use.

MEDICAL TERM COMPLETION — critical rule:
- Speech recognition often truncates or mis-hears medical words. You must ALWAYS infer and write the full, correct medical term — never copy a truncated or garbled word from the input.
- Examples of what you must fix automatically:
    "leukocyt" → "leukocytosis"          "azromycin" → "azithromycin"
    "community-ac" → "community-acquired" "hyperglycem" → "hyperglycemia"
    "tachycardi" → "tachycardia"          "pneum" → "pneumonia"
    "examinationAssessment" → split into separate Examination and Assessment sections
    "creasing" → "decreasing" (use clinical context to resolve)
- Apply this correction silently — never mention that you corrected something.

VITALS FORMATTING:
- Always include units: blood pressure in mmHg, heart rate in beats per minute, temperature in °F (or °C if documented), oxygen saturation as a percentage, weight in kg or lbs as documented.
- Write vitals in a consistent, readable sentence or structured line — not raw numbers strung together.

SECTION DISCIPLINE:
- Each section header stands alone on its own line, followed by a blank line, then the content.
- Always insert a blank line between sections. Never run two sections together.
- Do not invent sections not called for by the template. Do not omit sections the template requires.

PLAN ITEMS:
- Number each plan item. Begin each with a capital letter. Write as a complete action sentence.
- Example: "1. Continue azithromycin 500 mg daily for community-acquired pneumonia."

MEDICATIONS SECTION — formatting rule:
- ALWAYS list medications as a structured line-by-line list. NEVER write medications as prose sentences.
- One medication per line. Format: Drug name dose route frequency — status if relevant.
- Example: "Furosemide 40 mg IV daily — active"
- Example: "Lisinopril 10 mg PO daily — held, creatinine rising"
- Example: "Carvedilol 6.25 mg PO BID — active"
- If a medication was changed or discontinued during this encounter, append a brief clinical reason.
- Do not write "The patient is currently on..." or any prose introduction before the medication list.

OUTPUT RULES:
- No asterisks (*) anywhere. No markdown bold (**), italics (*), or other symbols in running text.
- Return only the note text. No preamble ("Here is your note:"), no JSON, no meta-commentary.
- Do not add disclaimers or suggest the physician verify anything — this is a documentation tool.

MULTI-SOURCE CLINICAL SYNTHESIS — how to use each input source:

The physician provides information from multiple sources at different stages of the rounding workflow. Each source has a specific clinical role. Use them accordingly:

PRE-ROUND NOTES (dictated before seeing the patient):
- The physician reviewed labs, vitals, imaging, and overnight events before entering the room.
- Use PRE-ROUND NOTES as the primary source for: chronic and stable diagnoses (hypertension, diabetes, depression, etc.), overnight clinical events, trending lab values, imaging results, and background context.
- For stable chronic problems: the physician has already made the plan in pre-round. Use that plan directly in the Assessment and Plan for those problems.
- Example: "Blood pressure 128/72 overnight, continue amlodipine" — this came from pre-round and is the plan for hypertension.

ENCOUNTER NOTES and BEDSIDE RECORDING (during or after seeing the patient):
- The physician has now examined the patient, spoken with them, and made final clinical decisions.
- Use ENCOUNTER NOTES and RECORDING as the primary source for: active/acute problems requiring bedside assessment, the patient's subjective report of symptoms, physical examination findings, and any plan that required seeing the patient to decide.
- For active acute problems: encounter notes and recording contain the physician's final decision after examination. These ALWAYS override pre-round anticipated plans.
- Example: "Patient looks better, tolerating PO, transitioning to oral azithromycin" — this came from encounter and is the final plan for pneumonia.

CONFLICT RESOLUTION — when sources disagree:
- If pre-round anticipated a plan but encounter notes state a different decision, use the ENCOUNTER decision. The encounter represents what actually happened after examining the patient.
- IMPORTANT: When the encounter plan differs from the pre-round anticipated plan for the same problem, document BOTH what was planned and what was decided, along with the clinical reason for the change. This tells the full clinical story.
- Example: Pre-round said "increase lisinopril for elevated BP" but encounter notes say "do not increase lisinopril" because patient was drowsy and hypotensive — write: "Lisinopril dose increase deferred — patient noted to be drowsy with blood pressure 88/54 on examination. Continue current dose and reassess."
- Example: Pre-round said "consider oral antibiotic transition, white count improving" but encounter notes say "patient still febrile on exam, not ready" — write: "Initially considered oral antibiotic transition given improving leukocytosis; however, patient remains febrile on examination. Continue IV antibiotics and reassess tomorrow."
- Example: Pre-round said "consider oral antibiotic transition" and encounter notes confirm "patient afebrile, tolerating PO, switching to oral azithromycin" — write: "Patient afebrile, tolerating oral intake. Transitioning to oral azithromycin as planned."
- Stable chronic problems not mentioned in encounter notes: carry the pre-round plan forward unchanged.

REVIEW OF SYSTEMS — critical clinical safety rule (same as Physical Examination):
- ONLY document symptoms explicitly mentioned by the physician or patient in the dictation or recording.
- If no ROS was dictated, write: "Review of systems not documented in today's dictation."
- NEVER list typical pertinent negatives for the diagnosis (e.g., do not write "denies chest pain" or "no shortness of breath" unless the patient explicitly stated this).
- A missing ROS section is clinically and legally safer than a fabricated one.

SUBJECTIVE SECTION:
- Use the patient's own words from the bedside recording or encounter notes. "Patient reports feeling less short of breath" — from transcript.
- Pre-round provides background history context, not today's subjective complaints.

OBJECTIVE SECTION:
- Vitals and labs: from structured data (labeled with their update date — if stale, reference the date).
- Physical examination: from encounter recording and encounter notes ONLY.

PHYSICAL EXAMINATION — critical clinical safety rule:
- ONLY document examination findings that were EXPLICITLY dictated or recorded by the physician.
- The ENCOUNTER NOTES field is a primary and valid source for physical examination findings — the physician may have dictated exam findings directly into that field rather than via bedside recording. If exam findings appear in ENCOUNTER NOTES, they are explicitly documented and MUST be included in the Physical Examination section.
- If no physical examination findings appear in either the encounter notes OR the bedside recording, write exactly: "Physical examination not documented in today's dictation."
- NEVER infer, generate, or assume typical findings based on the diagnosis. Do not write what a typical exam "would show" for this condition.
- Do not write "The patient appears...", "Examination reveals...", or describe any signs unless the physician explicitly stated them.
- A missing exam section is clinically and legally safer than a fabricated one.

ASSESSMENT AND PLAN — the clinical synthesis:
- List ALL active problems, both acute and chronic.
- For each acute problem: synthesize pre-round data (labs, imaging) with encounter findings and state the final plan from encounter notes.
- For each chronic problem: state the plan from pre-round assessment. Keep it brief.
- Number each plan item as a complete action sentence.
- CRITICAL SAFETY RULE: ONLY list problems and plan items explicitly mentioned by the physician in pre-round notes or encounter notes. NEVER add diagnoses, clinical impressions, or plan items inferred from lab values or context alone. If a lab is abnormal but the physician did not mention it, do not create a problem for it. A missing problem is always safer than a fabricated one.
- ALLOWED EXPANSION: You MAY expand the physician's words into full clinical prose and add appropriate medical structure, terminology, and formatting. If the physician said "BP improved, continue lasix" you may write "Hypertension — blood pressure improved to [value]. Continue furosemide [dose]. Monitor electrolytes." This is clinical language expansion, not hallucination. What you must NEVER do is add clinical facts, severity descriptors (critically, dangerously, acutely), lab values, or diagnoses the physician did not mention.

// ── PLACEHOLDER: physician model note examples go here ────────────────────
// When the physician provides 2-5 reference notes, they are embedded below
// as few-shot demonstrations to further refine style and format.
`;

3. Plan: numbered list, each item a complete sentence starting with a capital letter.
4. No asterisks or markdown symbols anywhere in the note.
5. Return only the note text — no preamble, no JSON wrapper.`;

// ─── Global mic-permission helper ─────────────────────────────────────────────
// Called INSIDE every dictation button click handler (user-gesture context).
// Chrome on file:// URLs suppresses the SpeechRecognition permission dialog only
// when an active getUserMedia audio track already exists on the page.
//
// We keep that track alive by routing it through a silent AudioContext gain node
// (gain = 0, no output). This prevents Chrome from releasing the stream during
// idle periods and asking for permission again after the mic sits unused for a
// while.  The stream + context are stored on window so they survive across React
// re-renders and component unmounts.
const ensureMicStream = () => {
  // Resume AudioContext if Chrome suspended it (happens automatically after ~30s of no user gesture)
  try {
    if (window._micAudioCtx && window._micAudioCtx.state === "suspended") {
      window._micAudioCtx.resume().catch(function(){});
    }
  } catch(e) {}

  // Fast path: stream already active AND all tracks are live
  if (window._micStream && window._micStream.active &&
      window._micStream.getTracks().every(function(t){ return t.readyState === "live"; })) {
    return Promise.resolve();
  }

  // Stream is dead or missing — stop stale tracks and request a fresh stream
  try {
    if (window._micStream) {
      window._micStream.getTracks().forEach(function(t){ try { t.stop(); } catch(e){} });
    }
  } catch(e) {}
  window._micStream = null;

  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia)
    return Promise.resolve();

  return navigator.mediaDevices.getUserMedia({ audio: true })
    .then(function(stream) {
      window._micStream = stream;
      // Bridge through a silent AudioContext so the browser keeps the stream
      // alive even when SpeechRecognition is idle between sessions.
      try {
        var AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (AudioCtx) {
          // Reuse existing context if still running, otherwise create fresh
          if (!window._micAudioCtx || window._micAudioCtx.state === "closed") {
            window._micAudioCtx = new AudioCtx();
          }
          if (window._micAudioCtx.state === "suspended") {
            window._micAudioCtx.resume().catch(function(){});
          }
          var src  = window._micAudioCtx.createMediaStreamSource(stream);
          var gain = window._micAudioCtx.createGain();
          gain.gain.value = 0; // completely silent — we only need the active pipe
          src.connect(gain);
          gain.connect(window._micAudioCtx.destination);
        }
      } catch(e) {}
    })
    .catch(function() {});
};


// ─── OpenAI API Helpers ────────────────────────────────────────────────────────
const getApiKey       = () => localStorage.getItem("rounding_openai_key") || "";
const getApiModel     = () => localStorage.getItem("rounding_openai_model") || "gpt-4o";

// ─── Dictation Engine Helpers ──────────────────────────────────────────────────
const getDictationEngine = () => localStorage.getItem("rounding_dictation_engine") || "web-speech";
const getDeepgramKey     = () => localStorage.getItem("rounding_deepgram_key") || "";

// ─── JUNE 6 TEST FILE — Multi-Provider Helpers ─────────────────────────────────
const getAnthropicKey     = () => localStorage.getItem("rounding_anthropic_key") || "";
const getAzureKey         = () => localStorage.getItem("rounding_azure_speech_key") || "";
const getAzureRegion      = () => localStorage.getItem("rounding_azure_speech_region") || "eastus";
const getNoteProvider     = () => localStorage.getItem("rounding_note_provider") || "openai"; // openai | claude-sonnet | claude-haiku
const getAssemblyAIKey    = () => localStorage.getItem("rounding_assemblyai_key") || "";
const getCorrectionPass   = () => localStorage.getItem("rounding_correction_pass") === "on"; // Medical term correction toggle

// createDictationSession — engine-aware field dictation factory.
// engine=web-speech : SpeechRecognition, live text, auto-restarts per keepRef
// engine=deepgram   : Deepgram WebSocket streaming, live text, auto-reconnects
// engine=whisper    : MediaRecorder → Whisper API on stop (shows "Recording…" while active)
// Returns { stop } — call to end the session from outside.
const createDictationSession = function({ onFinal, onInterim, onEnd, keepRef }) {
  const engine = getDictationEngine();

  // ── Web Speech ────────────────────────────────────────────────────────────
  if (engine === "web-speech") {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) { setTimeout(function(){ if (onEnd) onEnd(); }, 0); return { stop: function(){} }; }
    const ibuf = { current: "" };
    let recInst = null;

    const launchWS = function() {
      const r = new SR();
      recInst = r;
      r.continuous = true;
      r.interimResults = true;
      r.lang = "en-US";

      r.onresult = function(e) {
        let fin = "", intr = "";
        for (let i = e.resultIndex; i < e.results.length; i++) {
          if (e.results[i].isFinal) { fin += e.results[i][0].transcript + " "; ibuf.current = ""; }
          else intr += e.results[i][0].transcript;
        }
        ibuf.current = intr;
        if (fin) onFinal(fin.trim());
        if (onInterim) onInterim(intr);
      };

      r.onerror = function(e) {
        if (e.error === "not-allowed" || e.error === "service-not-allowed") {
          if (keepRef) keepRef.current = false;
          if (onEnd) onEnd();
        }
      };

      r.onend = function() {
        if (ibuf.current.trim()) { onFinal(ibuf.current.trim()); ibuf.current = ""; if (onInterim) onInterim(""); }
        if (keepRef && keepRef.current) ensureMicStream().then(function(){ setTimeout(launchWS, 50); });
        else if (onEnd) onEnd();
      };

      try { r.start(); } catch(e) { if (keepRef) keepRef.current = false; if (onEnd) onEnd(); }
    };

    launchWS();
    return { stop: function() { if (keepRef) keepRef.current = false; try { if (recInst) recInst.stop(); } catch(e) {} } };
  }

  // ── Azure Cognitive Speech — Live Streaming ───────────────────────────────
  // Uses Microsoft Speech SDK loaded dynamically from CDN.
  // Authentication is direct (key + region) — no token proxy needed.
  // Supports continuous recognition with interim + final results.
  if (engine === "azure-live") {
    const azKey = getAzureKey();
    const azRegion = getAzureRegion();
    if (!azKey) {
      if (onInterim) onInterim("⚠ No Azure key — go to Settings, enter your Azure Speech key, and tap Save");
      setTimeout(function(){ if (onInterim) onInterim(""); if (onEnd) onEnd(); }, 6000);
      return { stop: function(){} };
    }

    let recognizer = null;
    let stopped = false;

    if (onInterim) onInterim("⏳ Loading Azure Speech SDK…");

    // Dynamically load Azure Speech SDK from CDN (only loads once, cached after)
    const loadAzureSDK = function() {
      return new Promise(function(resolve, reject) {
        if (window.SpeechSDK) { resolve(window.SpeechSDK); return; }
        const script = document.createElement("script");
        script.src = "https://cdn.jsdelivr.net/npm/microsoft-cognitiveservices-speech-sdk/distrib/browser/microsoft.cognitiveservices.speech.sdk.bundle-min.js";
        script.onload = function() {
          if (window.SpeechSDK) resolve(window.SpeechSDK);
          else reject(new Error("Azure SDK loaded but SpeechSDK not found on window"));
        };
        script.onerror = function() { reject(new Error("Failed to load Azure Speech SDK from CDN")); };
        document.head.appendChild(script);
      });
    };

    loadAzureSDK()
      .then(function(SDK) {
        if (stopped) return; // user tapped stop before SDK loaded

        const speechConfig = SDK.SpeechConfig.fromSubscription(azKey, azRegion || "eastus");
        speechConfig.speechRecognitionLanguage = "en-US";

        const audioConfig = SDK.AudioConfig.fromDefaultMicrophoneInput();
        recognizer = new SDK.SpeechRecognizer(speechConfig, audioConfig);

        // Medical phrase hints — equivalent of Deepgram keyterm / AssemblyAI word_boost
        const phraseList = SDK.PhraseListGrammar.fromRecognizer(recognizer);
        [
          "troponin","creatinine","leukocytosis","tachycardia","bradycardia",
          "furosemide","metoprolol","lisinopril","apixaban","ticagrelor",
          "empagliflozin","atorvastatin","vancomycin","piperacillin",
          "azithromycin","ceftriaxone","procalcitonin","BNP","proBNP",
          "hemoglobin","echocardiogram","pneumothorax","atelectasis",
          "dyspnea","tachypnea","hypoxia","SpO2","FiO2","COPD",
          "CHA2DS2-VASc","TIMI","HEART","tenecteplase","alteplase"
        ].forEach(function(term) { phraseList.addPhrase(term); });

        // Interim results — live text as user speaks
        recognizer.recognizing = function(s, e) {
          if (e.result.reason === SDK.ResultReason.RecognizingSpeech && e.result.text) {
            if (onInterim) onInterim(e.result.text);
          }
        };

        // Final results — committed phrase on natural pause
        recognizer.recognized = function(s, e) {
          if (e.result.reason === SDK.ResultReason.RecognizedSpeech && e.result.text && e.result.text.trim()) {
            onFinal(e.result.text.trim());
            if (onInterim) onInterim("");
          }
        };

        // Errors / cancellation
        recognizer.canceled = function(s, e) {
          const detail = e.errorDetails || "Unknown error";
          console.error("Azure Live canceled:", detail);
          if (!stopped) {
            if (onInterim) onInterim("⚠ Azure Live error: " + detail.substring(0, 120));
            setTimeout(function() { if (onInterim) onInterim(""); if (onEnd) onEnd(); }, 6000);
          }
          try { recognizer.close(); } catch(e2) {}
        };

        // Session ended (after stopContinuousRecognitionAsync)
        recognizer.sessionStopped = function(s, e) {
          try { recognizer.close(); } catch(e2) {}
          if (!stopped && keepRef && keepRef.current) {
            // auto-reconnect for continuous listening mode
            setTimeout(function() {
              if (keepRef && keepRef.current) createDictationSession({ onFinal, onInterim, onEnd, keepRef });
            }, 300);
          } else {
            if (onEnd) onEnd();
          }
        };

        // Start listening
        recognizer.startContinuousRecognitionAsync(
          function() { if (onInterim) onInterim("🎙 Azure Live — speak now"); },
          function(err) {
            if (onInterim) onInterim("⚠ Azure Live failed to start: " + (err || "check your key and region in Settings"));
            setTimeout(function() { if (onInterim) onInterim(""); if (onEnd) onEnd(); }, 6000);
          }
        );
      })
      .catch(function(err) {
        if (onInterim) onInterim("⚠ Azure SDK error: " + (err.message || "could not load") + " — check your internet connection");
        setTimeout(function() { if (onInterim) onInterim(""); if (onEnd) onEnd(); }, 6000);
      });

    return {
      stop: function() {
        stopped = true;
        if (keepRef) keepRef.current = false;
        if (recognizer) {
          try {
            recognizer.stopContinuousRecognitionAsync(
              function() { try { recognizer.close(); } catch(e2) {} },
              function() { try { recognizer.close(); } catch(e2) {} }
            );
          } catch(e) {}
        } else {
          // SDK still loading — just mark stopped, onEnd will fire when load fails or succeeds
          if (onEnd) setTimeout(onEnd, 500);
        }
      }
    };
  }

  // ── Deepgram WebSocket Streaming ──────────────────────────────────────────
  if (engine === "deepgram" || engine === "deepgram-nova3") {
    const dgKey = getDeepgramKey();
    if (!dgKey) {
      if (onInterim) onInterim("⚠ No Deepgram key — add it in Settings");
      setTimeout(function(){ if (onEnd) onEnd(); }, 2000);
      return { stop: function(){} };
    }

    let ws = null, mr = null, streamRef = null, stopped = false;

    // iOS Safari check — MediaRecorder on iPhone produces fragmented MP4
    // which doesn't stream reliably over WebSocket to Deepgram
    const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
    if (isIOS) {
      if (onInterim) onInterim("⚠ Deepgram real-time streaming has limited support on iPhone. Switch to OpenAI Whisper in Settings for best results on iPhone.");
      setTimeout(function(){ if (onEnd) onEnd(); }, 4000);
      return { stop: function(){} };
    }

    const connect = function() {
      navigator.mediaDevices.getUserMedia({ audio: true })
        .then(function(s) {
          streamRef = s;
          // Choose best MIME type for Deepgram (prefer Opus/WebM, fall back to mp4)
          const mimeType = MediaRecorder.isTypeSupported("audio/webm;codecs=opus")
            ? "audio/webm;codecs=opus"
            : MediaRecorder.isTypeSupported("audio/webm")
              ? "audio/webm"
              : "";
          const dgModel = engine === "deepgram-nova3" ? "nova-3" : "nova-2-medical";
          const url = `wss://api.deepgram.com/v1/listen?model=${dgModel}&language=en&smart_format=true&interim_results=true&endpointing=300`
            + (mimeType ? "&encoding=opus&container=webm" : "");
          ws = new WebSocket(url, ["token", dgKey]);

          ws.onopen = function() {
            mr = mimeType ? new MediaRecorder(streamRef, { mimeType }) : new MediaRecorder(streamRef);
            mr.ondataavailable = function(e) { if (e.data.size > 0 && ws.readyState === 1) ws.send(e.data); };
            mr.start(250);
          };

          ws.onmessage = function(e) {
            try {
              const d = JSON.parse(e.data);
              if (d.type === "Results") {
                const text = (d.channel && d.channel.alternatives && d.channel.alternatives[0] && d.channel.alternatives[0].transcript) || "";
                if (d.is_final && text.trim()) { onFinal(text.trim()); if (onInterim) onInterim(""); }
                else if (!d.is_final && text.trim()) { if (onInterim) onInterim(text); }
              }
            } catch(err) {}
          };

          ws.onclose = function() {
            try { streamRef.getTracks().forEach(function(t){ t.stop(); }); } catch(e) {}
            if (!stopped && keepRef && keepRef.current) setTimeout(connect, 300);
            else if (onEnd) onEnd();
          };

          ws.onerror = function() { try { ws.close(); } catch(e) {} };
        })
        .catch(function() { if (onEnd) onEnd(); });
    };

    connect();
    return {
      stop: function() {
        stopped = true;
        if (keepRef) keepRef.current = false;
        try { if (mr) mr.stop(); } catch(e) {}
        try { if (ws) ws.close(); } catch(e) {}
      }
    };
  }

  // ── AssemblyAI Real-Time Streaming (Dragon-style live text) ──────────────────
  // Uses PCM16 audio over WebSocket — requires temp token, then streams raw audio
  if (engine === "assemblyai-live") {
    const aaiKey = getAssemblyAIKey();
    if (!aaiKey) {
      if (onInterim) onInterim("⚠ No AssemblyAI key — add it in Settings");
      setTimeout(function(){ if (onInterim) onInterim(""); if (onEnd) onEnd(); }, 6000);
      return { stop: function(){} };
    }

    let ws = null, audioCtx = null, processor = null, source = null, micStream = null;
    let stopped = false;

    // Token endpoint (/v2/realtime/token) returns 404 — API changed.
    // AssemblyAI accepts the API key directly as the WebSocket token.
    navigator.mediaDevices.getUserMedia({ audio: true })
      .then(function(stream) {
          micStream = stream;

          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          const sampleRate = audioCtx.sampleRate;

          // API key used directly — no temp token needed
          const wsUrl = "wss://api.assemblyai.com/v2/realtime/ws?sample_rate=" + sampleRate
            + "&token=" + aaiKey;

          ws = new WebSocket(wsUrl);
          {  // open brace to match nesting

          ws.onopen = function() {
            if (onInterim) onInterim("🎙 AssemblyAI Live — speak now");

            // Step 4: Capture PCM16 from mic and send to WebSocket
            source = audioCtx.createMediaStreamSource(micStream);
            processor = audioCtx.createScriptProcessor(4096, 1, 1);

            processor.onaudioprocess = function(e) {
              if (!ws || ws.readyState !== WebSocket.OPEN || stopped) return;
              const float32 = e.inputBuffer.getChannelData(0);
              // Convert Float32 (-1..1) to Int16 PCM
              const int16 = new Int16Array(float32.length);
              for (var i = 0; i < float32.length; i++) {
                int16[i] = Math.max(-32768, Math.min(32767, Math.round(float32[i] * 32767)));
              }
              ws.send(int16.buffer);
            };

            source.connect(processor);
            processor.connect(audioCtx.destination);
          };

          ws.onmessage = function(e) {
            try {
              const msg = JSON.parse(e.data);
              if (msg.message_type === "PartialTranscript" && msg.text && msg.text.trim()) {
                if (onInterim) onInterim(msg.text.trim());
              } else if (msg.message_type === "FinalTranscript" && msg.text && msg.text.trim()) {
                onFinal(msg.text.trim());
                if (onInterim) onInterim("");
              }
            } catch(err) {}
          };

          ws.onerror = function() {
            if (onInterim) onInterim("⚠ AssemblyAI Live connection error — check your key or try batch mode");
            setTimeout(function() { try { ws.close(); } catch(e2) {} }, 500);
          };

          ws.onclose = function() {
            try { if (processor) processor.disconnect(); } catch(e2) {}
            try { if (source) source.disconnect(); } catch(e2) {}
            try { if (audioCtx) audioCtx.close(); } catch(e2) {}
            try { if (micStream) micStream.getTracks().forEach(function(t){ t.stop(); }); } catch(e2) {}
            if (!stopped && keepRef && keepRef.current) {
              setTimeout(function() {
                if (keepRef && keepRef.current) {
                  const newSession = createDictationSession({ onFinal, onInterim, onEnd, keepRef });
                  if (keepRef) keepRef._aaiLiveRef = newSession;
                }
              }, 300);
            } else {
              if (onEnd) onEnd();
            }
          };
          } // close WSS block
      })
      .catch(function(err) {
        if (onInterim) onInterim("⚠ AssemblyAI Live: " + (err.message || "Connection error") + " — check your API key in Settings");
        setTimeout(function() { if (onInterim) onInterim(""); if (onEnd) onEnd(); }, 6000);
      });

    return {
      stop: function() {
        stopped = true;
        if (keepRef) keepRef.current = false;
        try {
          if (ws && ws.readyState === WebSocket.OPEN) {
            ws.send(JSON.stringify({ terminate_session: true }));
            setTimeout(function() { try { ws.close(); } catch(e2) {} }, 300);
          } else {
            try { if (ws) ws.close(); } catch(e2) {}
          }
        } catch(e) {}
        try { if (processor) processor.disconnect(); } catch(e) {}
        try { if (source) source.disconnect(); } catch(e) {}
        try { if (audioCtx) audioCtx.close(); } catch(e) {}
        try { if (micStream) micStream.getTracks().forEach(function(t){ t.stop(); }); } catch(e) {}
      }
    };
  }

  // ── Whisper / Azure Batch ─────────────────────────────────────────────────
  // JUNE 6 TEST: Azure Speech uses same recording pattern as Whisper
  const isAzure = engine === "azure-speech";
  const isAssemblyAI = engine === "assemblyai";
  const isDgBatch = engine === "deepgram-batch";
  if (isAzure) {
    const azKey = getAzureKey();
    if (!azKey) {
      if (onInterim) onInterim("⚠ No Azure Speech key — go to Settings, enter your Azure key, and tap Save");
      setTimeout(function(){ if (onInterim) onInterim(""); if (onEnd) onEnd(); }, 6000);
      return { stop: function(){} };
    }
  }
  if (isAssemblyAI) {
    const aaiKey = getAssemblyAIKey();
    if (!aaiKey) {
      if (onInterim) onInterim("⚠ No AssemblyAI key — go to Settings, enter your AssemblyAI key, and tap Save");
      setTimeout(function(){ if (onInterim) onInterim(""); if (onEnd) onEnd(); }, 6000);
      return { stop: function(){} };
    }
  }
  if (isDgBatch) {
    const dgBatchKey = getDeepgramKey();
    if (!dgBatchKey) {
      if (onInterim) onInterim("⚠ No Deepgram key — go to Settings, enter your Deepgram key, and tap Save");
      setTimeout(function(){ if (onInterim) onInterim(""); if (onEnd) onEnd(); }, 6000);
      return { stop: function(){} };
    }
  }
  const oaiKey = (isAzure || isAssemblyAI || isDgBatch) ? "BATCH_PROVIDER" : getApiKey();
  if (!isAzure && !isAssemblyAI && !isDgBatch && !oaiKey) {
    if (onInterim) onInterim("⚠ No OpenAI key — add it in Settings");
    setTimeout(function(){ if (onEnd) onEnd(); }, 2000);
    return { stop: function(){} };
  }

  let mr2 = null;
  const chunks = [];

  navigator.mediaDevices.getUserMedia({ audio: true })
    .then(function(wStream) {
      if (onInterim) onInterim("🎙 Recording… tap Stop when done");
      mr2 = new MediaRecorder(wStream);
      mr2.ondataavailable = function(e) { if (e.data.size > 0) chunks.push(e.data); };
      mr2.onstop = async function() {
        try { wStream.getTracks().forEach(function(t){ t.stop(); }); } catch(e) {}
        if (onInterim) onInterim("⏳ Transcribing…");
        if (chunks.length > 0) {
          // FLAG: track whether we showed a timed message so we don't wipe it instantly
          let keepInterimAlive = false;
          try {
            const blob = new Blob(chunks, { type: (chunks[0] && chunks[0].type) ? chunks[0].type : "audio/webm" });
            chunks.length = 0; // Claim 20: discard raw audio chunks immediately after blob creation
            const fd = new FormData();
            fd.append("file", blob, "dictation.webm");
            fd.append("model", "whisper-1");
            fd.append("language", "en");
            fd.append("prompt", "Medical clinical dictation by a physician. Common medical terms: community-acquired pneumonia, azithromycin, ceftriaxone, leukocytosis, reassess, normocardiac, tachycardia, bradycardia, tachypneic, hypoxia, dyspnea, creatinine, procalcitonin, lactate, WBC decreasing, WBC increasing, bilateral consolidation, pleural effusion, crackles, rhonchi, edema, oriented times three, no JVD, non-tender abdomen, metformin, amlodipine, lisinopril, furosemide, vancomycin, piperacillin, SpO2, FiO2, supplemental oxygen, IV fluids, blood cultures pending, sputum culture, hypertension, diabetes, hyperlipidemia, antibiotic therapy, sliding scale insulin, respiratory examination, breath sounds.");
            let transcribedText = "";
            if (isAzure) {
              // JUNE 6 TEST: Route to Azure Cognitive Speech
              transcribedText = await transcribeWithAzure(blob);
            } else if (isAssemblyAI) {
              // JUNE 6 TEST: Route to AssemblyAI
              if (onInterim) onInterim("⏳ Sending to AssemblyAI… (may take 5-15 seconds)");
              transcribedText = await transcribeWithAssemblyAI(blob);
            } else if (isDgBatch) {
              // JUNE 6 TEST: Route to Deepgram Nova-3 Batch (iPhone compatible)
              if (onInterim) onInterim("⏳ Sending to Deepgram batch… (2-4 seconds)");
              transcribedText = await transcribeWithDeepgramBatch(blob);
            } else {
              const resp = await fetch("https://api.openai.com/v1/audio/transcriptions", {
                method: "POST",
                headers: { "Authorization": "Bearer " + oaiKey },
                body: fd,
              });
              const data = await resp.json();
              // DIAGNOSTIC FIX: check resp.ok — if API key is bad or quota exceeded,
              // data.text is undefined (not an exception), silently returning empty string
              if (!resp.ok) {
                throw new Error("Whisper API " + resp.status + ": " + (data.error?.message || "Check your OpenAI API key in Settings"));
              }
              transcribedText = data.text || "";
            }
            // JUNE 6 TEST: Optional medical term correction pass
            if (transcribedText && transcribedText.trim()) {
              const diagnosis = typeof patient !== "undefined" ? (patient.diagnosis || "") : "";
              const corrected = await correctMedicalTranscript(transcribedText.trim(), diagnosis);
              onFinal(corrected);
            } else {
              // Transcription returned empty — show diagnostic message, keep it alive for 5s
              keepInterimAlive = true;
              const engineLabel = isAssemblyAI ? "AssemblyAI" : isDgBatch ? "Deepgram batch" : isAzure ? "Azure" : "Whisper";
              if (onInterim) onInterim("⚠ " + engineLabel + " returned empty transcript — make sure your key is saved in Settings, speak louder, or try a different engine");
              setTimeout(function() { if (onInterim) onInterim(""); if (onEnd) onEnd(); }, 6000);
            }
          } catch(err) {
            // ERROR: keep message alive — do NOT let the onInterim("") below wipe it immediately
            keepInterimAlive = true;
            console.error("Transcription error:", err);
            if (onInterim) onInterim("⚠ " + (err.message || "Transcription failed") + " — check your API key in Settings");
            setTimeout(function() { if (onInterim) onInterim(""); if (onEnd) onEnd(); }, 6000);
          }
          // Only clear interim if we didn't set a timed message above
          if (!keepInterimAlive) {
            if (onInterim) onInterim("");
            if (onEnd) onEnd();
          }
        } else {
          // No audio chunks recorded at all
          if (onInterim) onInterim("⚠ No audio captured — try again");
          setTimeout(function() { if (onInterim) onInterim(""); if (onEnd) onEnd(); }, 3000);
        }
      };
      mr2.start(250);
    })
    .catch(function(err) {
      // getUserMedia failed OR something inside .then() threw — surface the error
      console.error("Batch mic/setup error:", err);
      if (onInterim) onInterim("⚠ Mic error: " + (err && err.message ? err.message : "Cannot access microphone — check permissions in browser settings"));
      setTimeout(function() { if (onInterim) onInterim(""); if (onEnd) onEnd(); }, 6000);
    });

  return { stop: function() { try { if (mr2) mr2.stop(); } catch(e) {} } };
};

const formatTimestamp = (iso) => {
  if (!iso) return null;
  try {
    const d = new Date(iso);
    const months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
    const h = d.getHours(), m = d.getMinutes();
    const ampm = h >= 12 ? "PM" : "AM";
    const hr = h % 12 || 12;
    const min = m < 10 ? "0" + m : m;
    return `${hr}:${min} ${ampm} · ${months[d.getMonth()]} ${d.getDate()}`;
  } catch(e) { return null; }
};

// ─── JUNE 6 TEST: Azure Cognitive Speech (batch, like Whisper) ─────────────────
const transcribeWithAzure = async (audioBlob) => {
  const key    = getAzureKey();
  const region = getAzureRegion();
  if (!key) throw new Error("No Azure Speech key — add it in Settings");

  // Azure REST API supports: audio/wav, audio/ogg;codecs=opus, audio/webm;codecs=opus
  // Force a clean Content-Type — strip extra params Azure doesn't always handle
  let contentType = audioBlob.type || "audio/webm";
  // Normalize: "audio/webm;codecs=opus" → "audio/webm; codecs=opus" (Azure prefers this form)
  if (contentType.includes("webm")) contentType = "audio/webm; codecs=opus";
  if (contentType.includes("mp4"))  contentType = "audio/mp4";

  // detailed=true gives us more fields including RecognitionStatus
  const url = `https://${region}.stt.speech.microsoft.com/speech/recognition/conversation/cognitiveservices/v1?language=en-US&format=detailed&profanity=raw`;
  const res = await fetch(url, {
    method: "POST",
    headers: { "Ocp-Apim-Subscription-Key": key, "Content-Type": contentType },
    body: audioBlob,
  });
  if (!res.ok) {
    const err = await res.text().catch(() => "");
    throw new Error(`Azure Speech error ${res.status}: ${err.substring(0, 200)}`);
  }
  const data = await res.json();

  // Surface the RecognitionStatus so we know exactly what Azure saw
  const status = data.RecognitionStatus || "";
  if (status === "NoMatch" || status === "InitialSilenceTimeout" || status === "BabbleTimeout") {
    throw new Error(`Azure: ${status} — audio may be too quiet, too short, or format unsupported. Try speaking louder for at least 2 seconds.`);
  }
  if (status === "Error") {
    throw new Error("Azure Speech: processing error — check your key and region in Settings");
  }

  return data.DisplayText || (data.NBest && data.NBest[0] && data.NBest[0].Display) || "";
};

// ─── JUNE 6 TEST: Deepgram Nova-3 BATCH mode (works on iPhone — no WebSocket) ───
// Sends complete audio file to Deepgram REST API after recording stops
// Same UX as Whisper: record → stop → wait 2-3s → transcript appears
const transcribeWithDeepgramBatch = async (audioBlob) => {
  const key = getDeepgramKey();
  if (!key) throw new Error("No Deepgram key — add it in Settings");

  // Nova-3 uses `keyterm` not `keywords` (keywords deprecated for Nova-3)
  // keyterm takes bare words only — no `:boost` suffix
  const medicalKeyterms = [
    "troponin","creatinine","leukocytosis","tachycardia","bradycardia",
    "furosemide","metoprolol","lisinopril","apixaban","ticagrelor",
    "empagliflozin","dapagliflozin","atorvastatin","clopidogrel",
    "vancomycin","piperacillin","azithromycin","ceftriaxone",
    "procalcitonin","BNP","proBNP","hemoglobin","hematocrit",
    "echocardiogram","pneumothorax","atelectasis","consolidation",
    "dyspnea","tachypnea","hypoxia","SpO2","FiO2",
    "COPD","CHA2DS2-VASc","TIMI","HEART","troponemia"
  ];
  // Try nova-3-medical first, fall back to nova-3 if not available
  const tryModels = ["nova-3-medical", "nova-3"];

  for (const model of tryModels) {
    const params = new URLSearchParams({
      model,
      smart_format: "true",
      punctuate: "true",
      language: "en",
    });
    // keyterm = correct Nova-3 parameter (repeated, one per term, no boost values)
    medicalKeyterms.forEach(kw => params.append("keyterm", kw));

    const url = "https://api.deepgram.com/v1/listen?" + params.toString();
    const res = await fetch(url, {
      method: "POST",
      headers: {
        "Authorization": `Token ${key}`,
        "Content-Type": audioBlob.type || "audio/webm; codecs=opus",
      },
      body: audioBlob,
    });

    if (res.status === 400) {
      const errBody = await res.text().catch(() => "");
      // If model not found, try next model in list
      if (errBody.includes("model") || errBody.includes("invalid") || model !== tryModels[tryModels.length - 1]) {
        console.warn(`Deepgram: model ${model} failed (${res.status}), trying next...`);
        continue;
      }
      throw new Error(`Deepgram batch error ${res.status}: ${errBody.substring(0, 200)}`);
    }

    if (!res.ok) {
      const err = await res.text().catch(() => "");
      throw new Error(`Deepgram batch error ${res.status}: ${err.substring(0, 200)}`);
    }

    const data = await res.json();
    const transcript = data?.results?.channels?.[0]?.alternatives?.[0]?.transcript || "";
    if (transcript) console.log(`Deepgram batch success with model: ${model}`);
    return transcript;
  }
  throw new Error("Deepgram batch: all models failed — check your API key and try again");
};

// ─── Streaming API call — yields text chunks as they arrive ──────────────────
const callOpenAIStream = async (messages, onChunk) => {
  const key = getApiKey();
  if (!key) throw new Error("No API key");
  const _m = getApiModel();
  const _body = { model: _m, messages, stream: true, store: false };  // ZDR: do not retain — HIPAA
  if (!_m.startsWith("gpt-5")) _body.temperature = 0.3;
  const res = await fetch("https://api.openai.com/v1/chat/completions", {
    method: "POST",
    headers: { "Content-Type": "application/json", "Authorization": `Bearer ${key}` },
    body: JSON.stringify(_body),
  });
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error(err?.error?.message || `OpenAI error ${res.status}`);
  }
  const reader  = res.body.getReader();
  const decoder = new TextDecoder();
  let full = "";
  let lineBuffer = "";
  window._roundai_chunks = []; // reset per-call chunk log // carries incomplete SSE lines across read() boundaries
  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    // Append decoded chunk to the carry-over buffer, then split on newlines.
    // pop() keeps the last (possibly incomplete) line in lineBuffer for next iteration.
    lineBuffer += decoder.decode(value, { stream: true });
    const lines = lineBuffer.split("\n");
    lineBuffer = lines.pop() ?? "";
    for (const line of lines) {
      const t = line.trim();
      if (!t.startsWith("data: ")) continue;
      const d = t.slice(6);
      if (d === "[DONE]") return full;
      try {
        const delta = JSON.parse(d).choices?.[0]?.delta?.content || "";
        if (delta) {
          // DEBUG: log each individual delta chunk as it arrives from the API.
          // Inspect in DevTools → Console: window._roundai_chunks
          // If corruption is present in a chunk here, the source is the API/model, not the app.
          if (!window._roundai_chunks) window._roundai_chunks = [];
          window._roundai_chunks.push(delta);
          full += delta; onChunk(full);
        }
      } catch(e) {}
    }
  }
  // Flush any final buffered line (e.g. if stream ended without trailing newline)
  if (lineBuffer.trim().startsWith("data: ")) {
    const d = lineBuffer.trim().slice(6);
    if (d !== "[DONE]") {
      try {
        const delta = JSON.parse(d).choices?.[0]?.delta?.content || "";
        if (delta) { full += delta; }
      } catch(e) {}
    }
  }
  // ── DEBUG: save raw API text to window so it can be compared to rendered output ──
  // Open DevTools → Console, type: _roundai_rawNote
  // Compare to what appears in the UI to locate any truncation source.
  window._roundai_rawNote = full;
  window._roundai_rawNoteTimestamp = new Date().toISOString();
  return full;
};

// ─── Clinical Task Helpers ────────────────────────────────────────────────────

// Deduplicates new tasks against existing ones.
// Uses both exact text match AND word-overlap (catches rephrasing of same task,
// e.g. "Hold home lisinopril" vs "Hold lisinopril at home").
const mergeTasksDedup = (existingTasks, newItems) => {
  const norm = (s) => (s||"").toLowerCase().trim().replace(/[^a-z0-9\s]/g,"").replace(/\s+/g," ");
  const sig  = (s) => norm(s).split(" ").filter(w => w.length > 3).sort().join(" "); // meaningful-word signature
  const existingNorms = existingTasks.map(t => norm(t.text));
  const existingSigs  = existingTasks.map(t => sig(t.text));

  return [...existingTasks, ...newItems.filter(t => {
    if (!t?.text?.trim()) return false;
    const nt  = norm(t.text);
    const ns  = sig(t.text);
    const nw  = nt.split(" ").filter(w => w.length > 3);
    // 1. Exact normalised match
    if (existingNorms.includes(nt)) return false;
    // 2. Same meaningful-word signature (order-independent)
    if (existingSigs.includes(ns)) return false;
    // 3. High word-overlap — catches "Hold home lisinopril" ↔ "Hold lisinopril"
    if (nw.length > 0 && existingNorms.some(en => {
      const ew = en.split(" ").filter(w => w.length > 3);
      const hits = nw.filter(w => ew.includes(w)).length;
      return hits / Math.max(nw.length, ew.length) >= 0.65;
    })) return false;
    return true;
  })];
};

  if (!s) return "active";
  const l = s.toString().toLowerCase().trim();
  if (["held","hold","on hold","paused","suspended"].includes(l))          return "held";
  if (["discontinued","d/c","dc","stopped","discont"].includes(l))         return "discontinued";
  if (["changed","modified","adjusted","dose change","titrated"].includes(l)) return "changed";
  return "active"; // active / current / continue / ongoing / anything else → active
};
const saveCustomTemplates = (templates) => {
  localStorage.setItem("rounding_templates", JSON.stringify(templates));
};

const generateSOAPNote = (patient) => {
  if (patient.encType === "consult") {
    return `REASON FOR CONSULTATION:\n[Consulting physician to specify the clinical question]\n\nHISTORY OF PRESENT ILLNESS:\n${patient.preRoundNotes || "See chart."}\n\nPERTINENT MEDICAL HISTORY:\n${(patient.medications||[]).filter(m=>m.status==="active").map(m=>m.name).join(", ") || "See chart."}\n\nPHYSICAL EXAMINATION:\nPertinent findings as documented.\n\nPERTINENT RESULTS:\n${(patient.labs||[]).map(l=>`${l.name}: ${l.value}`).join(", ") || "See chart."}\n\nASSESSMENT:\n[Specialist clinical impression addressing the consult question]\n\nRECOMMENDATIONS:\n1. [Specific recommendation]\n2. [Specific recommendation]\n3. [Specific recommendation]\n\nThank you for this consultation. I am available for further questions.`;
  }
  if (patient.encType === "new") {
    const lastName = patient.name.split(" ")[1];
    return `CHIEF COMPLAINT:\nHypertensive urgency with newly discovered kidney disease.\n\nHISTORY OF PRESENT ILLNESS:\nMr. ${lastName} is a ${patient.age}-year-old male presenting with markedly elevated blood pressure of 194/112 and incidentally discovered CKD stage 4 (eGFR 22). No prior diagnosis of kidney disease. Patient denies chest pain, vision changes, or headache. Proteinuria on urinalysis.\n\nPHYSICAL EXAMINATION:\n• General: Alert, no acute distress\n• Cardiovascular: Regular rate and rhythm, no murmurs\n• Abdomen: Soft, non-tender\n• Extremities: No edema\n\nASSESSMENT:\n1. Hypertensive urgency — BP 194/112, etiology unclear\n2. CKD stage 4 (eGFR 22) — newly diagnosed; likely hypertensive nephropathy vs primary renal disease\n\nPLAN:\n• IV hydralazine PRN for acute BP reduction\n• Start amlodipine 10mg daily, lisinopril 5mg daily\n• Nephrology consult placed — urgent\n• Renal ultrasound ordered\n• Repeat BMP in 6 hours\n• Monitor Cr on ACE inhibitor\n• Patient education: CKD and blood pressure management`;
  }

  // For follow-up patients — generate a SOAP note from available data
  const v = patient.vitals || {};
  const labLines = (patient.labs || []).map(l => `${l.name}: ${l.value}${l.trend ? " (" + l.trend + ")" : ""}`).join(", ");
  const activeMeds = (patient.medications || []).filter(m => m.status === "active").map(m => m.name).join("\n• ");
  const heldMeds  = (patient.medications || []).filter(m => m.status === "held").map(m => m.name).join(", ");
  const pendingTasks = (patient.tasks || []).filter(t => !t.done).map(t => "• " + t.text).join("\n");

  // Build subjective from pre-round notes or transcript patient lines
  const ptLines = (patient.transcript || []).filter(e => e.speaker === "Pt").map(e => e.text);
  const subjective = patient.preRoundNotes
    ? patient.preRoundNotes
    : ptLines.length > 0
      ? ptLines.map(t => `Patient reports: "${t}"`).join(" ")
      : `Patient is a ${patient.age}-year-old admitted for ${patient.diagnosis}, hospital day ${patient.dayNum || 1}.`;

  return [
    "SUBJECTIVE:",
    subjective,
    "",
    "OBJECTIVE:",
    `Vitals: BP ${v.bp || "—"}, HR ${v.hr || "—"}, Temp ${v.temp || "—"}°F, O2 Sat ${v.o2 || "—"}%, Wt ${v.wt || "—"}`,
    labLines ? `Labs: ${labLines}` : "",
    "",
    "ASSESSMENT:",
    `1. ${patient.diagnosis} — hospital day ${patient.dayNum || 1}, under active management.`,
    "",
    "PLAN:",
    activeMeds ? `Active medications:\n• ${activeMeds}` : "",
    heldMeds   ? `Held: ${heldMeds}` : "",
    pendingTasks ? `Pending tasks:\n${pendingTasks}` : "",
  ].filter(l => l !== "").join("\n");
};

const extractTasksFromText = (text, startId) => {
  const tasks = [];
  let id = startId;
  const patterns = [
    { re: /repeat|recheck|follow[\s-]?up on.*(lab|bmp|cbc|cmp|cxr)/i, label: "Recheck labs" },
    { re: /nephrology|cardiology|pulmonology|consult/i, label: "Place consult" },
    { re: /discharge|d\/c\s+plan/i, label: "Coordinate discharge planning" },
    { re: /counsel|educate|discuss with patient/i, label: "Patient education / counseling" },
  ];
  patterns.forEach(({ re, label }) => {
    if (re.test(text) && !tasks.find(t => t.text === label)) {
      tasks.push({ id: id++, text: label, done: false, category: "plan", urgent: false });
    }
  });
  return tasks;
};

// ─── Claim 8: Temporal Query Resolution ──────────────────────────────────────
// Resolves relative temporal phrases ("yesterday", "two days ago", "last time")
// into absolute date ranges anchored to the patient's admission and current date.
const resolveTemporalQuery = (query, patient) => {
  const now    = new Date();
  const today  = now.toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" });
  const fmt    = (d) => d.toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" });
  const q      = query.toLowerCase();
  let resolved = null;

  if (/\byesterday\b/.test(q)) {
    const d = new Date(now); d.setDate(d.getDate() - 1);
    resolved = `Temporal context: the phrase "yesterday" refers to ${fmt(d)}.`;
  } else if (/\btwo days ago\b|2 days ago/.test(q)) {
    const d = new Date(now); d.setDate(d.getDate() - 2);
    resolved = `Temporal context: "two days ago" refers to ${fmt(d)}.`;
  } else if (/\bthree days ago\b|3 days ago/.test(q)) {
    const d = new Date(now); d.setDate(d.getDate() - 3);
    resolved = `Temporal context: "three days ago" refers to ${fmt(d)}.`;
  } else if (/\blast week\b/.test(q)) {
    const d = new Date(now); d.setDate(d.getDate() - 7);
    resolved = `Temporal context: "last week" refers to the period starting around ${fmt(d)}.`;
  } else if (/\blast time\b|prior visit|prior encounter|previous encounter/.test(q)) {
    const lastEntry = (patient.transcriptHistory || []).slice(-1)[0];
    resolved = lastEntry
      ? `Temporal context: "last time" refers to the encounter labelled "${lastEntry.label}".`
      : `Temporal context: "last time" — no prior encounter on record for this admission.`;
  } else if (/\bearlier this admission\b|since admission|at admission/.test(q)) {
    resolved = patient.admitDate
      ? `Temporal context: "this admission" started ${patient.admitDate} (Hospital Day ${patient.dayNum || 0} today, ${today}).`
      : `Temporal context: current admission, Hospital Day ${patient.dayNum || 0} today (${today}).`;
  } else if (/\btoday\b/.test(q)) {
    resolved = `Temporal context: today is ${today}.`;
  }
  return resolved;
};

// ─── Claim 21-B: Query Type Classification ───────────────────────────────────
// Classifies a physician query into one of five types before routing to AI,
// enabling context emphasis appropriate to each query category.
const classifyQuery = (query) => {
  const q = query.toLowerCase();
  if (/medication|drug|dose|mg|started|stopped|held|changed|antibiotic|diuretic|insulin|statin|ace|beta.block|metformin|lasix|furosemide|vancomycin|lisinopril|amlodipine|metoprolol/.test(q))
    return "medication-change-recall";
  if (/task|pending|to.do|follow.up|ordered|order|call|consult|repeat|schedule|plan/.test(q))
    return "task-status-recall";
  if (/said|told|reported|complain|symptom|patient.*say|what.*patient|patient.*feel|patient.*describe/.test(q))
    return "transcript-recall";
  if (/yesterday|last time|days ago|earlier|prior|before|last visit|since admission|changed|worsened|improved|trend/.test(q))
    return "temporal-change-recall";
  if (/note|assessment|plan|diagnosis|impression|soap|summary/.test(q))
    return "note-content-recall";
  return "general";
};

// Build a context emphasis string based on query type
const buildQuerySystemPrompt = (queryType) => {
  // Claim 13: provenance — always cite date, time, and speaker when referencing transcript content
  const base = "You are a clinical AI assistant helping a physician during hospital rounds. Answer questions about a specific patient using ONLY the provided patient data. Be concise, accurate, and clinically relevant. If the answer isn't in the data, say so clearly. Aim for 2–4 sentences. When referencing information from the encounter transcript or prior encounters, always cite the source — include the date, time of day, and speaker (Physician or Patient) so the clinician knows exactly when and who said it.";
  const emphasis = {
    "medication-change-recall": " Pay particular attention to the ACTIVE MEDICATIONS, HELD MEDICATIONS, and any medication mentions in the transcript or note.",
    "task-status-recall": " Focus on the PENDING TASKS section and any plan items in the note or transcript.",
    "transcript-recall": " Focus on the ENCOUNTER TRANSCRIPT section — quote the patient's exact words where possible.",
    "temporal-change-recall": " Focus on changes over time. Compare current data to any prior values mentioned. Reference the resolved temporal context provided.",
    "note-content-recall": " Focus on the SOAP NOTE section.",
    "general": "",
  };
  return base + (emphasis[queryType] || "");
};

const getRecallResponse = (query) => {
  const q = query.toLowerCase();
  for (const [pattern, response] of Object.entries(RECALL_RESPONSES)) {
    if (pattern.split("|").some(p => q.includes(p))) return response;
  }
  return `No documented record found for: "${query}". Try asking about symptoms, medications, weight, labs, or prior counseling.`;
};

  const initials = patient.name.split(" ").map(n => n[0]).slice(0,2).join("");
  const statusBorderColor = {
    pending: "border-l-amber-300",
    "pre-rounded": "border-l-blue-400",
    "in-encounter": "border-l-orange-400",
    "post-rounded": "border-l-green-400",

    "post-rounded": "bg-green-100 text-green-700",

          <div className="flex items-center gap-2.5">

            <div>
              <div className="flex items-center gap-1.5">
                <span className="font-bold text-slate-800 text-sm">{patient.name}</span>
                {urgent && <AlertCircle size={13} className="text-red-400" />}
              </div>
              <p className="text-xs text-slate-500 mt-0.5">Room {patient.room} · {patient.age}y · Day {patient.dayNum}</p>

          </div>
          <div className="flex items-center gap-1.5">
            <button
              onClick={handleDelete}
              className="w-7 h-7 rounded-lg flex items-center justify-center text-slate-300 hover:text-red-400 hover:bg-red-50 transition-colors"
              title="Discharge / remove patient"
            >
              <Trash2 size={14} />

            <ChevronRight size={17} className="text-slate-300 mt-0.5 flex-shrink-0" />

        <p className="text-sm text-slate-600 mb-3 leading-relaxed ml-0.5">{patient.diagnosis}</p>
        <div className="flex items-center justify-between">

};

// ─── Handoff Screen ───────────────────────────────────────────────────────────
const HandoffScreen = ({ patients, onBack }) => {
  // Structured summary: { intro, activeDx: [], barriers: [], followup: [] }
  const [aiSummaries, setAiSummaries] = useState({});
  const [generating, setGenerating]   = useState(false);
  const [copied, setCopied]           = useState(false);
  const [genProgress, setGenProgress] = useState("");

  // Auto-generate AI summaries on mount if API key available
  useEffect(() => {
    if (getApiKey() && patients.length > 0) {
      generateAISummaries();
    }
  }, []);

  // Instant template — builds structured object from existing patient data
  const templateStruct = (p) => {
    const reason  = (p.admissionSummary?.reason||"").replace(/\n/g," ").trim();
    const course  = (p.admissionSummary?.course||"").split("\n").filter(l=>l.trim())
                     .map(l=>l.replace(/[⏳✓]/g,"").replace(/Encounter done/gi,"").replace(/Pre-rounded\.?/gi,"").trim())
                     .filter(l=>l.length>5);
    const latestCourse = course.slice(-1)[0] || "";
    const intro   = reason ? (reason.substring(0,280) + (latestCourse ? ` ${latestCourse}.` : "")) : `${p.age||"?"}yo admitted for ${p.diagnosis}.`;
    const activeDx = (p.importantPoints||[]).map(i=>i.text);
    const allTasks = (p.tasks||[]).filter(t=>!t.done).map(t=>t.text);
    // Heuristic: discharge-related tasks vs day-to-day follow-up
    const barrierKw = ["discharge","placement","snf","echocardiogram pending","pending","decision","family","anticoag","hold","waiting","arrange","clear"];
    const barriers  = allTasks.filter(t=>barrierKw.some(k=>t.toLowerCase().includes(k)));
    const followup  = allTasks.filter(t=>!barriers.includes(t));
    return { intro, activeDx, barriers, followup };
  };

  // AI-enhanced structured summaries
  const generateAISummaries = async () => {
    if (!getApiKey()) return;
    setGenerating(true);
    const results = {};
    for (const p of patients) {
      setGenProgress(`Generating handoff for ${p.name}…`);
      try {
        const course = (p.admissionSummary?.course||"").split("\n").filter(l=>l.trim()).slice(-3).join(" ");
        const tasks  = (p.tasks||[]).filter(t=>!t.done).map(t=>t.text).join("; ");
        const issues = (p.importantPoints||[]).map(i=>i.text).join("; ");
        const resp   = await callOpenAI([
          { role:"system", content:"You are a physician writing a structured clinical handoff. Be concise and clinically specific. Return only valid JSON." },
          { role:"user",   content:`Generate a structured handoff for this patient.

Patient: ${p.name}, ${p.age||"?"}yo, Room ${p.room}, Hospital Day ${p.dayNum||0}
Diagnosis: ${p.diagnosis}
Background: ${p.admissionSummary?.reason||"Not documented"}
Recent course: ${course||"Not documented"}
Vitals: BP ${p.vitals?.bp||"—"}, HR ${p.vitals?.hr||"—"}, O₂ ${p.vitals?.o2||"—"}%, Wt ${p.vitals?.wt||"—"}
Active issues on file: ${issues||"None"}
Pending tasks on file: ${tasks||"None"}
Pre-round notes: ${p.preRoundNotes||"None"}

Return ONLY valid JSON with these four fields:
{
  "intro": "2-3 sentence clinical background: patient demographics + PMHx + reason for admission + brief current status",
  "active_diagnoses": ["diagnosis — current status/trend", "..."],
  "discharge_barriers": ["specific reason patient cannot be discharged yet", "..."],
  "followup_tomorrow": ["specific action or check needed tomorrow", "..."]
}` }
        ], { jsonMode: true, temperature: 0.2 });
        const parsed = JSON.parse(resp);
        results[p.id] = {
          intro:     parsed.intro || "",
          activeDx:  parsed.active_diagnoses || [],
          barriers:  parsed.discharge_barriers || [],
          followup:  parsed.followup_tomorrow || [],
        };
      } catch(e) { results[p.id] = templateStruct(p); }
    }
    setAiSummaries(results);
    setGenProgress("");
    setGenerating(false);
  };

  const getStruct = (p) => aiSummaries[p.id] || templateStruct(p);

  // Build plain text for email / clipboard
  const buildFullText = () => {
    const date = new Date().toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric",year:"numeric"});
    const time = new Date().toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"});
    let text = `PATIENT HANDOFF\n${date} · ${time}\n${"═".repeat(50)}\n\n`;
    patients.forEach((p,i) => {
      const s = getStruct(p);
      text += `${i+1}. ${p.name.toUpperCase()} | Room ${p.room} | Day ${p.dayNum||"—"} | ${p.diagnosis}\n\n`;
      text += `${s.intro}\n\n`;
      if (s.activeDx.length) {
        text += `ACTIVE DIAGNOSES:\n${s.activeDx.map(d=>`  • ${d}`).join("\n")}\n\n`;
      }
      if (s.barriers.length) {
        text += `BARRIERS TO DISCHARGE:\n${s.barriers.map(b=>`  • ${b}`).join("\n")}\n\n`;
      }
      if (s.followup.length) {
        text += `FOLLOW-UP TOMORROW:\n${s.followup.map(f=>`  • ${f}`).join("\n")}\n\n`;
      }
      text += `${"─".repeat(50)}\n\n`;
    });
    return text.trim();
  };

  const emailHandoff = () => {
    const date = new Date().toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"});
    const subject = `Patient Handoff — ${date} — ${patients.length} patient${patients.length!==1?"s":""}`;
    window.location.href = `mailto:?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(buildFullText())}`;
  };

  const copyHandoff = () => {
    navigator.clipboard.writeText(buildFullText()).then(() => {
      setCopied(true); setTimeout(() => setCopied(false), 2500);
    }).catch(() => {
      // fallback for non-HTTPS
      const ta = document.createElement("textarea");
      ta.value = buildFullText(); document.body.appendChild(ta);
      ta.select(); document.execCommand("copy"); document.body.removeChild(ta);
      setCopied(true); setTimeout(() => setCopied(false), 2500);
    });
  };

  return (
    <div className="flex flex-col min-h-screen bg-slate-50">
      {/* Header */}
      <div className="bg-white border-b border-slate-200 px-5 pt-12 pb-4">
        <div className="flex items-center gap-3 mb-3">
          <button onClick={onBack} className="text-slate-700 p-1 -ml-1"><ArrowLeft size={22} /></button>
          <div className="flex-1">
            <h1 className="text-slate-900 text-xl font-bold">Handoff Summary</h1>
            <p className="text-slate-400 text-xs mt-0.5">{patients.length} patient{patients.length!==1?"s":""} · {new Date().toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric"})}</p>
          </div>
        </div>
        {/* Action buttons */}
        <div className="flex gap-2">
          <button onClick={emailHandoff}
            style={{flex:1,background:"#0f172a",color:"white",border:"none",cursor:"pointer",
              borderRadius:14,padding:"11px",fontSize:13,fontWeight:700,display:"flex",
              alignItems:"center",justifyContent:"center",gap:6}}>
            ✉ Email Handoff
          </button>
          <button onClick={copyHandoff}
            style={{flex:1,background: copied?"#0d9488":"white",color: copied?"white":"#0f172a",
              border:"2px solid #e2e8f0",cursor:"pointer",borderRadius:14,padding:"11px",
              fontSize:13,fontWeight:700,display:"flex",alignItems:"center",justifyContent:"center",gap:6}}>
            {copied ? "✓ Copied!" : "⎘ Copy Text"}
          </button>
        </div>
        {/* Auto-generation status — shown while AI is running */}
        {generating && (
          <div className="mt-2 flex items-center justify-center gap-1.5 text-xs text-teal-700 bg-teal-50 border border-teal-100 py-2 rounded-xl">
            <Loader2 size={11} className="animate-spin" />
            <span className="font-medium">{genProgress || "Generating AI summaries…"}</span>
          </div>
        )}
      </div>

      {/* Patient summaries */}
      <div className="flex-1 overflow-y-auto px-4 py-4 space-y-3 pb-12">
        {patients.map((p, i) => (
          <div key={p.id} className="bg-white rounded-2xl border border-slate-100 shadow-sm p-4">
            {/* Patient header */}
            <div className="flex items-start gap-2.5 mb-2.5">
              <div className="w-8 h-8 rounded-xl bg-slate-100 flex items-center justify-center text-xs font-bold text-slate-700 flex-shrink-0">
                {i+1}
              </div>
              <div className="flex-1 min-w-0">
                <p className="text-sm font-bold text-slate-900">{p.name}</p>
                <p className="text-xs text-slate-500">Room {p.room} · {p.age||"?"}y · {p.diagnosis} · Day {p.dayNum||"—"}</p>
              </div>
              <span className={`text-xs font-bold px-2 py-0.5 rounded-full flex-shrink-0 ${
                p.status==="post-rounded" ? "bg-green-100 text-green-700" :
                p.status==="note-ready"   ? "bg-teal-100 text-teal-700" :
                p.status==="in-encounter" ? "bg-orange-100 text-orange-700" :
                p.status==="pre-rounded"  ? "bg-blue-100 text-blue-700" :
                "bg-amber-100 text-amber-700"}`}>
                {p.status==="post-rounded"?"Rounded":p.status==="note-ready"?"Note Ready":p.status==="in-encounter"?"In Room":p.status==="pre-rounded"?"Pre-Rounded":"Pending"}
              </span>
            </div>
            {/* Structured summary */}
            {(() => {
              const s = getStruct(p);
              return (
                <div className="space-y-3">
                  {/* Intro — 2-3 lines */}
                  {s.intro && (
                    <p className="text-sm text-slate-700 leading-relaxed">{s.intro}</p>
                  )}
                  {/* Active diagnoses */}
                  {s.activeDx.length > 0 && (
                    <div>
                      <p className="text-xs font-bold text-slate-500 uppercase tracking-wide mb-1">Active Diagnoses</p>
                      {s.activeDx.map((d,di) => (
                        <div key={di} className="flex items-start gap-2 py-0.5">
                          <span className="text-teal-500 font-bold text-sm flex-shrink-0 mt-0.5">•</span>
                          <p className="text-sm text-slate-700 leading-snug">{d}</p>
                        </div>
                      ))}
                    </div>
                  )}
                  {/* Barriers to discharge */}
                  {s.barriers.length > 0 && (
                    <div>
                      <p className="text-xs font-bold text-amber-700 uppercase tracking-wide mb-1">Barriers to Discharge</p>
                      {s.barriers.map((b,bi) => (
                        <div key={bi} className="flex items-start gap-2 py-0.5">
                          <span className="text-amber-500 font-bold text-sm flex-shrink-0 mt-0.5">•</span>
                          <p className="text-sm text-slate-700 leading-snug">{b}</p>
                        </div>
                      ))}
                    </div>
                  )}
                  {/* Follow-up tomorrow */}
                  {s.followup.length > 0 && (
                    <div>
                      <p className="text-xs font-bold text-indigo-600 uppercase tracking-wide mb-1">Follow-Up Tomorrow</p>
                      {s.followup.map((f,fi) => (
                        <div key={fi} className="flex items-start gap-2 py-0.5">
                          <span className="text-indigo-400 font-bold text-sm flex-shrink-0 mt-0.5">→</span>
                          <p className="text-sm text-slate-700 leading-snug">{f}</p>
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              );
            })()}
          </div>
        ))}
        {patients.length === 0 && (
          <div className="text-center py-12">
            <p className="text-slate-400 font-semibold">No patients to hand off.</p>
          </div>
        )}
      </div>
    </div>
  );
};

// ─── Tasks Screen ─────────────────────────────────────────────────────────────
const TasksScreen = ({ patients, onBack }) => {
  const [copied, setCopied] = useState(false);

  const allPending = patients.flatMap(p =>
    (p.tasks || []).filter(t => !t.done).map(t => ({
      ...t, patientName: p.name, room: p.room, dayNum: p.dayNum
    }))
  );
  const urgent  = allPending.filter(t => t.urgent);
  const routine = allPending.filter(t => !t.urgent);

  // Group routine tasks by patient
  const byPatient = {};
  routine.forEach(t => {
    const key = t.patientName;
    if (!byPatient[key]) byPatient[key] = { room: t.room, dayNum: t.dayNum, tasks: [] };
    byPatient[key].tasks.push(t);
  });

  const buildText = () => {
    const date = new Date().toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric" });
    let text = `PENDING TASKS\n${date}\n${"═".repeat(40)}\n\n`;
    if (urgent.length > 0) {
      text += `URGENT (${urgent.length}):\n`;
      urgent.forEach((t, i) => { text += `${i + 1}. ${t.patientName} (Rm ${t.room}): ${t.text}\n`; });
      text += "\n";
    }
    if (routine.length > 0) {
      text += `ROUTINE:\n`;
      Object.entries(byPatient).forEach(([name, { room, tasks }]) => {
        text += `\n${name} — Room ${room}:\n`;
        tasks.forEach(t => { text += `  • ${t.text}\n`; });
      });
    }
    return text.trim();
  };

  const emailTasks = () => {
    const date = new Date().toLocaleDateString("en-US", { month: "short", day: "numeric" });
    const subject = `Pending Tasks — ${date} — ${allPending.length} task${allPending.length !== 1 ? "s" : ""}`;
    window.location.href = `mailto:?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(buildText())}`;
  };

  const copyTasks = () => {
    navigator.clipboard.writeText(buildText()).then(() => {
      setCopied(true); setTimeout(() => setCopied(false), 2500);
    }).catch(() => {
      const ta = document.createElement("textarea");
      ta.value = buildText(); document.body.appendChild(ta);
      ta.select(); document.execCommand("copy"); document.body.removeChild(ta);
      setCopied(true); setTimeout(() => setCopied(false), 2500);
    });
  };

  const CATEGORY_COLOR = {
    labs:      "bg-blue-100 text-blue-700",
    imaging:   "bg-purple-100 text-purple-700",
    consult:   "bg-teal-100 text-teal-700",
    medication:"bg-amber-100 text-amber-700",
    nursing:   "bg-pink-100 text-pink-700",
    discharge: "bg-green-100 text-green-700",
    call:      "bg-orange-100 text-orange-700",
    plan:      "bg-slate-100 text-slate-600",
  };

  return (
    <div className="flex flex-col min-h-screen bg-slate-50">
      {/* Header */}
      <div className="bg-white border-b border-slate-200 px-5 pt-12 pb-4">
        <div className="flex items-center gap-3 mb-3">
          <button onClick={onBack} className="text-slate-700 p-1 -ml-1"><ArrowLeft size={22} /></button>
          <div className="flex-1">
            <h1 className="text-slate-900 text-xl font-bold">Pending Tasks</h1>
            <p className="text-slate-400 text-xs mt-0.5">
              {allPending.length} task{allPending.length !== 1 ? "s" : ""} across {patients.filter(p => (p.tasks||[]).some(t => !t.done)).length} patient{patients.filter(p => (p.tasks||[]).some(t => !t.done)).length !== 1 ? "s" : ""} · {new Date().toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" })}
            </p>
          </div>
        </div>
        {/* Action buttons */}
        <div className="flex gap-2">
          <button onClick={emailTasks}
            style={{ flex: 1, background: "#0f172a", color: "white", border: "none", cursor: "pointer",
              borderRadius: 14, padding: "11px", fontSize: 13, fontWeight: 700, display: "flex",
              alignItems: "center", justifyContent: "center", gap: 6 }}>
            ✉ Email Tasks
          </button>
          <button onClick={copyTasks}
            style={{ flex: 1, background: copied ? "#0d9488" : "white", color: copied ? "white" : "#0f172a",
              border: "2px solid #e2e8f0", cursor: "pointer", borderRadius: 14, padding: "11px",
              fontSize: 13, fontWeight: 700, display: "flex", alignItems: "center", justifyContent: "center", gap: 6 }}>
            {copied ? "✓ Copied!" : "⎘ Copy Text"}
          </button>
        </div>
      </div>

      {allPending.length === 0 ? (
        <div className="flex-1 flex items-center justify-center">
          <div className="text-center py-12">
            <CheckSquare size={40} className="text-teal-300 mx-auto mb-3" />
            <p className="text-slate-500 font-semibold text-lg">All tasks complete!</p>
            <p className="text-slate-400 text-sm mt-1">No pending tasks across any patient.</p>
          </div>
        </div>
      ) : (
        <div className="flex-1 overflow-y-auto px-4 py-4 space-y-4 pb-12">

          {/* Urgent tasks */}
          {urgent.length > 0 && (
            <div>
              <div className="flex items-center gap-2 mb-2">
                <span className="text-xs font-bold text-red-600 uppercase tracking-wide">⚡ Urgent</span>
                <span className="text-xs bg-red-100 text-red-700 font-bold px-2 py-0.5 rounded-full">{urgent.length}</span>
              </div>
              <div className="space-y-2">
                {urgent.map((task, i) => (
                  <div key={i} className="bg-white rounded-2xl border border-red-200 shadow-sm px-4 py-3 flex items-start gap-3">
                    <span className="w-2 h-2 rounded-full bg-red-500 flex-shrink-0 mt-1.5" />
                    <div className="flex-1 min-w-0">
                      <div className="flex items-center gap-2 mb-0.5 flex-wrap">
                        <span className="text-xs font-bold text-slate-500">
                          {task.patientName} · Rm {task.room}{task.dayNum ? ` · Day ${task.dayNum}` : ""}
                        </span>
                        {task.category && (
                          <span className={`text-xs font-semibold px-1.5 py-0.5 rounded-full ${CATEGORY_COLOR[task.category] || CATEGORY_COLOR.plan}`}>
                            {task.category}
                          </span>

                      </div>
                      <p className="text-sm font-semibold text-slate-800 leading-snug">{task.text}</p>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          )}

          {/* Routine tasks grouped by patient */}
          {Object.entries(byPatient).map(([name, { room, dayNum, tasks }]) => (
            <div key={name}>
              <div className="flex items-center gap-2 mb-2">
                <div className="w-6 h-6 rounded-xl bg-slate-100 flex items-center justify-center flex-shrink-0">
                  <User size={12} className="text-slate-600" />
                </div>
                <span className="text-sm font-bold text-slate-800">{name}</span>
                <span className="text-xs text-slate-400">Rm {room}{dayNum ? ` · Day ${dayNum}` : ""}</span>
                <span className="text-xs bg-slate-100 text-slate-600 font-bold px-2 py-0.5 rounded-full ml-auto">{tasks.length}</span>
              </div>
              <div className="space-y-1.5 ml-8">
                {tasks.map((task, i) => (
                  <div key={i} className="bg-white rounded-xl border border-slate-100 shadow-sm px-3 py-2.5 flex items-start gap-2.5">
                    <span className="w-1.5 h-1.5 rounded-full bg-slate-300 flex-shrink-0 mt-1.5" />
                    <div className="flex-1 min-w-0">

                      )}
                    </div>

                ))}

          ))}
        </div>
      )}
    </div>

};

const PatientListScreen = ({ patients, onSelectPatient, onDashboard, onAddPatient, onSettings, onDeletePatient, onScanPatients, onHandoff, onTaskExport }) => {
  const done = patients.filter(p => p.status === "post-rounded").length;

  const [sortBy, setSortBy] = useState("default");

  const [showScanModal, setShowScanModal]     = useState(false);
