        ? `SPECIALTY FOCUS: Extract ONLY ${focus.trim()}-related issues, medications, labs, and vaccinations. Ignore other specialties.`
        : "Extract all relevant issues across all specialties.";
      const prompt = `You are reviewing a previous clinic visit note for a patient. ${focusInstr}

PREVIOUS CLINIC NOTE:
${noteText}

Extract and structure the following from this note:

0. patient_background: A 4-5 sentence background summary. Include: (a) age/sex and all major chronic conditions, (b) key current medications and doses, (c) main issues being closely followed with latest known status e.g. "Diabetes closely monitored — A1c 7.4 at last visit, target <7", (d) relevant allergies or critical history, (e) any preventive care notes. Be specific about what is actively being managed. Return empty string if insufficient info in the note.

1. active_issues: Array of active medical problems being managed. Each item should be a one-liner with current status: e.g. "Type 2 Diabetes — A1c 7.4, on metformin 1000mg BID, target <7" or "HTN — BP 138/88, on lisinopril 10mg, well controlled".
   Include ONLY problems actively being managed, not resolved issues.

2. recent_testing: Array of individual test results, one per item. Each item should be a single result with date: "HbA1c 7.4 (Mar 2026)" or "LDL 98 (Jan 2026)" or "Colonoscopy normal (2023)". One test per array item — do NOT bundle multiple results into one string.

3. vaccinations: Array of vaccines mentioned or implied. Each: { "name": "Flu Vaccine", "date": "Sep 2025", "status": "current" }.
   Status must be one of: "current", "due", "overdue", "unknown".
   Include: Flu, Pneumococcal, Shingrix, COVID, Tdap, HPV, Hepatitis B if mentioned.

4. visit_summary: ONE sentence summarizing this visit for the visit history log.
   Example: "A1c 7.8 → increased metformin. BP controlled. Lipids improved on statin."

Return ONLY valid JSON:
{
  "patient_background": "2-sentence background summary or empty string",
  "active_issues": ["issue with status", "issue with status"],
  "recent_testing": ["HbA1c 7.4 (Mar 2026)", "LDL 98 (Jan 2026)", "TSH 2.1 (Mar 2026)"],
  "vaccinations": [{"name": "...", "date": "...", "status": "current"}],
  "visit_summary": "one sentence"
}`;

      const resp = await callOpenAI(
        [{ role: "system", content: "You are a clinical assistant extracting structured data from clinic notes. Return only valid JSON." },
         { role: "user", content: prompt }],
        { jsonMode: true }
      );
      const parsed = JSON.parse(resp);

      const updates = {
        previousClinicNote: noteText,
        previousClinicNoteDate: new Date().toISOString(),
        extractionFocus: focus,
      };

      // Populate background if not already set or if extracted is richer
      if (parsed.patient_background && parsed.patient_background.trim()) {
        if (!patient.background || patient.background.trim().length < 20) {
          updates.background = parsed.patient_background.trim();
          setBgEdit(parsed.patient_background.trim());
        }
      }
      // Merge active issues (don't overwrite manual ones, just add extracted ones)
      if (parsed.active_issues?.length) {
        const existing = patient.activeIssues || [];
        const existingTexts = new Set(existing.map(i => i.text.toLowerCase().substring(0,20)));
        const newIssues = parsed.active_issues
          .filter(t => t && t.trim() && !existingTexts.has(t.toLowerCase().substring(0,20)))
          .map((t, i) => ({ id: Date.now()+i+100, text: t.trim() }));
        if (newIssues.length) updates.activeIssues = [...existing, ...newIssues];
      }
      // Update recent testing — now stored as newline-separated string from array
      if (parsed.recent_testing?.length) {
        const testingStr = Array.isArray(parsed.recent_testing)
          ? parsed.recent_testing.filter(t => t && t.trim()).join("\n")
          : parsed.recent_testing.trim();
        updates.recentTesting = testingStr;
        setTestingEdit(testingStr);
      }
      // Merge vaccinations
      if (parsed.vaccinations?.length) {
        const existingVacc = patient.vaccinations || [];
        const existingNames = new Set(existingVacc.map(v => v.name.toLowerCase()));
        const newVaccs = parsed.vaccinations
          .filter(v => v.name && !existingNames.has(v.name.toLowerCase()))
          .map((v, i) => ({ id: Date.now()+i+200, name: v.name, date: v.date||"", status: v.status||"unknown" }));
        updates.vaccinations = [...existingVacc, ...newVaccs];
        if (newVaccs.length) setShowVacc(true);
      }
      // Add visit summary to history
      if (parsed.visit_summary && parsed.visit_summary.trim()) {
        const entry = { id: Date.now()+500, date: new Date().toLocaleDateString("en-US",{month:"short",year:"numeric"}), summary: parsed.visit_summary.trim() };
        updates.visitHistory = [entry, ...(patient.visitHistory||[])].slice(0,3);
      }
      updates.extractedAt = new Date().toISOString();
      updatePatient(updates);
      const parts = [];
      if (parsed.active_issues?.length) parts.push(`${parsed.active_issues.length} issues`);
      if (parsed.vaccinations?.length) parts.push(`${parsed.vaccinations.length} vaccines`);
      if (parsed.recent_testing) parts.push("labs");
      setExtractMsg(`✓ Extracted: ${parts.join(", ")}`);
    } catch(e) {
      console.error("Extraction failed:", e);
      setExtractMsg("Extraction failed — note saved, extract manually");
      updatePatient({ previousClinicNote: noteText, extractionFocus: focus });
    }
    setTimeout(() => setExtractMsg(""), 4000);
    setExtracting(false);
    setNoteSaved(true); setTimeout(() => setNoteSaved(false), 2000);
  };

  const addIssue = (text) => {
    if (!text || !text.trim()) { setNewIssue(null); return; }
    updatePatient({ activeIssues: [...(patient.activeIssues || []), { id: Date.now(), text: text.trim() }] });
    setNewIssue(null);
    if (issueDictating) { issueKeepRef.current = false; if (issueRecRef.current) issueRecRef.current.stop(); setIssueDictating(false); setIssueInterim(""); }
  };
  const deleteIssue = (id) => updatePatient({ activeIssues: (patient.activeIssues || []).filter(i => i.id !== id) });

  const toggleIssueDictation = () => {
    if (issueDictating) {
      issueKeepRef.current = false;
      if (issueRecRef.current) issueRecRef.current.stop();
      setIssueDictating(false); setIssueInterim(""); return;
    }
    issueKeepRef.current = true; setIssueDictating(true);
    if (newIssue === null) setNewIssue("");
    ensureMicStream().then(() => {
      issueRecRef.current = createDictationSession({
        keepRef: issueKeepRef,
        onFinal: (text) => setNewIssue(prev => ((prev||"") + (prev ? " " : "") + text).trimStart()),
        onInterim: setIssueInterim,
        onEnd: () => { setIssueDictating(false); setIssueInterim(""); },
      });
    });
  };

  const addVaccine = () => {
    if (!newVaccName.trim()) return;
    const v = { id: Date.now(), name: newVaccName.trim(), date: newVaccDate.trim(), status: newVaccStat };
    updatePatient({ vaccinations: [...(patient.vaccinations||[]), v] });
    setNewVaccName(""); setNewVaccDate(""); setNewVaccStat("current"); setShowAddVacc(false);
  };
  const deleteVaccine = (id) => updatePatient({ vaccinations: (patient.vaccinations||[]).filter(v => v.id !== id) });
  const vaccStatusColor = (s) => ({ current: "text-green-700 bg-green-50", due: "text-amber-700 bg-amber-50", overdue: "text-red-700 bg-red-50" }[s] || "text-slate-600 bg-slate-50");
  const vaccStatusLabel = (s) => ({ current: "✓ Current", due: "Due", overdue: "Overdue" }[s] || "Unknown");

  const addVisit = () => {
    if (!newVisitSummary.trim()) return;
    const entry = { id: Date.now(), date: newVisitDate.trim() || new Date().toLocaleDateString("en-US",{month:"short",year:"numeric"}), summary: newVisitSummary.trim() };
    const updated = [entry, ...(patient.visitHistory || [])].slice(0, 3);
    updatePatient({ visitHistory: updated });
    setNewVisitDate(""); setNewVisitSummary(""); setShowAddVisit(false);
  };
  const deleteVisit = (id) => updatePatient({ visitHistory: (patient.visitHistory || []).filter(v => v.id !== id) });

  // ── Expand overlay ──────────────────────────────────────────────────────────
  const ExpandOverlay = ({ title, onClose, children }) => (
    <div style={{position:"fixed",inset:0,zIndex:9999,background:"#f8fafc",display:"flex",flexDirection:"column"}}>
      <div style={{background:"white",borderBottom:"1px solid #e2e8f0",padding:"48px 16px 14px",display:"flex",alignItems:"center",gap:12}}>
        <button onClick={onClose} style={{background:"none",border:"none",cursor:"pointer",color:"#475569",padding:4}}><ArrowLeft size={22} /></button>
        <span style={{fontSize:16,fontWeight:700,color:"#0f172a"}}>{title}</span>
      </div>
      <div style={{flex:1,overflowY:"auto",padding:"16px 16px 40px"}}>{children}</div>
    </div>
  );

  return (
    <div className="px-4 py-5 space-y-5 pb-24">

      {/* ── Section expand overlays ─────────────────────────────────────────── */}
      {expandedSection === "background" && (
        <ExpandOverlay title="Patient Background" onClose={() => setExpandedSection(null)}>
          {patient.background
            ? <p style={{fontSize:14,color:"#1e293b",lineHeight:1.8,whiteSpace:"pre-wrap"}}>{patient.background}</p>
            : <p style={{color:"#94a3b8",fontStyle:"italic",fontSize:13}}>No background recorded yet.</p>}
        </ExpandOverlay>
      )}
      {expandedSection === "note" && (
        <ExpandOverlay title="Previous Note / New Results" onClose={() => setExpandedSection(null)}>
          {patient.previousClinicNote
            ? <pre style={{fontFamily:"system-ui",fontSize:13,color:"#1e293b",whiteSpace:"pre-wrap",lineHeight:1.7}}>{patient.previousClinicNote}</pre>
            : <p style={{color:"#94a3b8",fontStyle:"italic",fontSize:13}}>No previous note pasted yet.</p>}
        </ExpandOverlay>
      )}
      {expandedSection === "testing" && (
        <ExpandOverlay title="Recent Testing" onClose={() => setExpandedSection(null)}>
          {(patient.recentTesting||"").trim()
            ? <div style={{display:"flex",flexDirection:"column",gap:10}}>
                {patient.recentTesting.split("\n").filter(l=>l.trim()).map((line,i) => (
                  <div key={i} style={{background:"white",border:"1px solid #e2e8f0",borderRadius:12,padding:"10px 14px",display:"flex",gap:10,alignItems:"flex-start"}}>
                    <span style={{color:"#0d9488",fontWeight:700,fontSize:13,flexShrink:0}}>•</span>
                    <span style={{fontSize:13,color:"#1e293b",lineHeight:1.5}}>{line.trim()}</span>
                  </div>
                ))}
              </div>
            : <p style={{color:"#94a3b8",fontStyle:"italic",fontSize:13}}>No testing results recorded yet.</p>}
        </ExpandOverlay>
      )}
      {expandedSection === "issues" && (
        <ExpandOverlay title="Active Issues / Following" onClose={() => setExpandedSection(null)}>
          {(patient.activeIssues||[]).length === 0
            ? <p style={{color:"#94a3b8",fontStyle:"italic",fontSize:13}}>No active issues tracked yet.</p>
            : <div style={{display:"flex",flexDirection:"column",gap:10}}>
                {(patient.activeIssues||[]).map((issue,i) => (
                  <div key={issue.id||i} style={{background:"white",border:"1px solid #e2e8f0",borderLeft:"4px solid #0d9488",borderRadius:12,padding:"12px 14px"}}>
                    <p style={{fontSize:13,color:"#1e293b",lineHeight:1.6}}>{issue.text}</p>
                  </div>
                ))}
              </div>}
        </ExpandOverlay>
      )}
      {expandedSection === "vaccinations" && (
        <ExpandOverlay title="Vaccination Status" onClose={() => setExpandedSection(null)}>
          {(patient.vaccinations||[]).length === 0
            ? <p style={{color:"#94a3b8",fontStyle:"italic",fontSize:13}}>No vaccination data recorded yet.</p>
            : <div style={{display:"flex",flexDirection:"column",gap:8}}>
                {(patient.vaccinations||[]).map((v,i) => (
                  <div key={v.id||i} style={{background:"white",border:"1px solid #e2e8f0",borderRadius:12,padding:"12px 14px",display:"flex",alignItems:"center",gap:12}}>
                    <span style={{fontSize:11,fontWeight:700,padding:"3px 8px",borderRadius:20,flexShrink:0,
                      background: v.status==="current"?"#d1fae5":v.status==="due"?"#fef3c7":"#fee2e2",
                      color: v.status==="current"?"#065f46":v.status==="due"?"#92400e":"#991b1b"}}>
                      {vaccStatusLabel(v.status)}
                    </span>
                    <span style={{flex:1,fontSize:14,color:"#0f172a",fontWeight:600}}>{v.name}</span>
                    {v.date && <span style={{fontSize:12,color:"#94a3b8"}}>{v.date}</span>}
                  </div>
                ))}
              </div>}
        </ExpandOverlay>
      )}
      {expandedSection === "history" && (
        <ExpandOverlay title="Visit History" onClose={() => setExpandedSection(null)}>
          {(patient.visitHistory||[]).length === 0
            ? <p style={{color:"#94a3b8",fontStyle:"italic",fontSize:13}}>No visit history recorded yet.</p>
            : <div style={{display:"flex",flexDirection:"column",gap:12}}>
                {(patient.visitHistory||[]).map((v,i) => (
                  <div key={v.id||i} style={{background:"white",border:"1px solid #e2e8f0",borderRadius:12,padding:"14px"}}>
                    <span style={{fontSize:11,fontWeight:700,color:"#0d9488",display:"block",marginBottom:4}}>{v.date}</span>
                    <p style={{fontSize:13,color:"#1e293b",lineHeight:1.6}}>{v.summary}</p>
                  </div>
                ))}
              </div>}
        </ExpandOverlay>
      )}

      {/* Patient Background */}
      <section>
        <div className="flex items-center justify-between mb-1">
          <SectionHeader label="Patient Background" />
          <div className="flex items-center gap-2">
            {bgSaved && <span className="text-xs font-bold text-green-600 bg-green-50 px-2 py-0.5 rounded-full">✓ Saved</span>}
            {patient.background && <button onClick={() => setExpandedSection("background")}
              className="text-xs font-semibold text-teal-600 underline">View full →</button>}
          </div>
        </div>
        {/* Collapsed preview — shows first 3 lines, edit below */}
        {patient.background && !bgSaved ? (
          <div className="bg-white rounded-2xl border border-slate-100 shadow-sm p-3 mb-2">
            <p className="text-xs text-slate-700 leading-relaxed" style={{
              display:"-webkit-box",WebkitLineClamp:3,WebkitBoxOrient:"vertical",overflow:"hidden"
            }}>{patient.background}</p>
            <button onClick={() => setExpandedSection("background")}
              className="text-xs text-teal-600 font-semibold mt-1">View full background</button>
          </div>
        ) : null}
        <div className="bg-white rounded-2xl border border-slate-100 shadow-sm p-4 space-y-3">
          <p className="text-xs text-slate-400 mb-1">Edit background — auto-populated from previous note, or type/update manually.</p>
          <textarea
            value={bgEdit}
            onChange={e => setBgEdit(e.target.value)}
            rows={3}
            placeholder="e.g. 67F with HTN, T2DM, CKD Stage 3. On metformin, lisinopril. Diabetes closely followed — A1c 7.4 at last visit, target <7. Allergic to sulfa."
            className="w-full text-sm text-slate-700 placeholder-slate-400 resize-none outline-none leading-relaxed"
          />
          <button onClick={() => saveField("background", bgEdit, setBgSaved)} disabled={!bgEdit.trim()}
            className="w-full bg-black text-white text-sm font-bold py-2.5 rounded-xl flex items-center justify-center gap-1.5 disabled:opacity-40 hover:bg-slate-800 transition-colors">
            <Save size={13} /> Save Background
          </button>
        </div>
      </section>

      {/* Specialty Focus */}
      <section>
        <SectionHeader label="Extraction Focus (Optional)" />
        <p className="text-xs text-slate-500 mb-2">Specialists: set your specialty so the AI extracts only relevant issues. Leave blank for all issues (PCP).</p>
        <div className="flex gap-2">
          <input value={focusEdit} onChange={e => setFocusEdit(e.target.value)}
            placeholder="e.g. Cardiology, Urology, Endocrinology — or leave blank"
            className="flex-1 border border-slate-200 rounded-xl px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-teal-400 bg-white" />
          <button onClick={() => { updatePatient({ extractionFocus: focusEdit }); }}
            className="bg-black text-white text-xs font-bold px-3 py-2 rounded-xl hover:bg-slate-800 transition-colors flex-shrink-0">
            <Save size={12} />
          </button>
        </div>
        {patient.extractionFocus && <p className="text-xs text-teal-600 font-semibold mt-1.5">✓ Focus set: {patient.extractionFocus}</p>}
      </section>

      {/* Today's Reason */}
      <section>
        <div className="flex items-center justify-between mb-1">
          <SectionHeader label="Today's Visit Reason" />
          {reasonSaved && <span className="text-xs font-bold text-green-600 bg-green-50 px-2 py-0.5 rounded-full">✓ Saved</span>}
        </div>
        <p className="text-xs text-slate-500 mb-2">MA fills this in when rooming the patient.</p>
        <div className="bg-white rounded-2xl border border-teal-100 shadow-sm p-4 space-y-3">
          <input
            value={reasonEdit}
            onChange={e => setReasonEdit(e.target.value)}
            placeholder="e.g. Here for diabetes follow-up and medication refill"
            className="w-full text-sm text-slate-700 placeholder-slate-400 outline-none border-b border-slate-100 pb-2"
          />
          <button onClick={() => saveField("todaysReason", reasonEdit, setReasonSaved)} disabled={!reasonEdit.trim()}
            className="w-full bg-teal-600 text-white text-sm font-bold py-2.5 rounded-xl flex items-center justify-center gap-1.5 disabled:opacity-40 hover:bg-teal-700 transition-colors">
            <Save size={13} /> Save Reason
          </button>
        </div>
      </section>

      {/* Visit History */}
      <section>
        <div className="flex items-center justify-between mb-1">
          <SectionHeader label="Visit History" badge={`${(patient.visitHistory||[]).length}/3`} />
          <div className="flex items-center gap-2">
            {(patient.visitHistory||[]).length > 0 &&
              <button onClick={() => setExpandedSection("history")} className="text-xs font-semibold text-teal-600 underline">View all →</button>}
            {!showAddVisit && (
              <button onClick={() => setShowAddVisit(true)}
                className="flex items-center gap-1 text-xs font-bold text-slate-800 bg-slate-100 hover:bg-slate-200 px-2.5 py-1.5 rounded-xl transition-colors">
                <Plus size={11} /> Add
              </button>
            )}
          </div>
        </div>
        <p className="text-xs text-slate-500 mb-2">Last 3 visits — one line each. Auto-saves newest visit after each encounter.</p>

        {showAddVisit && (
          <div className="bg-white rounded-2xl border-2 border-slate-800 shadow-sm p-3 mb-3 space-y-2">
            <input value={newVisitDate} onChange={e => setNewVisitDate(e.target.value)}
              placeholder="Date (e.g. Mar 2026)" className="w-full border border-slate-200 rounded-xl px-3 py-2 text-sm outline-none" />
            <input value={newVisitSummary} onChange={e => setNewVisitSummary(e.target.value)}
              placeholder="One-line summary: A1c 7.8, increased metformin. BP controlled."
              className="w-full border border-slate-200 rounded-xl px-3 py-2 text-sm outline-none" />
            <div className="flex gap-2">
              <button onClick={addVisit} disabled={!newVisitSummary.trim()}
                className="flex-1 bg-slate-800 text-white text-xs font-bold py-2 rounded-xl disabled:opacity-40 flex items-center justify-center gap-1">
                <Save size={11} /> Save Visit
              </button>
              <button onClick={() => { setShowAddVisit(false); setNewVisitDate(""); setNewVisitSummary(""); }}
                className="text-slate-500 hover:text-slate-800 p-2 rounded-xl"><X size={14} /></button>
            </div>
          </div>
        )}

        {(patient.visitHistory || []).length === 0 && !showAddVisit ? (
          <div className="text-center py-4 border border-dashed border-slate-200 rounded-2xl">
            <p className="text-xs font-semibold text-slate-400">No visit history yet.</p>
            <p className="text-xs text-slate-300 mt-0.5">Add manually or it auto-saves after each encounter.</p>
          </div>
        ) : (
          <div className="space-y-2">
            {(patient.visitHistory || []).map((v, i) => (
              <div key={v.id || i} className={`flex items-start gap-3 p-3 rounded-xl border ${i === 0 ? "bg-teal-50 border-teal-200" : "bg-white border-slate-200"}`}>
                <span className={`text-xs font-bold px-2 py-0.5 rounded-full flex-shrink-0 mt-0.5 ${i === 0 ? "bg-teal-100 text-teal-800" : "bg-slate-100 text-slate-600"}`}>{v.date}</span>
                <p className="flex-1 text-sm text-slate-700 leading-relaxed">{v.summary}</p>
                <button onClick={() => deleteVisit(v.id || i)} className="text-slate-400 hover:text-red-500 flex-shrink-0"><Trash2 size={13} /></button>
              </div>
            ))}
          </div>
        )}
      </section>

      {/* Previous Note / New Results */}
      <section>
        <div className="flex items-center justify-between mb-1">
          <SectionHeader label="Previous Note / New Results" />
          <div className="flex items-center gap-2">
            {patient.previousClinicNote &&
              <button onClick={() => setExpandedSection("note")} className="text-xs font-semibold text-teal-600 underline">View full →</button>}
          </div>
        </div>
        {/* Last extracted timestamp */}
        {patient.previousClinicNoteDate && (
          <div className="flex items-center gap-1.5 mb-1.5">
            <CheckCircle size={11} className="text-teal-500 flex-shrink-0" />
            <p className="text-xs text-teal-700 font-medium">
              Last extracted: {(() => {
                const d = new Date(patient.previousClinicNoteDate);
                return d.toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"}) +
                       " · " + d.toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"});
              })()}
            </p>
          </div>
        )}
        <p className="text-xs text-slate-500 mb-2">
          Paste the previous note and add any new results below it — new labs, imaging, or specialist letters received since the last visit. Tap <strong>Save & Extract</strong> when done. AI populates background, active issues, recent testing, and vaccines. Tap the same button anytime you add more data.
        </p>
        <div className={`bg-white rounded-2xl border shadow-sm p-4 space-y-3 transition-colors ${extracting ? "border-teal-300" : "border-slate-100"}`}>
          {extracting && (
            <div className="flex items-center gap-2">
              <Loader2 size={12} className="animate-spin text-teal-500 flex-shrink-0" />
              <span className="text-xs font-semibold text-teal-600">Extracting issues, labs, vaccines, background…</span>
            </div>
          )}
          <textarea
            value={noteEdit}
            onChange={e => setNoteEdit(e.target.value)}
            rows={5}
            placeholder="Paste previous clinic note here, then add any new lab results, imaging reports, or specialist letters below it…"
            className="w-full text-sm text-slate-700 placeholder-slate-400 resize-none outline-none leading-relaxed"
          />
          {/* Single Save & Extract button — primary action for the MA */}
          <button
            onClick={() => {
              if (getApiKey()) {
                handleExtractFromNote(noteEdit, focusEdit);
              } else {
                saveField("previousClinicNote", noteEdit, setNoteSaved);
                setNoteEdit(noteEdit);
              }
            }}
            disabled={!noteEdit.trim() || extracting}
            className="w-full font-bold py-3 rounded-2xl flex items-center justify-center gap-2 transition-colors shadow-sm disabled:opacity-40"
            style={{background: extracting ? "#0d9488" : "#0f172a", color:"white", fontSize:14}}>
            {extracting
              ? <><Loader2 size={15} className="animate-spin" /> Extracting…</>
              : noteSaved
                ? <><CheckCircle size={15} /> Extracted & Saved!</>
                : <><Sparkles size={15} /> Save & Extract All</>}
          </button>
          {extractMsg && (
            <div className="bg-emerald-50 border border-emerald-200 rounded-xl px-3 py-2 text-xs font-semibold text-emerald-700">{extractMsg}</div>
          )}
        </div>
      </section>

      {/* Recent Testing */}
      <section>
        <div className="flex items-center justify-between mb-1">
          <SectionHeader label="Recent Testing" />
          <div className="flex items-center gap-2">
            {testingSaved && <span className="text-xs font-bold text-green-600 bg-green-50 px-2 py-0.5 rounded-full">✓ Saved</span>}
            <button onClick={() => setEditingTesting(!editingTesting)}
              className="text-xs font-semibold text-slate-500 underline">{editingTesting ? "View" : "Edit"}</button>
            {(patient.recentTesting||"").trim() &&
              <button onClick={() => setExpandedSection("testing")}
                className="text-xs font-semibold text-teal-600 underline">View all →</button>}

// ─── Clinic: Background extraction from generated note (runs silently after encounter) ──
const extractClinicUpdateFromNote = async (noteText, focus, patient, updatePatient) => {
  if (!noteText || !getApiKey()) return;
  try {
    const focusInstr = focus && focus.trim() ? `Focus ONLY on ${focus.trim()}-related content.` : "Extract all relevant content.";
    const prompt = `You are reviewing a just-generated clinic visit note to refresh the patient pre-visit summary for their next visit. ${focusInstr}

CLINIC NOTE:
${noteText}

Extract:
1. patient_background: 4-5 sentences covering: (a) age/sex + chronic conditions, (b) key current medications, (c) main issues being closely followed with latest status e.g. "Diabetes closely followed — A1c improved to 7.1 from 7.8", (d) any allergies or critical history. Be specific about what is being managed.
2. active_issues_update: Updated array of active problems with current status as of this visit.
3. recent_testing_update: Array of notable results from this note, one item per test.
4. vaccinations_update: Any vaccine mentions. Array of {name, date, status}.
5. visit_summary: One sentence summarizing this visit for history log.

Return ONLY valid JSON:
{"patient_background":"","active_issues_update":[],"recent_testing_update":[],"vaccinations_update":[],"visit_summary":""}`;

    const resp = await callOpenAI(
      [{role:"system",content:"You are a clinical assistant extracting structured pre-visit data. Return only valid JSON."},
       {role:"user",content:prompt}],
      {jsonMode:true}
    );
    const p = JSON.parse(resp);
    const upd = { previousClinicNote: noteText, noteExtractedAt: new Date().toISOString() };
    if (p.patient_background?.trim()) upd.background = p.patient_background.trim();
    if (p.active_issues_update?.length) {
      upd.activeIssues = p.active_issues_update.filter(t=>t?.trim()).map((t,i)=>({id:Date.now()+i+300,text:t.trim()}));
    }
    if (p.recent_testing_update?.length) upd.recentTesting = p.recent_testing_update.filter(t=>t?.trim()).join("\n");
    if (p.vaccinations_update?.length) {
      const ex = patient.vaccinations||[];
      const exN = new Set(ex.map(v=>v.name.toLowerCase()));
      const nw  = p.vaccinations_update.filter(v=>v.name&&!exN.has(v.name.toLowerCase()))
                   .map((v,i)=>({id:Date.now()+i+400,name:v.name,date:v.date||"",status:v.status||"current"}));
      if (nw.length) upd.vaccinations = [...ex,...nw];
    }
    if (p.visit_summary?.trim()) {
      const entry = {id:Date.now()+600,date:new Date().toLocaleDateString("en-US",{month:"short",year:"numeric"}),summary:p.visit_summary.trim()};
      upd.visitHistory = [entry,...(patient.visitHistory||[])].slice(0,3);
    }
    updatePatient(upd);
  } catch(e) {
    // Minimum: save today's note as previousClinicNote for next visit
    updatePatient({previousClinicNote:noteText,noteExtractedAt:new Date().toISOString()});
    console.error("Post-note extraction failed:",e);
  }
};

// ─── Panel Matching Helper ────────────────────────────────────────────────────
const findMatchInPanel = (scannedName, scannedMrn, scannedDob, panelPatients) => {
  const norm = (n) => (n || "").toLowerCase().trim().replace(/[^a-z0-9\s]/g, "").replace(/\s+/g, " ");
  const sNorm  = norm(scannedName);
  const sWords = sNorm.split(" ").filter(w => w.length > 1);
  if (!sNorm || sWords.length === 0) return { status: "new", matchedPatient: null, confidence: "" };

  // Priority 1: MRN match — definitive
  if (scannedMrn && scannedMrn.trim().length > 3) {
    const m = panelPatients.find(p => p.mrn && norm(p.mrn) === norm(scannedMrn));
    if (m) return { status: "existing", matchedPatient: m, confidence: "MRN match" };
  }

  // Priority 2: Name + DOB — near-certain
  if (scannedDob && scannedDob.replace(/[^0-9]/g, "").length >= 6) {
    const dobDigits = scannedDob.replace(/[^0-9]/g, "");
    const m = panelPatients.find(p => {
      const nameOk = norm(p.name) === sNorm;
      const dobOk  = p.dob && p.dob.replace(/[^0-9]/g, "") === dobDigits;
      return nameOk && dobOk;
    });
    if (m) return { status: "existing", matchedPatient: m, confidence: "Name + DOB" };
  }

  // Priority 3: Exact name match (case-insensitive)
  const exact = panelPatients.find(p => norm(p.name) === sNorm);
  if (exact) return { status: "existing", matchedPatient: exact, confidence: "Exact name" };

  // Priority 4: Word-level similarity — handles nicknames and minor variations
  let bestScore = 0, bestMatch = null;
  panelPatients.forEach(p => {
    const pWords = norm(p.name).split(" ").filter(w => w.length > 1);
    const hits   = sWords.filter(w => pWords.includes(w)).length;
    const score  = hits / Math.max(sWords.length, pWords.length);
    if (score > bestScore) { bestScore = score; bestMatch = p; }
  });
  if (bestScore >= 0.75) return { status: "existing", matchedPatient: bestMatch, confidence: "Name match" };
  if (bestScore >= 0.5)  return { status: "possible", matchedPatient: bestMatch, confidence: "Similar name — please confirm" };

  return { status: "new", matchedPatient: null, confidence: "" };
};

const ClinicPatientListScreen = ({ patients, onSelectPatient, onAddPatient, onSettings, onDeletePatient, onToggleToday, onScanConfirmed }) => {
  const [search, setSearch] = useState("");

  // ── Clinic scan state ──────────────────────────────────────────────────────
  const [showScanModal, setShowScanModal]     = useState(false);
  const [scanLoading, setScanLoading]         = useState(false);
  const [scanError, setScanError]             = useState("");
  const [scanPreview, setScanPreview]         = useState(null);
  const [scannedPatients, setScannedPatients] = useState([]);   // enriched with matchStatus
  const [selectedScanned, setSelectedScanned] = useState([]);
  const [userDecisions, setUserDecisions]     = useState({});   // { index: "link" | "create" | null }
  const clinicFileInputRef = useRef(null);

  const resetScan = () => {
    setShowScanModal(false); setScanPreview(null); setScannedPatients([]);
    setSelectedScanned([]); setUserDecisions({}); setScanError("");
  };

  const handleClinicScanImage = async (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    setScanError(""); setScanLoading(true); setScannedPatients([]); setSelectedScanned([]); setUserDecisions({});
    const reader = new FileReader();
    reader.onload = async (ev) => {
      const dataUrl = ev.target.result;
      setScanPreview(dataUrl);
      const base64 = dataUrl.split(",")[1];
      try {
        const resp = await callOpenAIVision(base64,
          `You are reading a clinic schedule or patient appointment list. Extract every patient.
STRICT RULES:
- "name": ONLY first and last name. Never include times, room numbers, diagnoses, provider names.
- "dob": date of birth exactly as shown, else empty string.
- "mrn": MRN or patient ID if visible, else empty string.
- "reason": reason for visit if visible, else empty string.
- SKIP header rows, footer rows, column labels, and any non-patient row.
Return ONLY valid JSON: { "patients": [ { "name": "First Last", "dob": "", "mrn": "", "reason": "" } ] }`
        );
        const parsed = JSON.parse(resp);
        const headerWords = ["patient","name","mrn","dob","reason","time","provider","appointment",
                             "date","physician","doctor","schedule","visit","id","type"];
        const cleaned = (parsed.patients || [])
          .map(p => ({ ...p, name: (p.name || "").trim().replace(/^\d{2,4}\s+/, "").trim() }))
          .filter(p => {
            if (!p.name || p.name.trim().length < 3) return false;
            const lo = p.name.toLowerCase();
            if (headerWords.some(w => lo === w)) return false;
            if (p.name.trim().split(" ").length > 5) return false;
            return true;
          });
        if (cleaned.length === 0) { setScanError("No patients found. Try a clearer photo."); }
        else {
          // Enrich each scanned patient with panel-matching result
          const enriched = cleaned.map(sp => {
            const match = findMatchInPanel(sp.name, sp.mrn, sp.dob, patients);
            return { ...sp, matchStatus: match.status, matchedPatient: match.matchedPatient, matchConfidence: match.confidence };
          });
          setScannedPatients(enriched);
          setSelectedScanned(enriched.map((_, i) => i));
          // Pre-fill decisions: existing→link, new→create, possible→null (needs user input)
          const decisions = {};
          enriched.forEach((sp, i) => {
            decisions[i] = sp.matchStatus === "existing" ? "link"
                         : sp.matchStatus === "new"      ? "create"
                         : null;
          });
          setUserDecisions(decisions);
        }
      } catch(err) { setScanError("Could not read image: " + (err.message || "Unknown error")); }
      setScanLoading(false);
    };
    reader.readAsDataURL(file);
  };

  const confirmClinicScanAdd = () => {
    const toLink   = [];   // IDs of existing patients to add to today
    const toCreate = [];   // new patient objects to create
    selectedScanned.forEach((idx, i) => {
      const sp  = scannedPatients[idx];
      const dec = userDecisions[idx];
      if ((sp.matchStatus === "existing" || dec === "link") && sp.matchedPatient) {
        toLink.push(sp.matchedPatient.id);
      } else {
        toCreate.push({
          id: Date.now() + toCreate.length + 1000,
          name: sp.name.trim(),
          dob: sp.dob || "",
          mrn: sp.mrn || `MRN-${Math.floor(Math.random()*900000+100000)}`,
          background: "", todaysReason: sp.reason || "", recentTesting: "",
          previousClinicNote: "", visitHistory: [], activeIssues: [], vaccinations: [], extractionFocus: "", extractedAt: null, noteExtractedAt: null, previousClinicNoteDate: null, vaccinations: [], extractionFocus: "", extractedAt: null, noteExtractedAt: null, previousClinicNoteDate: null,
          inTodaysSession: true, status: "pending",
          encounterNotes: "", previousNotes: [],
          transcript: [], transcriptHistory: [], transcriptDate: null,
          note: "", noteGeneratedAt: null, tasks: [],
        });
      }
    });
    onScanConfirmed({ toLink, toCreate });
    resetScan();
  };

  // Disable confirm if any selected patient has an unresolved "possible" match
  const pendingDecisions = selectedScanned.filter(i =>
    scannedPatients[i] && scannedPatients[i].matchStatus === "possible" && !userDecisions[i]
  );
  const canConfirm = selectedScanned.length > 0 && pendingDecisions.length === 0;
  const linkCount   = selectedScanned.filter(i => userDecisions[i] === "link").length;
  const createCount = selectedScanned.filter(i => userDecisions[i] === "create").length;

  const today = patients.filter(p => p.inTodaysSession);
  const todayDone = today.filter(p => p.status === "complete").length;

  const searchResults = search.trim().length >= 2
    ? patients.filter(p =>
        p.name.toLowerCase().includes(search.toLowerCase()) ||
        (p.mrn || "").toLowerCase().includes(search.toLowerCase())
      ).slice(0, 20)
    : [];

  const statusColor = (s) => ({
    pending: "bg-amber-100 text-amber-700",
    "in-encounter": "bg-orange-100 text-orange-700",
    complete: "bg-green-100 text-green-700",
  }[s] || "bg-slate-100 text-slate-600");

  const statusLabel = (s) => ({ pending: "Pending", "in-encounter": "In Visit", complete: "Complete" }[s] || "Pending");

  return (
    <div className="flex flex-col min-h-screen">

      {/* ── Clinic Scan Modal ──────────────────────────────────────────────── */}
      {showScanModal && (
        <div style={{position:"fixed",inset:0,zIndex:9999,display:"flex",flexDirection:"column",background:"rgba(0,0,0,0.55)"}}>
          <div style={{marginTop:"auto",background:"white",borderRadius:"24px 24px 0 0",maxHeight:"90vh",overflowY:"auto",width:"100%"}}>
            <div style={{padding:"20px 20px 14px",borderBottom:"1px solid #f1f5f9",display:"flex",alignItems:"flex-start",justifyContent:"space-between"}}>
              <div>
                <div style={{fontSize:17,fontWeight:700,color:"#0f172a"}}>Scan Today's Schedule</div>
                <div style={{fontSize:12,color:"#94a3b8",marginTop:2}}>Photo the appointment list — patients auto-added to Today's Session</div>
              </div>
              <button onClick={() => { setShowScanModal(false); setScanPreview(null); setScannedPatients([]); setSelectedScanned([]); setScanError(""); }}
                style={{background:"none",border:"none",cursor:"pointer",color:"#94a3b8",padding:4,fontSize:20,lineHeight:1}}>✕</button>
            </div>
            <div style={{padding:"16px 20px 32px",display:"flex",flexDirection:"column",gap:16}}>
              <input ref={clinicFileInputRef} type="file" accept="image/*" capture="environment" style={{display:"none"}} onChange={handleClinicScanImage} />

              {!scanPreview && scannedPatients.length === 0 && (
                <button onClick={() => { if (!getApiKey()) { setScanError("API key required — add it in Settings first."); return; } clinicFileInputRef.current && clinicFileInputRef.current.click(); }}
                  style={{width:"100%",border:"2px dashed #2dd4bf",borderRadius:16,padding:"32px 16px",background:"none",cursor:"pointer",display:"flex",flexDirection:"column",alignItems:"center",gap:10,color:"#0d9488"}}>
                  <div style={{width:52,height:52,borderRadius:"50%",background:"#f0fdfa",display:"flex",alignItems:"center",justifyContent:"center"}}>
                    <FileText size={24} color="#0d9488" />
                  </div>
                  <div style={{textAlign:"center"}}>
                    <div style={{fontSize:14,fontWeight:700,color:"#0f172a"}}>Take Photo or Choose Image</div>
                    <div style={{fontSize:12,color:"#94a3b8",marginTop:2}}>Appointment sheet, printed schedule, or clinic list</div>
                  </div>
                </button>
              )}

              {scanPreview && scanLoading && (
                <img src={scanPreview} alt="Scanned" style={{width:"100%",borderRadius:12,border:"1px solid #e2e8f0",maxHeight:120,objectFit:"contain"}} />
              )}
              {scanPreview && !scanLoading && scannedPatients.length === 0 && (
                <div style={{display:"flex",flexDirection:"column",gap:8}}>
                  <img src={scanPreview} alt="Scanned" style={{width:"100%",borderRadius:12,border:"1px solid #e2e8f0",maxHeight:120,objectFit:"contain"}} />
                  <button onClick={() => { setScanPreview(null); setScannedPatients([]); setSelectedScanned([]); setScanError(""); if (clinicFileInputRef.current) clinicFileInputRef.current.value = ""; }}
                    style={{background:"none",border:"none",cursor:"pointer",fontSize:12,color:"#64748b",textDecoration:"underline",textAlign:"left"}}>Retake photo</button>
                </div>
              )}

              {scanLoading && (
                <div style={{display:"flex",alignItems:"center",justifyContent:"center",gap:8,padding:"16px 0",color:"#0d9488"}}>
                  <Loader2 size={18} className="animate-spin" />
                  <span style={{fontSize:14,fontWeight:600}}>Reading schedule…</span>
                </div>
              )}
              {scanError && <div style={{background:"#fef2f2",border:"1px solid #fecaca",borderRadius:12,padding:"10px 14px",fontSize:13,color:"#dc2626"}}>{scanError}</div>}

              {scannedPatients.length > 0 && (
                <div style={{display:"flex",flexDirection:"column",gap:12}}>
                  {/* Header row */}
                  <div style={{display:"flex",alignItems:"center",justifyContent:"space-between"}}>
                    <span style={{fontSize:14,fontWeight:700,color:"#0f172a"}}>{scannedPatients.length} patients found</span>
                    <button onClick={() => setSelectedScanned(selectedScanned.length === scannedPatients.length ? [] : scannedPatients.map((_, i) => i))}
                      style={{fontSize:12,fontWeight:600,color:"#0d9488",background:"#f0fdfa",border:"1px solid #99f6e4",borderRadius:8,padding:"4px 10px",cursor:"pointer"}}>
                      {selectedScanned.length === scannedPatients.length ? "Deselect all" : "Select all"}
                    </button>
                  </div>

                  {/* Legend */}
                  <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
                    <span style={{fontSize:10,fontWeight:700,background:"#f0fdf4",color:"#166534",border:"1px solid #bbf7d0",borderRadius:6,padding:"2px 7px"}}>● Found in panel</span>
                    <span style={{fontSize:10,fontWeight:700,background:"#fffbeb",color:"#92400e",border:"1px solid #fde68a",borderRadius:6,padding:"2px 7px"}}>● Possible match</span>
                    <span style={{fontSize:10,fontWeight:700,background:"#eff6ff",color:"#1e40af",border:"1px solid #bfdbfe",borderRadius:6,padding:"2px 7px"}}>● New patient</span>
                  </div>

                  {/* Patient cards — three states */}
                  <div style={{display:"flex",flexDirection:"column",gap:8}}>
                    {scannedPatients.map((sp, i) => {
                      const isSel = selectedScanned.includes(i);
                      const dec   = userDecisions[i];
                      const isExisting = sp.matchStatus === "existing";
                      const isPossible = sp.matchStatus === "possible";
                      const isNew      = sp.matchStatus === "new";

                      // Card border color by status
                      const borderCol = isExisting ? (isSel ? "#16a34a" : "#bbf7d0")
                                      : isPossible ? (isSel ? "#f59e0b" : "#fde68a")
                                      : (isSel ? "#3b82f6" : "#bfdbfe");
                      const bgCol     = isExisting ? "#f0fdf4"
                                      : isPossible ? "#fffbeb"
                                      : "#eff6ff";

                      return (
                        <div key={i} style={{borderRadius:12,border:`2px solid ${isSel ? borderCol : "#e2e8f0"}`,background: isSel ? bgCol : "white",overflow:"hidden",transition:"border-color 0.15s"}}>
                          {/* Checkbox row */}
                          <label htmlFor={"cspt-"+i} style={{display:"flex",alignItems:"flex-start",gap:10,padding:"10px 12px",cursor:"pointer"}}>
                            <input id={"cspt-"+i} type="checkbox" checked={isSel}
                              onChange={() => setSelectedScanned(prev => prev.includes(i) ? prev.filter(x => x !== i) : [...prev, i])}
                              style={{marginTop:3,width:15,height:15,accentColor: isExisting ? "#16a34a" : isPossible ? "#f59e0b" : "#3b82f6",cursor:"pointer",flexShrink:0}} />
                            <div style={{flex:1,minWidth:0}}>
                              {/* Status badge */}
                              <div style={{fontSize:9,fontWeight:800,letterSpacing:"0.8px",marginBottom:3,
                                color: isExisting ? "#166534" : isPossible ? "#92400e" : "#1e40af"}}>
                                {isExisting ? `✓ FOUND IN PANEL — ${sp.matchConfidence}`
                                : isPossible ? `⚠ SIMILAR NAME FOUND — ${sp.matchConfidence}`
                                : "＋ NEW PATIENT — will create new record"}
                              </div>
                              {/* Scanned name */}
                              <div style={{fontSize:14,fontWeight:700,color:"#0f172a"}}>{sp.name}</div>
                              {sp.dob && <div style={{fontSize:10,color:"#64748b"}}>DOB: {sp.dob}</div>}
                              {sp.mrn && <div style={{fontSize:10,color:"#64748b"}}>MRN: {sp.mrn}</div>}
                              {sp.reason && <div style={{fontSize:10,color:"#64748b",marginTop:1}}>Reason: {sp.reason}</div>}
                              {/* Existing patient preview */}
                              {isExisting && sp.matchedPatient && sp.matchedPatient.background && (
                                <div style={{fontSize:10,color:"#166534",marginTop:4,fontStyle:"italic",
                                  background:"#dcfce7",padding:"3px 7px",borderRadius:6}}>
                                  Panel: {sp.matchedPatient.background.substring(0, 70)}{sp.matchedPatient.background.length > 70 ? "…" : ""}
                                </div>
                              )}
                              {isExisting && (
                                <div style={{fontSize:10,color:"#166534",marginTop:4,fontWeight:600}}>
                                  → Will add to today using existing record with full history
                                </div>
                              )}
                            </div>
                          </label>

                          {/* POSSIBLE match — decision buttons */}
                          {isPossible && isSel && (
                            <div style={{borderTop:"1px solid #fde68a",padding:"8px 12px",background:"#fef9c3"}}>
                              <div style={{fontSize:11,fontWeight:700,color:"#92400e",marginBottom:6}}>
                                Is this the same as: <span style={{color:"#0f172a"}}>{sp.matchedPatient?.name}</span>
                                {sp.matchedPatient?.background && <span style={{color:"#64748b",fontWeight:400}}> — {sp.matchedPatient.background.substring(0,50)}…</span>}?
                              </div>
                              <div style={{display:"flex",gap:6}}>
                                <button onClick={() => setUserDecisions(prev => ({...prev, [i]: "link"}))}
                                  style={{flex:1,padding:"7px 4px",borderRadius:8,border:`2px solid ${dec==="link"?"#16a34a":"#e2e8f0"}`,
                                    background: dec==="link" ? "#dcfce7" : "white",cursor:"pointer",fontSize:11,fontWeight:700,
                                    color: dec==="link" ? "#166534" : "#475569"}}>
                                  ✓ Yes, same patient
                                </button>
                                <button onClick={() => setUserDecisions(prev => ({...prev, [i]: "create"}))}
                                  style={{flex:1,padding:"7px 4px",borderRadius:8,border:`2px solid ${dec==="create"?"#3b82f6":"#e2e8f0"}`,
                                    background: dec==="create" ? "#eff6ff" : "white",cursor:"pointer",fontSize:11,fontWeight:700,
                                    color: dec==="create" ? "#1e40af" : "#475569"}}>
                                  ＋ No, different person
                                </button>
                              </div>
                              {!dec && <div style={{fontSize:10,color:"#b45309",marginTop:4,fontWeight:600}}>⚠ Please confirm before adding</div>}
                              {dec === "link"   && <div style={{fontSize:10,color:"#166534",marginTop:4,fontWeight:600}}>→ Will use existing record with full history</div>}
                              {dec === "create" && <div style={{fontSize:10,color:"#1e40af",marginTop:4,fontWeight:600}}>→ Will create a new patient record</div>}
                            </div>
                          )}
                        </div>
                      );
                    })}
                  </div>

                  {/* Pending decisions warning */}
                  {pendingDecisions.length > 0 && (
                    <div style={{background:"#fffbeb",border:"1px solid #fde68a",borderRadius:10,padding:"8px 12px",fontSize:11,color:"#92400e",fontWeight:600}}>
                      ⚠ {pendingDecisions.length} patient{pendingDecisions.length>1?"s":""} need{pendingDecisions.length===1?"s":""} a decision before you can confirm.
                    </div>
                  )}

                  {/* Summary + Confirm button */}
                  {canConfirm && (linkCount > 0 || createCount > 0) && (
                    <div style={{background:"#f0fdf4",border:"1px solid #bbf7d0",borderRadius:10,padding:"6px 12px",fontSize:11,color:"#166534"}}>
                      {linkCount > 0 && <span>✓ {linkCount} existing record{linkCount>1?"s":""} linked to today  </span>}
                      {createCount > 0 && <span>＋ {createCount} new patient record{createCount>1?"s":""} created</span>}
                    </div>
                  )}

                  <button disabled={!canConfirm} onClick={confirmClinicScanAdd}
                    style={{width:"100%",background: !canConfirm ? "#cbd5e1" : "#16a34a",color:"white",border:"none",
                      borderRadius:16,padding:"16px",fontSize:15,fontWeight:700,
                      cursor: !canConfirm ? "not-allowed" : "pointer",
                      display:"flex",alignItems:"center",justifyContent:"center",gap:8,
                      boxShadow: canConfirm ? "0 4px 12px rgba(22,163,74,0.3)" : "none"}}>
                    <UserPlus size={18} />
                    Add {selectedScanned.length} Patient{selectedScanned.length!==1?"s":""} to Today's Session
                  </button>
                </div>
              )}
            </div>
          </div>
        </div>
      )}

      <div className="bg-white border-b border-slate-200 px-5 pt-12 pb-4">
        <div className="flex items-center justify-between mb-3">
          <div>
            <h1 className="text-slate-900 text-2xl font-bold">Clinic</h1>
            <p className="text-slate-400 text-xs mt-0.5">{todayDone}/{today.length} patients seen today</p>
          </div>
          <div className="flex items-center gap-2">
            <button onClick={onSettings} className="bg-black text-white w-8 h-8 rounded-full flex items-center justify-center hover:bg-slate-700 transition-colors"><Settings size={16} /></button>
            <button onClick={() => { setShowScanModal(true); setScanError(""); setScanPreview(null); setScannedPatients([]); setSelectedScanned([]); }}
              className="bg-black text-white w-8 h-8 rounded-full flex items-center justify-center hover:bg-slate-700 transition-colors" title="Scan today's schedule">
              <FileText size={16} />
            </button>
            <button onClick={onAddPatient} className="bg-black text-white w-8 h-8 rounded-full flex items-center justify-center hover:bg-slate-700 transition-colors"><UserPlus size={16} /></button>
          </div>
        </div>
        {/* Search bar */}
        <div className="flex items-center gap-2 bg-slate-100 rounded-2xl px-3 py-2.5">
          <Search size={15} className="text-slate-400 flex-shrink-0" />
          <input
            value={search}
            onChange={e => setSearch(e.target.value)}
            placeholder="Search your patient panel by name or MRN…"
            className="flex-1 bg-transparent text-sm text-slate-700 outline-none placeholder-slate-400"
          />
          {search && <button onClick={() => setSearch("")} className="text-slate-400 hover:text-slate-700"><X size={14} /></button>}
        </div>
      </div>

      <div className="flex-1 overflow-y-auto px-4 pt-4 pb-28 space-y-4">

        {/* Search results */}
        {search.trim().length >= 2 && (
          <div>
            <p className="text-xs font-bold text-slate-500 uppercase tracking-widest mb-2">
              {searchResults.length > 0 ? `${searchResults.length} result${searchResults.length !== 1 ? "s" : ""}` : "No patients found"}
            </p>
            {searchResults.map(p => (
              <div key={p.id} className="bg-white rounded-2xl border border-slate-100 shadow-sm mb-2 flex items-center">
                <button onClick={() => onSelectPatient(p)} className="flex-1 text-left px-4 py-3">
                  <div className="flex items-center gap-2">
                    <div className="w-8 h-8 rounded-xl bg-teal-100 text-teal-700 flex items-center justify-center text-xs font-bold flex-shrink-0">
                      {p.name.split(" ").map(n => n[0]).slice(0,2).join("")}
                    </div>
                    <div>
                      <p className="text-sm font-bold text-slate-800">{p.name}</p>
                      <p className="text-xs text-slate-500">{p.mrn}{p.background ? ` · ${p.background.substring(0,40)}…` : ""}</p>
                    </div>
                  </div>
                </button>
                <button onClick={() => onToggleToday(p.id)}
                  className={`mr-3 text-xs font-bold px-2.5 py-1.5 rounded-xl transition-colors ${p.inTodaysSession ? "bg-teal-100 text-teal-700" : "bg-slate-100 text-slate-600 hover:bg-teal-50"}`}>
                  {p.inTodaysSession ? "In Today ✓" : "+ Today"}
                </button>
              </div>
            ))}
          </div>
        )}

        {/* Today's Session */}
        {!search.trim() && (
          <>
            <div>
              <div className="flex items-center justify-between mb-2">
                <span className="text-xs font-bold text-slate-600 uppercase tracking-widest">Today's Session</span>
                <span className="text-xs text-slate-400">{today.length} patient{today.length !== 1 ? "s" : ""}</span>
              </div>
              {today.length === 0 ? (
                <div className="text-center py-6 border border-dashed border-slate-200 rounded-2xl">
                  <p className="text-xs font-semibold text-slate-400">No patients added for today.</p>
                  <p className="text-xs text-slate-300 mt-1">Search your panel above and tap "+ Today" to add.</p>
                </div>
              ) : (
                <div className="space-y-2">
                  {today.map(p => (
                    <div key={p.id} className="bg-white rounded-2xl border border-slate-100 shadow-sm overflow-hidden">
                      <button onClick={() => onSelectPatient(p)} className="w-full text-left p-4">
                        <div className="flex items-center gap-2.5">
                          <div className="w-9 h-9 rounded-xl bg-teal-100 text-teal-700 flex items-center justify-center text-sm font-bold flex-shrink-0">
                            {p.name.split(" ").map(n => n[0]).slice(0,2).join("")}
                          </div>
                          <div className="flex-1 min-w-0">
                            <div className="flex items-center gap-2">
                              <span className="font-bold text-slate-800 text-sm">{p.name}</span>
                              <span className={`text-xs font-bold px-2 py-0.5 rounded-full ${statusColor(p.status)}`}>{statusLabel(p.status)}</span>
                            </div>
                            {p.todaysReason && <p className="text-xs text-slate-500 mt-0.5 truncate">{p.todaysReason}</p>}
                            {!p.todaysReason && p.background && <p className="text-xs text-slate-400 mt-0.5 truncate">{p.background}</p>}
                          </div>
                          <ChevronRight size={16} className="text-slate-400 flex-shrink-0" />
                        </div>
                      </button>
                    </div>
                  ))}
                </div>
              )}
            </div>
            <p className="text-center text-xs text-slate-400 mt-2">Search your panel above to add patients to today's session</p>
          </>
        )}
      </div>

      {/* Bottom nav */}
      <div style={{
          position:"fixed", bottom:0, left:0, right:0, zIndex:50,
          background:"rgba(255,255,255,0.97)",
          backdropFilter:"blur(10px)",
          borderTop:"1px solid #f1f5f9",
          display:"flex", justifyContent:"space-around", alignItems:"center",
          paddingTop:12,
          paddingBottom:"calc(12px + env(safe-area-inset-bottom, 20px))",
          paddingLeft:"env(safe-area-inset-left, 0px)",
          paddingRight:"env(safe-area-inset-right, 0px)",
        }}>
        <button className="flex flex-col items-center text-teal-600 gap-0.5">
          <Users size={21} /><span className="text-xs font-semibold">Patients</span>
        </button>
        <button onClick={onSettings} className="flex flex-col items-center text-slate-500 gap-0.5">
          <Settings size={21} /><span className="text-xs font-medium">Settings</span>
        </button>
      </div>
    </div>
  );
};

// ─── Clinic: Add Patient Screen ───────────────────────────────────────────────
const AddClinicPatientScreen = ({ onBack, onAdd }) => {
  const [form, setForm] = useState({ name: "", dob: "", mrn: "" });
  const set = (k, v) => setForm(prev => ({ ...prev, [k]: v }));

  const submit = () => {
    if (!form.name.trim()) return;
    onAdd({
      id: Date.now(),
      name: form.name.trim(),
      dob: form.dob.trim(),
      mrn: form.mrn.trim() || `MRN-${Math.floor(Math.random()*900000+100000)}`,
      background: "", todaysReason: "", recentTesting: "", previousClinicNote: "",
      visitHistory: [], activeIssues: [], vaccinations: [], extractionFocus: "", extractedAt: null, noteExtractedAt: null, previousClinicNoteDate: null,
      inTodaysSession: false, status: "pending",
      encounterNotes: "", previousNotes: [],
      transcript: [], transcriptHistory: [], transcriptDate: null,
      note: "", noteGeneratedAt: null, tasks: [],
    });
  };

  return (
    <div className="flex flex-col min-h-screen bg-slate-50">
      <div className="bg-white border-b border-slate-200 px-5 pt-12 pb-5">
        <div className="flex items-center gap-3">
          <button onClick={onBack} className="text-slate-700 p-1 -ml-1"><ArrowLeft size={22} /></button>
          <div>
            <h1 className="text-slate-900 text-xl font-bold">Add Clinic Patient</h1>
            <p className="text-slate-500 text-xs mt-0.5">Add to your permanent patient panel</p>
          </div>
        </div>
      </div>
      <div className="flex-1 px-4 py-5 space-y-4">
        {[
          { key: "name", label: "Full Name *", placeholder: "e.g. Margaret Chen" },
          { key: "dob",  label: "Date of Birth", placeholder: "e.g. Jan 15, 1956" },
          { key: "mrn",  label: "MRN (optional)", placeholder: "Auto-generated if blank" },
        ].map(({ key, label, placeholder }) => (
          <div key={key}>
            <p className="text-xs font-semibold text-slate-500 mb-1">{label}</p>
            <input value={form[key]} onChange={e => set(key, e.target.value)} placeholder={placeholder}
              className="w-full border border-slate-200 rounded-2xl px-4 py-3 text-sm outline-none focus:ring-2 focus:ring-teal-400 bg-white" />
          </div>
        ))}
        <p className="text-xs text-slate-400 leading-relaxed">Patient background, visit history, and testing results can be added from the patient's Pre-Visit tab.</p>
      </div>
      <div className="px-4 pb-8">
        <button onClick={submit} disabled={!form.name.trim()}
          className="w-full bg-teal-600 disabled:bg-slate-300 text-white font-bold py-4 rounded-2xl text-sm shadow-lg hover:bg-teal-700 transition-colors">
          Add Patient to Panel
        </button>
      </div>
    </div>
  );
};

// ─── Screen: Dashboard ────────────────────────────────────────────────────────

const DashboardScreen = ({ patients, onBack, onSelectPatient }) => {
  const allTasks = patients.flatMap(p => p.tasks.map(t => ({ ...t, patientName: p.name, room: p.room })));
  const urgentPending = allTasks.filter(t => !t.done && t.urgent);
  const normalPending = allTasks.filter(t => !t.done && !t.urgent);

  const statusCounts = {
    total: patients.length,
    pending: patients.filter(p => p.status === "pending").length,
    active: patients.filter(p => ["pre-rounded", "in-encounter"].includes(p.status)).length,
    done: patients.filter(p => p.status === "post-rounded").length,
  };

  return (
    <div className="flex flex-col min-h-screen">
      <div className="bg-white border-b border-slate-200 px-5 pt-12 pb-5">
        <div className="flex items-center gap-3">
          <button onClick={onBack} className="text-slate-700 hover:text-slate-900 p-1 -ml-1"><ArrowLeft size={22} /></button>
          <div>
            <h1 className="text-slate-900 text-xl font-bold">Rounding Dashboard</h1>
            <p className="text-slate-500 text-xs">Sunday, April 5, 2026</p>
          </div>
        </div>
      </div>

      <div className="px-4 py-5 space-y-5 pb-24">
        {/* Stats */}
        <div className="grid grid-cols-4 gap-2">
          {[
            { label: "Total", value: statusCounts.total, cls: "bg-slate-100 text-slate-700" },
            { label: "Pending", value: statusCounts.pending, cls: "bg-amber-100 text-amber-700" },
            { label: "In Progress", value: statusCounts.active, cls: "bg-blue-100 text-blue-700" },
            { label: "Done", value: statusCounts.done, cls: "bg-green-100 text-green-700" },
          ].map(s => (
            <div key={s.label} className={`${s.cls} rounded-xl p-3 text-center`}>
              <p className="text-2xl font-bold">{s.value}</p>
              <p className="text-xs font-semibold mt-0.5 leading-tight">{s.label}</p>
            </div>
          ))}
        </div>

        {/* Urgent tasks */}
        {urgentPending.length > 0 && (
          <section>
            <SectionHeader label={`Urgent Tasks (${urgentPending.length})`} color="text-red-500" />
            <div className="space-y-2">

// Renders a SOAP/clinical note with bold section headers instead of raw <pre>
const FormattedNote = ({ note }) => {
  if (!note) return null;

  // Parse inline **bold** and *italic* markdown into React spans
  const renderInline = (text) => {
    const parts = [];
    let remaining = text;
    let key = 0;
    while (remaining.length > 0) {
      const boldIdx = remaining.indexOf('**');
      if (boldIdx !== -1) {
        if (boldIdx > 0) parts.push(<span key={key++}>{remaining.slice(0, boldIdx)}</span>);
        const endBold = remaining.indexOf('**', boldIdx + 2);
        if (endBold !== -1) {
          parts.push(<strong key={key++} className="font-semibold text-slate-800">{remaining.slice(boldIdx + 2, endBold)}</strong>);
          remaining = remaining.slice(endBold + 2);
        } else {
          parts.push(<span key={key++}>{remaining}</span>);
          remaining = '';
        }
      } else {
        parts.push(<span key={key++}>{remaining}</span>);
        remaining = '';
      }
    }
    return parts;
  };

  const lines = note.split('\n');
  return (
    <div className="space-y-0.5 text-sm leading-relaxed text-slate-700">
      {lines.map((line, i) => {
        const trimmed = line.trim();
        // Section headers: ALL CAPS or **HEADER:** pattern
        const isSectionHeader = /^\*\*[A-Z][A-Z\s&\/\-]+:\*\*$/.test(trimmed) ||
                                /^[A-Z][A-Z\s&\/\-]{2,}:$/.test(trimmed) ||
                                /^[A-Z][A-Z\s&\/\-]{2,}:\s*$/.test(trimmed);
        const isBullet = trimmed.startsWith('•') || trimmed.startsWith('*') || trimmed.startsWith('-') || /^\d+\./.test(trimmed);
        if (!trimmed) return <div key={i} className="h-2" />;
        if (isSectionHeader) {
          const clean = trimmed.replace(/\*\*/g, '').replace(/:$/, '').trim();
          return (
            <p key={i} className="text-xs font-bold text-slate-500 uppercase tracking-widest mt-4 mb-1 first:mt-0">
              {clean}
            </p>
          );
        }
        return (
          <p key={i} className={`leading-relaxed ${isBullet ? "ml-2" : ""}`}>
            {renderInline(trimmed)}
          </p>
        );
      })}
    </div>
  );
};

// Parses a spoken sentence into patient form fields
const parseSpokenDetails = (text) => {
  const updates = {};

  // Name: "patient John Smith" / "name John Smith" / leading "First Last"
  const nameMatch =
    text.match(/(?:patient|name)[:\s]+([A-Z][a-z]+(?: [A-Z][a-z]+)+)/i) ||
    text.match(/^([A-Z][a-z]+ [A-Z][a-z]+)/);
  if (nameMatch) updates.name = nameMatch[1].trim();

  // Age: "65 years" / "age 65" / "aged 65"
  const ageMatch =
    text.match(/(?:age[d]?|is)[:\s]+(\d{2,3})/i) ||
    text.match(/(\d{2,3})[- ]?(?:year|yr)/i);
  if (ageMatch) updates.age = (ageMatch[1] || ageMatch[2]);

  // Room: "room 4B-12" / "bed 4B"
  const roomMatch =
    text.match(/(?:room|bed)[:\s]+([A-Za-z0-9]+[-–]?[A-Za-z0-9]*)/i);
  if (roomMatch) updates.room = roomMatch[1].trim();

  // Day number: "day 3" / "3 days"
  const dayMatch =
    text.match(/day[:\s]+(\d+)/i) ||
    text.match(/(\d+)[- ]day/i);
  if (dayMatch) updates.dayNum = dayMatch[1];

  // Diagnosis: "diagnosis X" / "admitted for X" / "presenting with X"
  const diagMatch =
    text.match(/(?:diagnosis|diagnosed with|admitted (?:for|with)|presenting with)[:\s]+(.+?)(?:,|\.|day\s|\s+room|\s+age|$)/i);
  if (diagMatch) updates.diagnosis = diagMatch[1].trim();

  // Encounter type
  if (/new admission/i.test(text)) updates.encType = "new";
  if (/consult|consultation|consulted/i.test(text)) updates.encType = "consult";
  if (/follow[- ]?up/i.test(text)) updates.encType = "follow-up";

  return updates;
};

                type="number"
                min="0"
                className="w-full text-sm outline-none text-right text-slate-700 placeholder-slate-300"
              />
            </FormRow>

            <FormRow label="Admission Date">
              <input
                value={form.admitDate}
                onChange={e => set("admitDate", e.target.value)}
                placeholder="e.g. Apr 5 (auto if blank)"
                className="w-full text-sm outline-none text-right text-slate-700 placeholder-slate-300"
              />
            </FormRow>

            <div className="px-4 py-3">
              <label className="text-xs font-semibold text-slate-500 uppercase tracking-wide block mb-2">Specialty</label>
              <select
                value={form.specialty}
                onChange={e => set("specialty", e.target.value)}
                className="w-full text-sm text-slate-700 outline-none bg-transparent"
              >
                {SPECIALTIES.map(s => <option key={s} value={s}>{s}</option>)}
              </select>
            </div>

          </div>
        </section>

        {/* Medications */}
        <section>
          <SectionHeader label="Current Medications" />
          <div className="bg-white rounded-2xl border border-slate-100 shadow-sm p-4 space-y-3">
            <p className="text-xs text-slate-400">Add active medications. You can add more later in the encounter.</p>
            <div className="flex gap-2">
              <input
                value={medInput}
                onChange={e => setMedInput(e.target.value)}
                onKeyDown={e => e.key === "Enter" && addMed()}
                placeholder="e.g. Metoprolol 25mg PO BID"
                className="flex-1 text-sm border border-slate-200 rounded-xl px-3 py-2 outline-none placeholder-slate-400"
              />
              <button onClick={addMed} className="bg-black text-white rounded-xl px-3 py-2">
                <Plus size={16} />
              </button>
            </div>
            {medications.length > 0 && (
              <div className="space-y-2 pt-1">
                {medications.map((med, i) => (
                  <div key={i} className="flex items-center justify-between bg-slate-50 rounded-xl px-3 py-2.5">
                    <span className="text-sm text-slate-700 flex-1">{med.name}</span>
                    <button onClick={() => removeMed(i)} className="text-slate-600 hover:text-red-600 ml-2">
                      <X size={15} />
                    </button>
                  </div>
                ))}
              </div>
            )}
          </div>
        </section>

        {/* Optional pre-round note */}
        <section>
          <SectionHeader label="Initial Notes (Optional)" />
          <div className={`bg-white rounded-2xl border shadow-sm p-4 transition-colors ${fieldDictating === "attendingNote" ? "border-red-300" : "border-slate-100"}`}>
            {fieldDictating === "attendingNote" && (
              <div className="flex items-center gap-2 mb-2">
                <span className="w-2 h-2 rounded-full bg-red-500 animate-pulse" />
                <span className="text-xs font-semibold text-red-500">Listening…</span>
              </div>
            )}
            <textarea
              value={form.attendingNote}
              onChange={e => { if (fieldDictating !== "attendingNote") set("attendingNote", e.target.value); }}
              readOnly={fieldDictating === "attendingNote"}
              placeholder="Tap 'Dictate' to speak, or type any initial observations, reason for admission, or pre-round context…"
              rows={4}
              className={`w-full text-sm text-slate-700 placeholder-slate-400 resize-none outline-none leading-relaxed ${fieldDictating === "attendingNote" ? "cursor-default" : ""}`}
            />
            {fieldDictating === "attendingNote" && fieldInterim && (
              <p className="text-sm text-teal-700 italic mt-2 leading-relaxed border-t border-red-100 pt-2">
                <span className="text-xs font-semibold text-red-500 not-italic mr-1">Hearing:</span>
                {fieldInterim}<span className="animate-pulse">…</span>
              </p>
            )}
            <div className="flex items-center gap-2 pt-3 border-t border-slate-100 mt-1">
              <button
                type="button"
                onClick={() => toggleFieldDictation("attendingNote")}
                className={`flex items-center gap-1.5 text-sm font-semibold px-3 py-1.5 rounded-xl transition-colors ${
                  fieldDictating === "attendingNote" ? "bg-red-500 text-white" : "bg-black text-white hover:bg-slate-800"
                }`}
              >
                {fieldDictating === "attendingNote"
                  ? <><MicOff size={15} /> Stop Dictating</>
                  : <><Mic size={15} /> Dictate</>}
              </button>
              <span className="text-xs text-slate-400 flex-1">Dictates continuously until you tap Stop</span>
            </div>
          </div>
          {/* Hint — so user knows the note carries forward */}
          <div className="flex items-center gap-1.5 mt-2 px-1">
            <CheckCircle size={13} className="text-teal-500 flex-shrink-0" />
            <p className="text-xs text-teal-700 font-medium">This note automatically carries forward to the Pre-Round tab — no separate save needed.</p>
          </div>
        </section>

        {/* Validation errors summary */}
        {Object.keys(errors).length > 0 && (
          <div className="bg-red-50 border border-red-200 rounded-2xl p-4">
            <p className="text-sm font-semibold text-red-700 mb-1">Please fix the following:</p>
            {Object.values(errors).map((e, i) => (
              <p key={i} className="text-xs text-red-600">• {e}</p>
            ))}
          </div>
        )}

        {/* Save button — inside form so it's always visible on scroll */}
        <button
          onClick={handleSave}
          disabled={saved || extractingAdmission}
          className={`w-full font-semibold py-4 rounded-2xl flex items-center justify-center gap-2 transition-all shadow-lg ${
            saved ? "bg-green-500 text-white" : extractingAdmission ? "bg-teal-600 text-white" : "bg-black hover:bg-slate-800 text-white"
          }`}
        >
          {saved
            ? <><CheckCircle size={20} /> Patient Added to Rounds!</>
            : extractingAdmission
              ? <><Loader2 size={20} className="animate-spin" /> Extracting admission details…</>
              : <><UserPlus size={20} /> Add to Today's Rounds</>}
        </button>

      </div>
    </div>
  );
};

  const [testResult, setTestResult] = useState(null);
  const [testingDg, setTestingDg] = useState(false);
  const [dgTestResult, setDgTestResult] = useState(null);
  // JUNE 6 TEST: New provider states
  const [anthropicKey, setAnthropicKey]   = useState(getAnthropicKey());
  const [azureKey, setAzureKey]           = useState(getAzureKey());

    setSaved(true);
    setTimeout(() => setSaved(false), 2000);

  const testKey = async () => {
    setTesting(true); setTestResult(null);
    localStorage.setItem("rounding_openai_key",   key.trim());
    localStorage.setItem("rounding_openai_model", model);
    try {
      const resp = await callOpenAI([{ role: "user", content: "Reply with exactly: API connection successful" }]);
      setTestResult({ ok: true, msg: resp.trim() });
    } catch(e) { setTestResult({ ok: false, msg: e.message }); }
    setTesting(false);
  };

  const testDeepgram = () => {
    // Deepgram REST API blocks browser fetch() due to CORS by design.
    // The correct test is a WebSocket connection — same protocol used for real recording.
    setTestingDg(true); setDgTestResult(null);
    const k = dgKey.trim();
    if (!k) { setDgTestResult({ ok: false, msg: "Enter a Deepgram API key first" }); setTestingDg(false); return; }

    const dgTestModel = (localStorage.getItem("rounding_dictation_engine") === "deepgram-nova3") ? "nova-3" : "nova-2-medical";
    const url = `wss://api.deepgram.com/v1/listen?model=${dgTestModel}`;
    let ws;
    let done = false;

    const finish = (ok, msg) => {
      if (done) return;
      done = true;
      setDgTestResult({ ok, msg });
      setTestingDg(false);
      try { ws.close(); } catch(e) {}
    };

    try {
      ws = new WebSocket(url, ["token", k]);

      // Timeout — if no response in 6s, assume failure
      const timer = setTimeout(() => finish(false, "Connection timed out — check your Deepgram API key"), 6000);

      ws.onopen = () => {
        clearTimeout(timer);
        finish(true, "✓ Deepgram connection successful — ready to use");
      };

      ws.onclose = (e) => {
        clearTimeout(timer);
        if (!done) {

          const msg = e.code === 1008 || e.code === 4000
            ? "Invalid Deepgram API key — check your key at console.deepgram.com"
            : `Connection closed (code ${e.code}) — check your API key`;
          finish(false, msg);
        }
      };

      ws.onerror = () => {
        clearTimeout(timer);
        finish(false, "WebSocket error — check your network connection and API key");
      };
